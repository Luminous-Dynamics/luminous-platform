name: Sovereign benchmark manifest schema

on:
  pull_request:
    paths:
      - "benchmarks/sovereign-compute-v0.1/**"
      - ".github/workflows/sovereign-compute-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate modelled example against JSON Schema 2020-12
        run: python -m jsonschema -V 2020-12 -i benchmarks/sovereign-compute-v0.1/example-modelled-run.json benchmarks/sovereign-compute-v0.1/benchmark-run.schema.json
