[package]
name = "edge-policy-observation-reconciler"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline receipt reconciler for Luminous Edge policy conformance"

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "edge-policy-observation-reconcile"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
