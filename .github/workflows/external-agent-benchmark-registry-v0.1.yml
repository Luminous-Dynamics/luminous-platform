name: external agent benchmark registry v0.1

on:
  pull_request:
    paths:
      - "benchmarks/external-agent-benchmark-registry-v0.1/**"
      - ".github/workflows/external-agent-benchmark-registry-v0.1.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/external-agent-benchmark-registry-v0.1/**"
      - ".github/workflows/external-agent-benchmark-registry-v0.1.yml"

permissions:
  contents: read

concurrency:
  group: external-agent-benchmark-registry-v0.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate source-qualified benchmark registry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned validation-only dependency
        run: python -m pip install --disable-pip-version-check --no-input -r benchmarks/external-agent-benchmark-registry-v0.1/requirements.txt
      - name: Validate schema, cross-field semantics and negative controls
        run: python benchmarks/external-agent-benchmark-registry-v0.1/validate_registry.py
