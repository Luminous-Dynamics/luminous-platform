name: Native Work Case Contract V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/work-case-v1/**"
      - "contracts/operations-event-v1/requirements.txt"
      - "scripts/run_unittest_suite.py"
      - "scripts/tests/**"
      - ".github/workflows/operations-event-contract.yml"
      - ".github/workflows/work-case-v1.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/work-case-v1/**"
      - "contracts/operations-event-v1/requirements.txt"
      - "scripts/run_unittest_suite.py"
      - "scripts/tests/**"
      - ".github/workflows/operations-event-contract.yml"
      - ".github/workflows/work-case-v1.yml"

permissions:
  contents: read

concurrency:
  group: work-case-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-work-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.12"

      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/work-case-v1-venv"

      - name: Install pinned JSON Schema validator
        run: "$RUNNER_TEMP/work-case-v1-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir -r contracts/operations-event-v1/requirements.txt

      - name: Self-test fail-closed test runner
        run: "$RUNNER_TEMP/work-case-v1-venv/bin/python" -m unittest discover -s scripts/tests -p 'test_run_unittest_suite.py' -v

      - name: Validate work-case model and SQLite persistence reference
        run: "$RUNNER_TEMP/work-case-v1-venv/bin/python" scripts/run_unittest_suite.py contracts/work-case-v1/tests --minimum-tests 28

      - name: Publish bounded qualification summary
        if: success()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Native Work Case Contract V1"
            echo "- Tested source revision: $SOURCE_SHA"
            echo "- Requires at least 28 discovered test cases and executes the entire discovered set; zero tests, import errors, failed tests, or count mismatches are failures."
            echo "- Covers schema, synthetic fixture, lifecycle model, local SQLite transactions/restart/idempotency and fault injection."
            echo "- Does not qualify power-loss guarantees, a production database, API tenant isolation, live ConnectWise behavior, SLA/billing, evidence truth, or remote execution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure validation did not modify checkout
        run: git diff --exit-code && test -z "$(git status --porcelain)"
