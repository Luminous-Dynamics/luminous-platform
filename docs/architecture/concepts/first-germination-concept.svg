<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">First Germination — Luminous Ambient concept</title>
  <desc id="desc">A calm, dark evergreen field with an organic network of fine mint filaments and sparse solar-gold nodes growing in from the right, leaving generous space on the left for desktop icons.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080E0C"/><stop offset="0.52" stop-color="#0A100E"/><stop offset="1" stop-color="#101F18"/>
    </linearGradient>
    <radialGradient id="fieldGlow" cx="78%" cy="52%" r="68%">
      <stop offset="0" stop-color="#235440" stop-opacity="0.40"/><stop offset="0.46" stop-color="#122A20" stop-opacity="0.19"/><stop offset="1" stop-color="#09120E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeLight">
      <stop offset="0" stop-color="#F4D878" stop-opacity="0.95"/><stop offset="0.26" stop-color="#E8C547" stop-opacity="0.72"/><stop offset="1" stop-color="#E8C547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filament" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#426E52" stop-opacity="0.35"/><stop offset="0.46" stop-color="#7EC8A0" stop-opacity="0.9"/><stop offset="1" stop-color="#A6F1D4" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="nodeGlow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="9"/></filter>
    <style>
      .thread{fill:none;stroke:url(#filament);stroke-linecap:round;stroke-linejoin:round}
      .thread-main{stroke-width:2.15}.thread-fine{stroke-width:1.15;opacity:.72}
      .quiet-line{fill:none;stroke:#54866C;stroke-width:1;opacity:.07}
      .living{transform-box:fill-box;transform-origin:center;animation:breathe 8s ease-in-out infinite}
      .living.delay-a{animation-delay:-2.2s}.living.delay-b{animation-delay:-5.1s}
      .pulse{animation:pulse 6.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pulse.delay-a{animation-delay:-1.6s}.pulse.delay-b{animation-delay:-4.1s}
      .signal{fill:none;stroke:#B8F2D5;stroke-width:1.05;stroke-dasharray:2 31;stroke-dashoffset:0;opacity:.58;stroke-linecap:round;animation:flow 13s linear infinite}
      .signal.delay-a{animation-delay:-4.5s}.signal.delay-b{animation-delay:-8s}
      .drift-a{transform-box:fill-box;transform-origin:center;animation:drift 19s ease-in-out infinite}
      .drift-b{transform-box:fill-box;transform-origin:center;animation:drift 24s ease-in-out -11s infinite}
      @keyframes flow{to{stroke-dashoffset:-264}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-6px)}}
      @keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}
      @keyframes pulse{0%,100%{opacity:.54;transform:scale(.86)}48%{opacity:.95;transform:scale(1.08)}}
      @media(prefers-reduced-motion:reduce){.living,.pulse,.signal,.drift-a,.drift-b{animation:none!important}}
    </style>
  </defs>
