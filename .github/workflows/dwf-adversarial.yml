name: DWF adversarial harness

on:
  pull_request:
    paths:
      - "benchmarks/dwf-adversarial-v0.1/**"
      - ".github/workflows/dwf-adversarial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path benchmarks/dwf-adversarial-v0.1/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path benchmarks/dwf-adversarial-v0.1/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path benchmarks/dwf-adversarial-v0.1/Cargo.toml --all-targets -- -D warnings
