name: OpsBench paired assurance statistics v0.1

on:
  pull_request:
    paths:
      - "benchmarks/opsbench-assurance-statistics-v0.1/**"
      - "benchmarks/opsbench-common-core-v0.1/preregistration.example.json"
      - "tools/opsbench-assurance-statistics-v0.1/**"
      - "docs/OPSBENCH_ASSURANCE_STATISTICS_V0_1.md"
      - ".github/workflows/opsbench-assurance-statistics-v0.1.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/opsbench-assurance-statistics-v0.1/**"
      - "benchmarks/opsbench-common-core-v0.1/preregistration.example.json"
      - "tools/opsbench-assurance-statistics-v0.1/**"
      - "docs/OPSBENCH_ASSURANCE_STATISTICS_V0_1.md"
      - ".github/workflows/opsbench-assurance-statistics-v0.1.yml"

permissions:
  contents: read

concurrency:
  group: opsbench-assurance-statistics-v0.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluator-statistics:
    name: Paired scenario-cluster assurance statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compile evaluator and adversarial tests
        run: python3 -m py_compile tools/opsbench-assurance-statistics-v0.1/analyze_assurance.py tools/opsbench-assurance-statistics-v0.1/test_analyze_assurance.py
      - name: Parse input and output contracts
        run: |
          python3 -m json.tool benchmarks/opsbench-assurance-statistics-v0.1/results.schema.json >/dev/null
          python3 -m json.tool benchmarks/opsbench-assurance-statistics-v0.1/report.schema.json >/dev/null
          python3 -m json.tool benchmarks/opsbench-assurance-statistics-v0.1/results.example.json >/dev/null
          python3 -m json.tool benchmarks/opsbench-common-core-v0.1/preregistration.example.json >/dev/null
      - name: Run evaluator on synthetic example
        run: |
          python3 tools/opsbench-assurance-statistics-v0.1/analyze_assurance.py \
            --results benchmarks/opsbench-assurance-statistics-v0.1/results.example.json \
            --preregistration benchmarks/opsbench-common-core-v0.1/preregistration.example.json \
            --output /tmp/opsbench-assurance-report-a.json
      - name: Confirm byte-for-byte report repeatability
        run: |
          python3 tools/opsbench-assurance-statistics-v0.1/analyze_assurance.py \
            --results benchmarks/opsbench-assurance-statistics-v0.1/results.example.json \
            --preregistration benchmarks/opsbench-common-core-v0.1/preregistration.example.json \
            --output /tmp/opsbench-assurance-report-b.json
          cmp /tmp/opsbench-assurance-report-a.json /tmp/opsbench-assurance-report-b.json
      - name: Run adversarial and mutation tests
        run: python3 -m unittest discover -s tools/opsbench-assurance-statistics-v0.1 -p 'test_analyze_assurance.py' -v
      - name: Preserve explicitly example-only report
        run: cat /tmp/opsbench-assurance-report-a.json
