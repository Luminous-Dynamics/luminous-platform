name: ITOPS Qualification Core

on:
  pull_request:
    branches:
      - itops-preregistered-campaign-plan-2026-11-03
    paths:
      - "benchmarks/itops-autonomy-boundary-v0.1/**"
      - ".github/workflows/itops-qualification.yml"

permissions:
  contents: read

concurrency:
  group: itops-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification-core:
    name: Rust format, semantic tests, and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0
          rustc --version
          cargo --version

      - name: Resolve and fingerprint locked dependency graph
        working-directory: benchmarks/itops-autonomy-boundary-v0.1/qualification-core
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
          actual_lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          if [ -f cargo-lockfile.sha256 ]; then
            expected_lock_sha="$(awk 'NR == 1 {print $1}' cargo-lockfile.sha256)"
            if [ "$actual_lock_sha" != "$expected_lock_sha" ]; then
              echo "::error::Cargo.lock digest mismatch: expected $expected_lock_sha, got $actual_lock_sha"
              exit 1
            fi
          else
            printf '%s  Cargo.lock\n' "$actual_lock_sha" > cargo-lockfile.sha256
          fi
          cargo metadata --format-version 1 --locked > cargo-metadata.json

      - name: Publish exact dependency lock and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itops-rust-dependency-lock-${{ github.event.pull_request.head.sha }}
          path: |
            benchmarks/itops-autonomy-boundary-v0.1/qualification-core/Cargo.lock
            benchmarks/itops-autonomy-boundary-v0.1/qualification-core/cargo-lockfile.sha256
            benchmarks/itops-autonomy-boundary-v0.1/qualification-core/cargo-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify Rust formatting without modifying the checked-out head
        run: cargo fmt --manifest-path benchmarks/itops-autonomy-boundary-v0.1/qualification-core/Cargo.toml --all -- --check

      - name: Run qualification and adversarial semantic tests
        run: cargo test --manifest-path benchmarks/itops-autonomy-boundary-v0.1/qualification-core/Cargo.toml --all-targets --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path benchmarks/itops-autonomy-boundary-v0.1/qualification-core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Record exact-head build provenance
        if: always()
        run: |
          {
            echo "## ITOPS qualification core"
            echo "- Head: ${{ github.event.pull_request.head.sha }}"
            echo "- Rust: $(rustc --version 2>/dev/null || echo unavailable)"
            echo "- Cargo: $(cargo --version 2>/dev/null || echo unavailable)"
            if [ -f benchmarks/itops-autonomy-boundary-v0.1/qualification-core/cargo-lockfile.sha256 ]; then
              echo "- Generated lockfile: $(cat benchmarks/itops-autonomy-boundary-v0.1/qualification-core/cargo-lockfile.sha256)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
