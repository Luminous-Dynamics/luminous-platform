name: Landlock pre-opened descriptor authority probe

on:
  pull_request:
    paths:
      - "tools/landlock-preopened-fd-probe/**"
      - ".github/workflows/landlock-preopened-fd-probe.yml"
  push:
    branches: [main]
    paths:
      - "tools/landlock-preopened-fd-probe/**"
      - ".github/workflows/landlock-preopened-fd-probe.yml"

permissions:
  contents: read

concurrency:
  group: landlock-preopened-fd-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preopened-descriptor-authority:
    name: Verify Landlock descriptor ordering controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head (or pushed commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the checked-out commit
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CHECKOUT_SHA"
          echo "Exact source checkout verified: $actual"

      - name: Install pinned Rust toolchain and components
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: "1.96.0"
          components: "rustfmt, clippy"
          cache: false

      - name: Check formatting
        run: cargo fmt --manifest-path tools/landlock-preopened-fd-probe/Cargo.toml -- --check

      - name: Build and run locked tests
        run: cargo test --locked --manifest-path tools/landlock-preopened-fd-probe/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run exposure and mitigation controls; validate JSON evidence
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path tools/landlock-preopened-fd-probe/Cargo.toml | tee /tmp/landlock-preopened-fd-result.jsonl
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lines = Path("/tmp/landlock-preopened-fd-result.jsonl").read_text(encoding="utf-8").splitlines()
          records = [line for line in lines if line.startswith("{") and line.endswith("}")]
          assert len(records) == 1, f"expected one JSON record, got {len(records)}"
          result = json.loads(records[0])
          assert result.get("schema") == "luminous.landlock-preopened-fd-result.v1"
          assert result.get("status") == "pass"
          expected_sha = os.environ["LUMINOUS_CHECKOUT_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", expected_sha)
          assert result.get("checkout_sha") == expected_sha
          assert isinstance(result.get("kernel_release"), str) and result["kernel_release"] != "unknown"
          assert type(result.get("landlock_abi")) is int and result["landlock_abi"] >= 3
          for field in (
              "preopened_write_succeeded_after_landlock",
              "parent_oracle_observed_preopened_write",
              "cloexec_descriptor_absent_after_exec",
              "new_path_write_open_denied_after_landlock",
              "parent_oracle_safe_control_unchanged",
              "parent_original_fd_cloexec",
          ):
              assert result.get(field) is True, f"missing or false evidence field: {field}"
          assert result.get("full_descriptor_hygiene_coverage") is False
          assert result.get("scope") == "preopened_writable_fd_ordering_microtest"
          print("PASS: expected-exposure control, CLOEXEC/path-denial control, parent oracle, and claim-boundary fields")
          PY
        env:
          LUMINOUS_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CARGO_NET_OFFLINE: "true"

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/landlock-preopened-fd-probe/Cargo.toml -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"
