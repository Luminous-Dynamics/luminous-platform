name: Intent provenance adaptive benchmark contracts

on:
  pull_request:
    paths:
      - "benchmarks/intent-provenance-v0.1/**"
      - "scripts/validate_ipab.py"
      - "requirements-origin-intent-test.txt"
      - ".github/workflows/intent-provenance-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ipab:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Set up pinned test-only Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned test-only schema dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-origin-intent-test.txt
      - name: Validate IPAB schemas, scenario matrix and metric dictionary
        run: python scripts/validate_ipab.py
