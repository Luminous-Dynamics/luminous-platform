          if python3 - "$workspace" "$result_root/manifest-coverage.json" "$verified_file" "$inventory_file" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          repo = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])
          verified_file = Path(sys.argv[3])
          inventory_file = Path(sys.argv[4])

          def git_output(root, *args):
              return subprocess.check_output(["git", *args], cwd=root)

          tree_cache = {}
          object_format_cache = {}

          def tree_entries(root):
              key = str(root.resolve())
              if key in tree_cache:
                  return tree_cache[key]
              raw = git_output(root, "ls-tree", "-r", "-z", "--full-tree", "HEAD")
              entries = {}
              for record in raw.split(bytes([0])):
                  if not record:
                      continue
                  metadata, path_bytes = record.split(bytes([9]), 1)
                  fields = metadata.split()
                  if len(fields) != 3:
                      raise ValueError("committed_tree_entry_malformed")
                  mode, kind, oid = (field.decode("ascii") for field in fields)
                  path = path_bytes.decode("utf-8", "strict")
                  if any(ord(character) < 0x20 or ord(character) == 0x7F for character in path) or "=" in path:
                      raise ValueError(f"tracked path cannot be represented safely in coverage evidence: {path!r}")
                  if path in entries:
                      raise ValueError(f"duplicate path in committed tree: {path!r}")
                  entries[path] = (mode, kind, oid)
              tree_cache[key] = entries
              return entries

          def tracked(root, patterns):
              wanted = {Path(pattern).name for pattern in patterns}
              return sorted(path for path in tree_entries(root) if Path(path).name in wanted)

          def committed_bytes(root, rel):
              relative = Path(rel)
              if relative.is_absolute() or any(part in ("", ".", "..") for part in relative.parts):
                  raise ValueError("manifest_or_lockfile_path_not_canonical")
              entry = tree_entries(root).get(rel)
              if entry is None:
                  raise ValueError("not_present_in_committed_tree")
              mode, kind, oid = entry
              if mode not in ("100644", "100755") or kind != "blob":
                  raise ValueError("not_a_regular_committed_blob")
              target = root / relative
              for parent in reversed(target.parents):
                  if parent == root:
                      break
                  if parent.is_symlink() or not parent.is_dir():
                      raise ValueError("parent_path_not_regular_directory")
              if target.is_symlink() or not target.is_file():
                  raise ValueError("worktree_path_not_regular_file")
              content = target.read_bytes()
              object_format = object_format_cache.get(str(root.resolve()))
              if object_format is None:
                  object_format = git_output(root, "rev-parse", "--show-object-format").decode("ascii").strip()
                  if object_format not in ("sha1", "sha256"):
                      raise ValueError("unsupported_git_object_format")
                  object_format_cache[str(root.resolve())] = object_format
              header = b"blob " + str(len(content)).encode("ascii") + bytes([0])
              actual_oid = hashlib.new(object_format, header + content).hexdigest()
              if actual_oid != oid:
