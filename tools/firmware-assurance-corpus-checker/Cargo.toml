[package]
name = "firmware-assurance-corpus-checker"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
description = "Bounded, offline structural and semantic contract checker for synthetic firmware-assurance benchmark cases"
publish = false

[lib]
name = "firmware_assurance_corpus_checker"
path = "src/lib.rs"

[[bin]]
name = "firmware-assurance-corpus-checker"
path = "src/main.rs"

[dependencies]
jsonschema = "=0.33.0"
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
