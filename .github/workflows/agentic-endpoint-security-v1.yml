name: agentic endpoint assurance v1

on:
  pull_request:
    paths:
      - "docs/AGENTIC_ENDPOINT_SECURITY_BENCHMARK_V1.md"
      - "benchmarks/agentic-endpoint-security-v1/**"
      - "tools/agentic-endpoint-security-v1/**"
      - ".github/workflows/agentic-endpoint-security-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/AGENTIC_ENDPOINT_SECURITY_BENCHMARK_V1.md"
      - "benchmarks/agentic-endpoint-security-v1/**"
      - "tools/agentic-endpoint-security-v1/**"
      - ".github/workflows/agentic-endpoint-security-v1.yml"

# Explicitly retrigger exact-head conformance after IFL revocation/doc reconciliation.
permissions:
  contents: read

# IFL consumes AUTH-CORE-002 origin/intent semantics; TWEP and CAPC remain
# benchmark supplements in this same read-only validation job.

# Keep one current validation run for this PR; old pending runs should not
# accumulate while the branch is being actively amended.
concurrency:
  group: agentic-endpoint-security-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-and-reference-model:
    name: Frozen corpus and Rust reference model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source revision
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD_SHA" ]; then
            printf 'Expected exact source %s, checked out %s\\n' "$EXPECTED_HEAD_SHA" "$actual" >&2
            exit 1
          fi
          printf 'CHECKED_OUT_EXACT_HEAD=%s\\n' "$actual"


      - name: Install pinned Rust toolchain and components
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: "1.96.0"
          components: "rustfmt, clippy"
          cache: false

      - name: Validate frozen corpus contract
        run: python3 tools/agentic-endpoint-security-v1/check_corpus.py

      - name: Validate adaptive red-team protocol
        run: python3 tools/agentic-endpoint-security-v1/check_adaptive_protocol.py

      - name: Run adaptive protocol mutation tests
        run: python3 tools/agentic-endpoint-security-v1/test_adaptive_protocol.py

      - name: Run episode scorer contract and statistical tests
        run: python3 tools/agentic-endpoint-security-v1/test_score_episodes.py

      - name: Validate independent side-effect oracle contract
        run: python3 tools/agentic-endpoint-security-v1/check_oracle_coverage.py

      - name: Run oracle coverage mutation tests
        run: python3 tools/agentic-endpoint-security-v1/test_oracle_coverage.py

      - name: Validate trajectory-wide effective privilege contract
        run: python3 tools/agentic-endpoint-security-v1/check_trajectory_privilege.py

      - name: Run trajectory privilege mutation tests
        run: python3 tools/agentic-endpoint-security-v1/test_trajectory_privilege.py

      - name: Validate canonical authority path closure contract
        run: python3 tools/agentic-endpoint-security-v1/check_authority_path_closure.py

      - name: Run canonical authority path closure mutation tests
        run: python3 tools/agentic-endpoint-security-v1/test_authority_path_closure.py

      - name: Validate information-flow lifecycle contract
        run: python3 tools/agentic-endpoint-security-v1/check_information_flow_lifecycle.py

      - name: Run information-flow lifecycle mutation tests
        run: python3 tools/agentic-endpoint-security-v1/test_information_flow_lifecycle.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/agentic-endpoint-security-v1/Cargo.toml -- --check

      - name: Run dependency-locked reference model tests
        run: cargo test --locked --manifest-path tools/agentic-endpoint-security-v1/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/agentic-endpoint-security-v1/Cargo.toml -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Execute synthetic reference-model demo
        run: cargo run --locked --manifest-path tools/agentic-endpoint-security-v1/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
