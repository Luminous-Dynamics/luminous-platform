name: Infrastructure assurance scorecard contract

on:
  pull_request:
    paths:
      - ".github/workflows/infrastructure-assurance-contract.yml"
      - "docs/assurance/**"
      - "tools/infrastructure-assurance-contract/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/infrastructure-assurance-contract.yml"
      - "docs/assurance/**"
      - "tools/infrastructure-assurance-contract/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/infrastructure-assurance-contract/Cargo.toml -- --check
      - name: Validate scorecard schema and negative controls
        run: cargo test --manifest-path tools/infrastructure-assurance-contract/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/infrastructure-assurance-contract/Cargo.toml --all-targets -- -D warnings
