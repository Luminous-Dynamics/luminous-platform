name: Reusable Security Audit

on:
  workflow_call:
    inputs:
      subject_sha:
        description: Exact caller repository commit to audit.
        required: true
        type: string
      audit_engine_sha:
        description: Caller-declared audit workflow revision; external verifier must cross-check the actual uses reference.
        required: true
        type: string
      audit_rust:
        description: Audit Rust lockfiles and map manifests to workspace lockfiles.
        required: false
        default: false
        type: boolean
      audit_node:
        description: Audit all tracked npm package-lock and shrinkwrap lockfiles.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  workflow-security:
    name: GitHub Actions workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact audit subject
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.subject_sha }}
          fetch-depth: 0 # Required: a shallow history can silently omit previously committed secrets.
          persist-credentials: false
      - name: Assert exact checkout identity
        id: subject
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Initialize workflow evidence
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/workflows
          {
            echo "schema=luminous.security-audit.workflow-receipt.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "zizmor_status=INCOMPLETE"
            echo "actionlint_status=INCOMPLETE"
            echo "secret_scan_status=INCOMPLETE"
            echo "secret_scan_reason=not_started"
            echo "secret_scanner_version=v8.30.1"
            echo "secret_scan_exit_code=NOT_RUN"
            echo "secret_config_sha256=missing"
            echo "secret_raw_report_sha256=missing"
            echo "secret_report_sha256=missing"
            echo "secret_finding_count=unknown"
            echo "secret_history_scan_status=INCOMPLETE"
            echo "secret_history_scan_reason=not_started"
            echo "secret_history_exit_code=NOT_RUN"
            echo "secret_history_raw_report_sha256=missing"
            echo "secret_history_report_sha256=missing"
            echo "secret_history_inventory_sha256=missing"
            echo "secret_history_root_commit_count=unknown"
            echo "secret_history_submodule_commit_count=unknown"
            echo "secret_history_finding_count=unknown"
          } > security-audit-results/workflows/summary.txt
          cat > security-audit-results/workflows/gitleaks-sanitized.json <<'JSON'
          {"schema":"luminous.security-audit.gitleaks-summary.v1","repository":"unknown","subject_sha":"unknown","scanner_version":"v8.30.1","config_sha256":"missing","status":"INCOMPLETE","reason":"not_started","finding_count":null,"findings":[]}
          JSON
          cat > security-audit-results/workflows/gitleaks-history-sanitized.json <<'JSON'
          {"schema":"luminous.security-audit.gitleaks-history-summary.v1","repository":"unknown","subject_sha":"unknown","scanner_version":"v8.30.1","status":"INCOMPLETE","reason":"not_started","history_tip":"unknown","history_commit_count":null,"submodule_tip":"not_required","submodule_commit_count":0,"history_inventory_sha256":"missing","config_sha256":"missing","raw_report_sha256":"missing","finding_count":null,"findings":[]}
          JSON
          echo "engine_identity_status=INCOMPLETE" >> security-audit-results/workflows/summary.txt
          if [[ ! "$AUDIT_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sed -i 's/^zizmor_status=.*/zizmor_status=FAIL/' security-audit-results/workflows/summary.txt
            echo "incomplete_reason=invalid_audit_engine_sha" >> security-audit-results/workflows/summary.txt
            exit 2
          fi

      - name: Verify declared audit engine identity
        id: engine_identity
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          EVENT_SHA: ${{ github.sha }}
          AUDITED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          engine = os.environ["AUDIT_ENGINE_SHA"]
          subject = os.environ["SUBJECT_SHA"]
          event_sha = os.environ["EVENT_SHA"]
          repository = os.environ["AUDITED_REPOSITORY"]
          summary = Path("security-audit-results/workflows/summary.txt")

          def set_receipt_value(key, value):
              lines = summary.read_text(encoding="utf-8").splitlines()
              prefix = f"{key}="
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"receipt field {key} has {len(matches)} entries")
              lines[matches[0]] = f"{key}={value}"
              summary.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def fail(reason):
              set_receipt_value("engine_identity_status", "FAIL")
              with summary.open("a", encoding="utf-8") as receipt:
                  receipt.write(f"engine_identity_reason={reason}\n")
              print(f"FAIL: {reason}", file=sys.stderr)
              raise SystemExit(1)

          if not re.fullmatch(r"[0-9a-f]{40}", engine):
              fail("invalid_engine_sha")
          if not re.fullmatch(r"[0-9a-f]{40}", subject):
              fail("invalid_subject_sha")

          if repository == "Luminous-Dynamics/luminous-platform":
              # The platform audits its local reusable workflow from the
              # event commit (including the PR merge ref), while it scans the
              # PR head separately as subject_sha.
              caller = Path(".github/workflows/security-audit-self.yml")
              if not caller.is_file():
                  fail("platform_self_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              local_uses = re.findall(
                  r"^\s*uses:\s*\./\.github/workflows/security-audit\.yml\s*$",
                  text, re.MULTILINE
              )
              if len(local_uses) != 1:
                  fail("platform_local_engine_reference_missing_or_ambiguous")
              if engine != event_sha:
                  fail("platform_local_engine_sha_does_not_match_event_sha")
          else:
              caller = Path(".github/workflows/security-audit.yml")
              if not caller.is_file():
                  fail("caller_security_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              refs = re.findall(
                  r"^\s*uses:\s*Luminous-Dynamics/luminous-platform/\.github/workflows/security-audit\.yml@([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              declared = re.findall(
                  r"^\s*audit_engine_sha:\s*([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              if len(refs) != 1:
                  fail("immutable_shared_workflow_reference_missing_or_ambiguous")
              if len(declared) != 1:
                  fail("declared_engine_sha_missing_or_ambiguous")
              if refs[0] != engine or declared[0] != engine:
                  fail("caller_reference_and_engine_sha_mismatch")

          set_receipt_value("engine_identity_status", "PASS")
          with summary.open("a", encoding="utf-8") as receipt:
              receipt.write(f"engine_identity_checked_sha={engine}\n")
          print("PASS: declared audit engine identity matches the caller reference")
          PY
      - name: Audit workflow definitions
        id: zizmor
        if: always() && steps.checkout.outcome == 'success' && steps.subject.outcome == 'success'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/
          advanced-security: false
          annotations: true
          online-audits: true
          persona: auditor
          version: v1.30.1
      - name: Validate audit workflow syntax
        id: actionlint
        if: always() && steps.checkout.outcome == 'success' && steps.subject.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          report="security-audit-results/workflows/actionlint.txt"
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint_1.7.12"
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          shellcheck_dir="$RUNNER_TEMP/shellcheck-v0.11.0"
          mkdir -p security-audit-results/workflows "$tool_dir" "$shellcheck_dir"
          echo "version=v1.7.12" > "$report"
          echo "expected_archive_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" >> "$report"
          echo "shellcheck_version_expected=v0.11.0" >> "$report"
          echo "shellcheck_archive_sha256_expected=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" >> "$report"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          if ! curl -fsSL --retry 3 -o "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"; then
            echo "shellcheck_setup_status=FAIL reason=download_failed" >> "$report"
            exit 1
          fi
          if ! echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" | sha256sum -c -; then
            echo "shellcheck_setup_status=FAIL reason=checksum_mismatch" >> "$report"
            exit 1
          fi
          if ! tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck; then
            echo "shellcheck_setup_status=FAIL reason=extract_failed" >> "$report"
            exit 1
          fi
          shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          if ! "$shellcheck" --version >> "$report" 2>&1; then
            echo "shellcheck_setup_status=FAIL reason=unusable_binary" >> "$report"
            exit 1
          fi
          echo "shellcheck_setup_status=PASS" >> "$report"
          binary="$tool_dir/actionlint"
          mapfile -d '' -t audit_workflows < <(
            git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | LC_ALL=C sort -z
          )
          if [[ "${#audit_workflows[@]}" -eq 0 ]]; then
            echo "FAIL: no tracked GitHub Actions workflow YAML files found" >> "$report"
            exit 2
          fi
          echo "workflow_file_count=${#audit_workflows[@]}" >> "$report"
          "$binary" -version >> "$report" 2>&1
          if "$binary" -shellcheck="$shellcheck" "${audit_workflows[@]}" >> "$report" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "actionlint_exit_code=$rc" >> "$report"
          cat "$report"
          exit "$rc"
      - name: Scan audited source for secrets with pinned Gitleaks
        id: gitleaks
        if: always() && steps.checkout.outcome == 'success' && steps.subject.outcome == 'success' && steps.engine_identity.outcome == 'success'
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -uo pipefail
          summary="security-audit-results/workflows/summary.txt"
          safe_report="security-audit-results/workflows/gitleaks-sanitized.json"
          raw_report="$RUNNER_TEMP/gitleaks-raw.json"
          history_safe_report="security-audit-results/workflows/gitleaks-history-sanitized.json"
          history_raw_report="$RUNNER_TEMP/gitleaks-history-raw.json"
          history_raw_root="$RUNNER_TEMP/gitleaks-history-root.json"
          history_raw_submodule="$RUNNER_TEMP/gitleaks-history-submodule.json"
          history_inventory="security-audit-results/workflows/gitleaks-history-inventory.json"
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks_8.30.1"
          home_dir="$RUNNER_TEMP/gitleaks-home"
          source_dir="$RUNNER_TEMP/gitleaks-source"
          config="$RUNNER_TEMP/luminous-gitleaks.toml"
          empty_ignore="$RUNNER_TEMP/empty-gitleaksignore"
          rm -rf -- "$source_dir" "$tool_dir" "$home_dir"
          mkdir -p "$tool_dir" "$home_dir" "$source_dir"
          set_field() {
            key="$1"; value="$2"
            if grep -q "^$key=" "$summary"; then sed -i "s#^$key=.*#$key=$value#" "$summary"; else printf '%s=%s\n' "$key" "$value" >> "$summary"; fi
          }
          incomplete() {
            reason="$1"; raw_sha="missing"; config_sha="missing"
            if [[ -f "$raw_report" ]]; then raw_sha="$(sha256sum "$raw_report" | cut -d' ' -f1)"; fi
            if [[ -f "$config" ]]; then config_sha="$(sha256sum "$config" | cut -d' ' -f1)"; fi
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg reason "$reason" '{schema:"luminous.security-audit.gitleaks-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",config_sha256:$config,source_file_count:null,source_inventory_sha256:"missing",status:"INCOMPLETE",reason:$reason,finding_count:null,findings:[]}' > "$safe_report"
            set_field secret_scan_status INCOMPLETE
            set_field secret_scan_reason "$reason"
            set_field secret_scan_exit_code NOT_RUN
            set_field secret_config_sha256 "$config_sha"
            set_field secret_raw_report_sha256 "$raw_sha"
            set_field secret_source_file_count unknown
            set_field secret_source_inventory_sha256 missing
            set_field secret_finding_count unknown
            set_field secret_report_sha256 "$(sha256sum "$safe_report" | cut -d' ' -f1)"
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg reason "$reason" '{schema:"luminous.security-audit.gitleaks-history-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",status:"INCOMPLETE",reason:$reason,history_tip:"unknown",history_commit_count:null,submodule_tip:"not_required",submodule_commit_count:0,history_inventory_sha256:"missing",config_sha256:$config,raw_report_sha256:$raw_sha,finding_count:null,findings:[]}' > "$history_safe_report"
            jq -n --arg subject "$SUBJECT_SHA" --arg reason "$reason" '{schema:"luminous.security-audit.gitleaks-history-inventory.v1",subject_sha:$subject,status:"INCOMPLETE",reason:$reason,root:{head:"unknown",commit_count:null,is_shallow:null},submodule:{path:"not_required",head:"not_required",commit_count:0,is_shallow:false}}' > "$history_inventory"
            set_field secret_history_scan_status INCOMPLETE
            set_field secret_history_scan_reason "$reason"
            set_field secret_history_exit_code NOT_RUN
            set_field secret_history_raw_report_sha256 "$raw_sha"
            set_field secret_history_inventory_sha256 "$(sha256sum "$history_inventory" | cut -d' ' -f1)"
            set_field secret_history_root_commit_count unknown
            set_field secret_history_submodule_commit_count unknown
            set_field secret_history_finding_count unknown
            set_field secret_history_report_sha256 "$(sha256sum "$history_safe_report" | cut -d' ' -f1)"
          }
          cat > "$config" <<'TOML'
          title = "Luminous trusted Gitleaks defaults"
          [extend]
          useDefault = true
          TOML
          : > "$empty_ignore"
          config_sha="$(sha256sum "$config" | cut -d' ' -f1)"
          set_field secret_config_sha256 "$config_sha"
          if ! curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"; then incomplete gitleaks_download_failed; exit 0; fi
          if ! echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c - >/dev/null 2>&1; then incomplete gitleaks_checksum_mismatch; exit 0; fi
          if ! tar -xzf "$archive" -C "$tool_dir" gitleaks; then incomplete gitleaks_extract_failed; exit 0; fi
          binary="$tool_dir/gitleaks"
          if ! "$binary" version > "$RUNNER_TEMP/gitleaks-version.txt" 2>&1; then incomplete gitleaks_binary_unusable; exit 0; fi

          # Regression fixture: the present-day directory is clean, but a
          # synthetic high-entropy canary was committed and then deleted.
          # Gitleaks dir must see zero findings while Gitleaks git must find
          # the historical patch. The canary is fabricated and not a credential.
          history_fixture="$RUNNER_TEMP/gitleaks-history-fixture"
          history_fixture_current="$RUNNER_TEMP/gitleaks-history-fixture-current"
          history_fixture_config="$RUNNER_TEMP/gitleaks-history-fixture.toml"
          history_fixture_paths="$RUNNER_TEMP/gitleaks-history-fixture-paths.nul"
          history_fixture_tree_report="$RUNNER_TEMP/gitleaks-history-fixture-tree.json"
          history_fixture_git_report="$RUNNER_TEMP/gitleaks-history-fixture-git.json"
          rm -rf -- "$history_fixture" "$history_fixture_current"
          mkdir -p "$history_fixture" "$history_fixture_current"
          if ! git init -q "$history_fixture" \
            || ! git -C "$history_fixture" config user.name "Security Audit Fixture" \
            || ! git -C "$history_fixture" config user.email "security-audit-fixture@invalid.example"; then
            incomplete gitleaks_history_fixture_setup_failed; exit 0
          fi
          cat > "$history_fixture_config" <<'TOML'
          title = "Luminous Gitleaks history regression fixture"
          [extend]
          useDefault = true
          [[rules]]
          id = "luminous-history-fixture"
          description = "Synthetic canary used only to test history scanning"
          regex = '''LUMINOUS_HISTORY_SECRET_FIXTURE_[A-F0-9]{32}'''
          keywords = ["LUMINOUS_HISTORY_SECRET_FIXTURE_"]
          TOML
          printf '%s\n' 'Tracked clean file.' > "$history_fixture/clean.txt"
          printf '%s\n' 'LUMINOUS_HISTORY_SECRET_FIXTURE_0123456789ABCDEF0123456789ABCDEF' > "$history_fixture/retired.txt"
          if ! git -C "$history_fixture" add clean.txt retired.txt \
            || ! git -C "$history_fixture" commit -qm "add synthetic history-only canary"; then
            incomplete gitleaks_history_fixture_commit_failed; exit 0
          fi
          rm "$history_fixture/retired.txt"
          if ! git -C "$history_fixture" add -u \
            || ! git -C "$history_fixture" commit -qm "remove synthetic history-only canary"; then
            incomplete gitleaks_history_fixture_delete_commit_failed; exit 0
          fi
          if ! git -C "$history_fixture" ls-files -z --cached > "$history_fixture_paths" \
            || ! (cd "$history_fixture" && tar --null --verbatim-files-from --no-recursion --files-from="$history_fixture_paths" -cf -) \
              | tar -xf - -C "$history_fixture_current"; then
            incomplete gitleaks_history_fixture_current_snapshot_failed; exit 0
          fi
          if [[ -f "$history_fixture_current/retired.txt" || ! -f "$history_fixture_current/clean.txt" ]]; then
            incomplete gitleaks_history_fixture_current_snapshot_invalid; exit 0
          fi
          if ! env -i PATH="$PATH" HOME="$home_dir" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$binary" dir "$history_fixture_current" --config "$history_fixture_config" --gitleaks-ignore-path "$empty_ignore" --redact=100 --no-banner --log-level error --report-format json --report-path "$history_fixture_tree_report" --timeout 120 > /dev/null 2> "$RUNNER_TEMP/gitleaks-history-fixture-tree.log"; then
            incomplete gitleaks_history_fixture_tree_scan_failed; exit 0
          fi
          if ! jq -e 'type == "array" and length == 0' "$history_fixture_tree_report" >/dev/null 2>&1; then
            incomplete gitleaks_history_fixture_current_tree_not_clean; exit 0
          fi
          history_fixture_git_rc=0
          if env -i PATH="$PATH" HOME="$home_dir" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$binary" git "$history_fixture" --log-opts=HEAD --config "$history_fixture_config" --gitleaks-ignore-path "$empty_ignore" --redact=100 --no-banner --log-level error --report-format json --report-path "$history_fixture_git_report" --timeout 120 > /dev/null 2> "$RUNNER_TEMP/gitleaks-history-fixture-git.log"; then
            history_fixture_git_rc=0
          else
            history_fixture_git_rc=$?
          fi
          if [[ "$history_fixture_git_rc" -ne 1 ]] || ! jq -e 'type == "array" and length > 0 and all(.[]; .RuleID == "luminous-history-fixture" and (.Commit | type == "string" and test("^[0-9a-f]{40}$")))' "$history_fixture_git_report" >/dev/null 2>&1; then
            incomplete gitleaks_history_fixture_failed_to_detect_deleted_canary; exit 0
          fi

          # Prove the tracked-file snapshot is not affected by repository
          # export-ignore rules. git archive is intentionally not used below:
          # .gitattributes is controlled by the subject and can hide tracked files.
          fixture="$RUNNER_TEMP/gitleaks-export-ignore-fixture"
          fixture_snapshot="$RUNNER_TEMP/gitleaks-export-ignore-snapshot"
          fixture_paths="$RUNNER_TEMP/gitleaks-export-ignore-paths.nul"
          fixture_stage="$RUNNER_TEMP/gitleaks-export-ignore-stage.nul"
          rm -rf -- "$fixture" "$fixture_snapshot"
          mkdir -p "$fixture" "$fixture_snapshot"
          if ! git init -q "$fixture" \
            || ! git -C "$fixture" config user.name "Security Audit Fixture" \
            || ! git -C "$fixture" config user.email "security-audit-fixture@invalid.example"; then
            incomplete tracked_snapshot_fixture_setup_failed; exit 0
          fi
          printf '%s\n' 'secret-fixture.txt export-ignore' > "$fixture/.gitattributes"
          printf '%s\n' 'TRACKED_FILE_MUST_REMAIN_SCANNABLE' > "$fixture/secret-fixture.txt"
          printf '%s\n' 'TRACKED_PATH_MUST_REMAIN_SCANNABLE' > "$fixture/mycelix-health"
          if ! git -C "$fixture" add .gitattributes secret-fixture.txt mycelix-health \
            || ! git -C "$fixture" commit -qm "tracked snapshot fixture" \
            || ! git -C "$fixture" ls-files -z --cached > "$fixture_paths" \
            || ! git -C "$fixture" ls-files --stage -z > "$fixture_stage"; then
            incomplete tracked_snapshot_fixture_setup_failed; exit 0
          fi
          fixture_archive="$RUNNER_TEMP/gitleaks-export-ignore-fixture.tar"
          fixture_listing="$RUNNER_TEMP/gitleaks-export-ignore-listing.txt"
          if ! git -C "$fixture" archive HEAD > "$fixture_archive" || ! tar -tf "$fixture_archive" > "$fixture_listing"; then
            incomplete tracked_snapshot_fixture_archive_failed; exit 0
          fi
          if grep -Fxq "secret-fixture.txt" "$fixture_listing"; then
            incomplete tracked_snapshot_fixture_not_exercising_export_ignore; exit 0
          fi
          if ! python3 - "$fixture_paths" "$fixture_stage" <<'PY'
          import sys
          from pathlib import Path
          paths_file, stage_file = map(Path, sys.argv[1:])
          nul = bytes([0])
          entries = [item for item in paths_file.read_bytes().split(nul) if item]
          gitlinks = set()
          for record in stage_file.read_bytes().split(nul):
              if not record or b"\t" not in record:
                  continue
              metadata, path = record.split(b"\t", 1)
              fields = metadata.split()
              if fields and fields[0] == b"160000":
                  gitlinks.add(path)
          entries = sorted(item for item in entries if not (item == b"mycelix-health" and item in gitlinks))
          paths_file.write_bytes(nul.join(entries) + (nul if entries else b""))
          PY
          then
            incomplete tracked_snapshot_fixture_filter_failed; exit 0
          fi
          if ! (cd "$fixture" && tar --null --verbatim-files-from --no-recursion --files-from="$fixture_paths" -cf -) \
            | tar -xf - -C "$fixture_snapshot"; then
            incomplete tracked_snapshot_fixture_copy_failed; exit 0
          fi
          if [[ ! -f "$fixture_snapshot/secret-fixture.txt" || ! -f "$fixture_snapshot/mycelix-health" ]]; then
            incomplete tracked_snapshot_bypass_fixture; exit 0
          fi

          # Snapshot tracked worktree paths from the checked-out exact subject.
          # Exclude only the allow-listed gitlink directory; its files are added
          # from a separately verified checkout below. NUL delimiters preserve
          # unusual path names and --no-recursion prevents following directories.
          root_paths="$RUNNER_TEMP/gitleaks-root-paths.nul"
          root_stage="$RUNNER_TEMP/gitleaks-root-stage.nul"
          if ! git ls-files -z --cached > "$root_paths" || ! git ls-files --stage -z > "$root_stage"; then incomplete tracked_source_inventory_failed; exit 0; fi
          if ! python3 - "$root_paths" "$root_stage" <<'PY'
          import sys
          from pathlib import Path
          paths_file, stage_file = map(Path, sys.argv[1:])
          nul = bytes([0])
          entries = [item for item in paths_file.read_bytes().split(nul) if item]
          gitlinks = set()
          for record in stage_file.read_bytes().split(nul):
              if not record or b"\t" not in record:
                  continue
              metadata, path = record.split(b"\t", 1)
              fields = metadata.split()
              if fields and fields[0] == b"160000":
                  gitlinks.add(path)
          entries = sorted(item for item in entries if not (item == b"mycelix-health" and item in gitlinks))
          paths_file.write_bytes(nul.join(entries) + (nul if entries else b""))
          PY
          then
            incomplete tracked_source_inventory_failed; exit 0
          fi
          if ! (tar --null --verbatim-files-from --no-recursion --files-from="$root_paths" -cf -) \
            | tar -xf - -C "$source_dir"; then incomplete tracked_source_snapshot_failed; exit 0; fi
          root_links="$(git ls-files --stage | awk '$1 == "160000" {n++} END {print n+0}')"
          if [[ -f .gitmodules ]]; then
            urls="$(git config -f .gitmodules --get-regexp '^submodule[.].*[.]url$' || true)"
            paths="$(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$' || true)"
            if [[ "$root_links" -ne 1 || ( "$urls" != "submodule.mycelix-health.url https://github.com/Luminous-Dynamics/mycelix-health" && "$urls" != "submodule.mycelix-health.url https://github.com/Luminous-Dynamics/mycelix-health.git" ) || "$paths" != "submodule.mycelix-health.path mycelix-health" ]]; then incomplete submodule_inventory_not_allowlisted; exit 0; fi
            expected="$(git ls-files --stage -- mycelix-health | awk '$1 == "160000" {print $2}')"
            if [[ -z "$expected" ]]; then incomplete submodule_gitlink_missing; exit 0; fi
            if ! git submodule update --init mycelix-health; then incomplete submodule_checkout_failed; exit 0; fi
            actual="$(git -C mycelix-health rev-parse HEAD 2>/dev/null || true)"
            if [[ "$actual" != "$expected" ]]; then incomplete submodule_head_mismatch; exit 0; fi
            nested="$(git -C mycelix-health ls-files --stage | awk '$1 == "160000" {n++} END {print n+0}')"
            if [[ "$nested" -gt 0 || -f mycelix-health/.gitmodules ]]; then incomplete nested_submodule_not_audited; exit 0; fi
            mkdir -p "$source_dir/mycelix-health"
            submodule_paths="$RUNNER_TEMP/gitleaks-submodule-paths.nul"
            if ! git -C mycelix-health ls-files -z --cached > "$submodule_paths"; then incomplete submodule_source_inventory_failed; exit 0; fi
            if ! (cd mycelix-health && tar --null --verbatim-files-from --no-recursion --files-from="$submodule_paths" -cf -) \
              | tar -xf - -C "$source_dir/mycelix-health"; then incomplete submodule_tracked_snapshot_failed; exit 0; fi
          elif [[ "$root_links" -ne 0 ]]; then incomplete gitlink_without_gitmodules; exit 0; fi

          source_inventory="$RUNNER_TEMP/gitleaks-source-inventory.nul"
          if ! (cd "$source_dir" && find . -mindepth 1 \( -type f -o -type l \) -printf '%P\0' | LC_ALL=C sort -z) > "$source_inventory"; then
            incomplete source_inventory_generation_failed; exit 0
          fi
          source_file_count="$(python3 - "$source_inventory" <<'PY'
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          print(sum(1 for item in raw.split(bytes([0])) if item))
          PY
          )"
          source_inventory_sha="$(sha256sum "$source_inventory" | cut -d' ' -f1)"
          if [[ ! "$source_file_count" =~ ^[0-9]+$ || ! "$source_inventory_sha" =~ ^[0-9a-f]{64}$ || "$source_file_count" -eq 0 ]]; then
            incomplete source_inventory_invalid; exit 0
          fi
          set_field secret_source_file_count "$source_file_count"
          set_field secret_source_inventory_sha256 "$source_inventory_sha"

          rc=0
          if env -i PATH="$PATH" HOME="$home_dir" "$binary" dir "$source_dir" --config "$config" --gitleaks-ignore-path "$empty_ignore" --redact=100 --no-banner --log-level error --report-format json --report-path "$raw_report" --timeout 1800 > /dev/null 2> "$RUNNER_TEMP/gitleaks-scanner.log"; then rc=0; else rc=$?; fi
          set_field secret_scan_exit_code "$rc"
          if [[ ! -f "$raw_report" ]] || ! jq -e 'type == "array" and all(.[]; type == "object" and (.RuleID | type == "string") and (.File | type == "string") and (.StartLine | type == "number") and (.EndLine | type == "number"))' "$raw_report" >/dev/null 2>&1; then incomplete gitleaks_report_missing_or_invalid; exit 0; fi
          raw_sha="$(sha256sum "$raw_report" | cut -d' ' -f1)"
          finding_count="$(jq -er 'length' "$raw_report" 2>/dev/null || echo unknown)"
          if [[ ! "$finding_count" =~ ^[0-9]+$ ]]; then incomplete gitleaks_report_count_invalid; exit 0; fi
          if [[ "$finding_count" -gt 0 ]]; then scan_status=FAIL; scan_reason=secret_findings_detected; elif [[ "$rc" -ne 0 ]]; then scan_status=INCOMPLETE; scan_reason=gitleaks_nonzero_without_findings; else scan_status=PASS; scan_reason=none; fi
          if ! jq --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg source_inventory "$source_inventory_sha" --argjson source_file_count "$source_file_count" --arg status "$scan_status" --arg reason "$scan_reason" --argjson count "$finding_count" '{schema:"luminous.security-audit.gitleaks-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",config_sha256:$config,source_file_count:$source_file_count,source_inventory_sha256:$source_inventory,status:$status,reason:$reason,finding_count:$count,findings:map({rule_id:.RuleID,file:.File,start_line:.StartLine,end_line:.EndLine})}' "$raw_report" > "$safe_report"; then incomplete gitleaks_sanitization_failed; exit 0; fi
          set_field secret_scan_status "$scan_status"
          set_field secret_scan_reason "$scan_reason"
          set_field secret_scanner_version v8.30.1
          set_field secret_scan_exit_code "$rc"
          set_field secret_config_sha256 "$config_sha"
          set_field secret_raw_report_sha256 "$raw_sha"
          set_field secret_source_file_count "$source_file_count"
          set_field secret_source_inventory_sha256 "$source_inventory_sha"
          set_field secret_finding_count "$finding_count"
          set_field secret_report_sha256 "$(sha256sum "$safe_report" | cut -d' ' -f1)"

          # The directory scan only sees present-day files. Scan the exact
          # audited commit's full ancestry as well so deleting a secret later
          # cannot erase evidence that it was committed.
          history_root_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          history_root_count="$(git rev-list --count HEAD 2>/dev/null || echo 0)"
          history_root_shallow="$(git rev-parse --is-shallow-repository 2>/dev/null || echo unknown)"
          history_sub_sha="not_required"
          history_sub_count=0
          history_sub_shallow=false
          history_status=PASS
          history_reason=none
          history_root_rc=NOT_RUN
          history_sub_rc=NOT_REQUIRED
          history_findings=0

          if [[ "$history_root_sha" != "$SUBJECT_SHA" || ! "$history_root_count" =~ ^[0-9]+$ || "$history_root_count" -lt 1 || "$history_root_shallow" != "false" ]]; then
            history_status=INCOMPLETE
            history_reason=exact_subject_history_incomplete_or_shallow
          else
            if env -i PATH="$PATH" HOME="$home_dir" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$binary" git "$GITHUB_WORKSPACE" --log-opts=HEAD --config "$config" --gitleaks-ignore-path "$empty_ignore" --redact=100 --no-banner --log-level error --report-format json --report-path "$history_raw_root" --timeout 1800 > /dev/null 2> "$RUNNER_TEMP/gitleaks-history-root.log"; then
              history_root_rc=0
            else
              history_root_rc=$?
            fi
            if [[ ! -f "$history_raw_root" ]] || ! jq -e 'type == "array" and all(.[]; type == "object" and (.RuleID | type == "string") and (.File | type == "string") and (.Commit | type == "string" and test("^[0-9a-f]{40}$")) and (.StartLine | type == "number") and (.EndLine | type == "number"))' "$history_raw_root" >/dev/null 2>&1; then
              history_status=INCOMPLETE
              history_reason=root_history_report_missing_or_invalid
            else
              history_findings="$(jq -er 'length' "$history_raw_root")"
              if [[ "$history_findings" -gt 0 ]]; then
                history_status=FAIL
                history_reason=secret_findings_in_git_history
              elif [[ "$history_root_rc" -ne 0 ]]; then
                history_status=INCOMPLETE
                history_reason=root_history_scanner_nonzero_without_findings
              fi
            fi
          fi

          # If the parent has the reviewed direct health submodule, scan its
          # complete ancestry too. Do not silently count its present-day files
          # as equivalent to its historical coverage.
          if [[ -f .gitmodules ]]; then
            expected_sub_sha="$(git ls-files --stage -- mycelix-health | awk '$1 == "160000" {print $2}')"
            actual_sub_sha="$(git -C mycelix-health rev-parse HEAD 2>/dev/null || true)"
            sub_count_raw="$(git -C mycelix-health rev-list --count HEAD 2>/dev/null || echo 0)"
            sub_shallow_raw="$(git -C mycelix-health rev-parse --is-shallow-repository 2>/dev/null || echo unknown)"
            if [[ "$expected_sub_sha" != "$actual_sub_sha" || ! "$sub_count_raw" =~ ^[0-9]+$ || "$sub_count_raw" -lt 1 || "$sub_shallow_raw" != "false" ]]; then
              if [[ "$history_status" != "FAIL" ]]; then history_status=INCOMPLETE; history_reason=allowlisted_submodule_history_incomplete_or_shallow; fi
              history_sub_rc=NOT_RUN
              history_sub_sha="${actual_sub_sha:-unknown}"
              history_sub_count=0
              history_sub_shallow="$sub_shallow_raw"
              printf 'mycelix-health history was not qualified: exact gitlink or complete history check failed.\n' > "$RUNNER_TEMP/gitleaks-history-submodule.log"
              printf '[]\n' > "$history_raw_submodule"
            else
              history_sub_sha="$actual_sub_sha"
              history_sub_count="$sub_count_raw"
              history_sub_shallow="$sub_shallow_raw"
              if env -i PATH="$PATH" HOME="$home_dir" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$binary" git "$GITHUB_WORKSPACE/mycelix-health" --log-opts=HEAD --config "$config" --gitleaks-ignore-path "$empty_ignore" --redact=100 --no-banner --log-level error --report-format json --report-path "$history_raw_submodule" --timeout 1800 > /dev/null 2> "$RUNNER_TEMP/gitleaks-history-submodule.log"; then
                history_sub_rc=0
              else
                history_sub_rc=$?
              fi
              if [[ ! -f "$history_raw_submodule" ]] || ! jq -e 'type == "array" and all(.[]; type == "object" and (.RuleID | type == "string") and (.File | type == "string") and (.Commit | type == "string" and test("^[0-9a-f]{40}$")) and (.StartLine | type == "number") and (.EndLine | type == "number"))' "$history_raw_submodule" >/dev/null 2>&1; then
                if [[ "$history_status" != "FAIL" ]]; then history_status=INCOMPLETE; history_reason=submodule_history_report_missing_or_invalid; fi
              else
                sub_findings="$(jq -er 'length' "$history_raw_submodule")"
                history_findings="$((history_findings + sub_findings))"
                if [[ "$sub_findings" -gt 0 ]]; then
                  history_status=FAIL
                  history_reason=secret_findings_in_git_history
                elif [[ "$history_sub_rc" -ne 0 && "$history_status" != "FAIL" ]]; then
                  history_status=INCOMPLETE
                  history_reason=submodule_history_scanner_nonzero_without_findings
                fi
              fi
            fi
          else
            printf '[]\n' > "$history_raw_submodule"
          fi

          history_inventory_sha="missing"
          if [[ "$history_root_sha" =~ ^[0-9a-f]{40}$ && "$history_root_count" =~ ^[0-9]+$ && "$history_sub_count" =~ ^[0-9]+$ ]]; then
            if ! jq -n \
              --arg schema "luminous.security-audit.gitleaks-history-inventory.v1" \
              --arg subject_sha "$SUBJECT_SHA" \
              --arg root_head "$history_root_sha" \
              --arg root_count "$history_root_count" \
              --arg root_shallow "$history_root_shallow" \
              --arg submodule_path "$( [[ -f .gitmodules ]] && printf 'mycelix-health' || printf 'not_required' )" \
              --arg submodule_head "$history_sub_sha" \
              --arg submodule_count "$history_sub_count" \
              --arg submodule_shallow "$history_sub_shallow" \
              --arg status "$history_status" \
              '{schema:$schema,subject_sha:$subject_sha,status:$status,root:{head:$root_head,commit_count:($root_count|tonumber),is_shallow:($root_shallow=="true")},submodule:{path:$submodule_path,head:$submodule_head,commit_count:($submodule_count|tonumber),is_shallow:($submodule_shallow=="true")}}' > "$history_inventory"; then
              history_status=INCOMPLETE
              history_reason=history_inventory_generation_failed
            else
              history_inventory_sha="$(sha256sum "$history_inventory" | cut -d' ' -f1)"
            fi
          else
            history_status=INCOMPLETE
            history_reason=history_inventory_fields_invalid
            jq -n --arg subject "$SUBJECT_SHA" --arg reason "$history_reason" '{schema:"luminous.security-audit.gitleaks-history-inventory.v1",subject_sha:$subject,status:"INCOMPLETE",reason:$reason,root:{head:"unknown",commit_count:null,is_shallow:null},submodule:{path:"unknown",head:"unknown",commit_count:null,is_shallow:null}}' > "$history_inventory"
          fi

          if [[ -f "$history_raw_root" ]] && jq -e 'type == "array"' "$history_raw_root" >/dev/null 2>&1; then
            if [[ -f "$history_raw_submodule" ]] && jq -e 'type == "array"' "$history_raw_submodule" >/dev/null 2>&1; then
              if ! jq -s '.[0] + .[1]' "$history_raw_root" "$history_raw_submodule" > "$history_raw_report"; then
                history_status=INCOMPLETE
                history_reason=history_report_merge_failed
                printf '[]\n' > "$history_raw_report"
              fi
            else
              cp "$history_raw_root" "$history_raw_report"
            fi
          else
            printf '[]\n' > "$history_raw_report"
            history_status=INCOMPLETE
            history_reason=root_history_report_missing
          fi
          history_raw_sha="$(sha256sum "$history_raw_report" | cut -d' ' -f1)"
          history_findings="$(jq -er 'length' "$history_raw_report" 2>/dev/null || echo unknown)"
          if [[ ! "$history_findings" =~ ^[0-9]+$ ]]; then
            history_status=INCOMPLETE
            history_reason=history_report_count_invalid
            history_findings=0
          elif [[ "$history_findings" -gt 0 ]]; then
            history_status=FAIL
            history_reason=secret_findings_in_git_history
          fi
          if ! jq --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg inventory "$history_inventory_sha" --arg raw "$history_raw_sha" --arg history_tip "$history_root_sha" --argjson root_count "$history_root_count" --arg submodule_tip "$history_sub_sha" --argjson submodule_count "$history_sub_count" --arg status "$history_status" --arg reason "$history_reason" --argjson count "$history_findings" '{schema:"luminous.security-audit.gitleaks-history-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",status:$status,reason:$reason,history_tip:$history_tip,history_commit_count:$root_count,submodule_tip:$submodule_tip,submodule_commit_count:$submodule_count,history_inventory_sha256:$inventory,config_sha256:$config,raw_report_sha256:$raw,finding_count:$count,findings:map({rule_id:.RuleID,file:.File,start_line:.StartLine,end_line:.EndLine,commit:.Commit})}' "$history_raw_report" > "$history_safe_report"; then
            history_status=INCOMPLETE
            history_reason=history_report_sanitization_failed
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg inventory "$history_inventory_sha" --arg raw "$history_raw_sha" --arg reason "$history_reason" '{schema:"luminous.security-audit.gitleaks-history-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",status:"INCOMPLETE",reason:$reason,history_tip:"unknown",history_commit_count:null,submodule_tip:"unknown",submodule_commit_count:null,history_inventory_sha256:$inventory,config_sha256:$config,raw_report_sha256:$raw,finding_count:null,findings:[]}' > "$history_safe_report"
          fi
          set_field secret_history_scan_status "$history_status"
          set_field secret_history_scan_reason "$history_reason"
          set_field secret_history_exit_code "root=$history_root_rc,submodule=$history_sub_rc"
          set_field secret_history_raw_report_sha256 "$history_raw_sha"
          set_field secret_history_report_sha256 "$(sha256sum "$history_safe_report" | cut -d' ' -f1)"
          set_field secret_history_inventory_sha256 "$history_inventory_sha"
          set_field secret_history_root_commit_count "$history_root_count"
          set_field secret_history_submodule_commit_count "$history_sub_count"
          set_field secret_history_finding_count "$history_findings"

      - name: Preserve workflow audit output
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/workflows
          summary="security-audit-results/workflows/summary.txt"
          if [[ ! -f "$summary" ]]; then
            {
              echo "schema=luminous.security-audit.workflow-receipt.v1"
              echo "repository=${GITHUB_REPOSITORY}"
              echo "subject_sha=$SUBJECT_SHA"
              echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
              echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
              echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
              echo "zizmor_status=INCOMPLETE"
              echo "actionlint_status=INCOMPLETE"
              echo "secret_scan_status=INCOMPLETE"
              echo "secret_scan_reason=checkout_or_scan_step_not_completed"
              echo "secret_scanner_version=v8.30.1"
              echo "secret_scan_exit_code=NOT_RUN"
              echo "secret_config_sha256=missing"
              echo "secret_raw_report_sha256=missing"
              echo "secret_report_sha256=missing"
              echo "secret_finding_count=unknown"
              echo "secret_history_scan_status=INCOMPLETE"
              echo "secret_history_scan_reason=checkout_or_receipt_initialization_failed"
              echo "secret_history_exit_code=NOT_RUN"
              echo "secret_history_raw_report_sha256=missing"
              echo "secret_history_report_sha256=missing"
              echo "secret_history_inventory_sha256=missing"
              echo "secret_history_root_commit_count=unknown"
              echo "secret_history_submodule_commit_count=unknown"
              echo "secret_history_finding_count=unknown"
              echo "incomplete_reason=checkout_or_receipt_initialization_failed"
            } > "$summary"
          fi
          secret_safe="security-audit-results/workflows/gitleaks-sanitized.json"
          if [[ ! -f "$secret_safe" ]]; then
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "${SUBJECT_SHA:-unknown}" '{schema:"luminous.security-audit.gitleaks-summary.v1", repository:$repository, subject_sha:$subject, scanner_version:"v8.30.1", config_sha256:"missing", status:"INCOMPLETE", reason:"secret_scan_step_not_completed", finding_count:null, findings:[]}' > "$secret_safe"
          fi
          safe_digest="$(sha256sum "$secret_safe" | cut -d' ' -f1)"
          safe_digest_fields="$(grep -c '^secret_report_sha256=' "$summary" || true)"
          if [[ "$safe_digest_fields" -eq 1 ]]; then
            sed -i "s#^secret_report_sha256=.*#secret_report_sha256=$safe_digest#" "$summary"
          elif [[ "$safe_digest_fields" -eq 0 ]]; then
            echo "secret_report_sha256=$safe_digest" >> "$summary"
          else
            echo "receipt_error=duplicate_secret_report_digest_fields" >> "$summary"
          fi
          history_safe="security-audit-results/workflows/gitleaks-history-sanitized.json"
          history_inventory="security-audit-results/workflows/gitleaks-history-inventory.json"
          if [[ ! -f "$history_safe" ]]; then
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "${SUBJECT_SHA:-unknown}" '{schema:"luminous.security-audit.gitleaks-history-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",status:"INCOMPLETE",reason:"history_scan_step_not_completed",history_tip:"unknown",history_commit_count:null,submodule_tip:"unknown",submodule_commit_count:null,history_inventory_sha256:"missing",config_sha256:"missing",raw_report_sha256:"missing",finding_count:null,findings:[]}' > "$history_safe"
          fi
          if [[ ! -f "$history_inventory" ]]; then
            jq -n --arg subject "${SUBJECT_SHA:-unknown}" '{schema:"luminous.security-audit.gitleaks-history-inventory.v1",subject_sha:$subject,status:"INCOMPLETE",reason:"history_scan_step_not_completed",root:{head:"unknown",commit_count:null,is_shallow:null},submodule:{path:"unknown",head:"unknown",commit_count:null,is_shallow:null}}' > "$history_inventory"
          fi
          history_safe_digest="$(sha256sum "$history_safe" | cut -d' ' -f1)"
          history_inventory_digest="$(sha256sum "$history_inventory" | cut -d' ' -f1)"
          history_safe_fields="$(grep -c '^secret_history_report_sha256=' "$summary" || true)"
          history_inventory_fields="$(grep -c '^secret_history_inventory_sha256=' "$summary" || true)"
          if [[ "$history_safe_fields" -eq 1 ]]; then
            sed -i "s#^secret_history_report_sha256=.*#secret_history_report_sha256=$history_safe_digest#" "$summary"
          elif [[ "$history_safe_fields" -eq 0 ]]; then
            echo "secret_history_report_sha256=$history_safe_digest" >> "$summary"
          else
            echo "receipt_error=duplicate_secret_history_report_digest_fields" >> "$summary"
          fi
          if [[ "$history_inventory_fields" -eq 1 ]]; then
            sed -i "s#^secret_history_inventory_sha256=.*#secret_history_inventory_sha256=$history_inventory_digest#" "$summary"
          elif [[ "$history_inventory_fields" -eq 0 ]]; then
            echo "secret_history_inventory_sha256=$history_inventory_digest" >> "$summary"
          else
            echo "receipt_error=duplicate_secret_history_inventory_digest_fields" >> "$summary"
          fi
          report="$RUNNER_TEMP/zizmor"
          destination="security-audit-results/workflows/zizmor.txt"
          if [[ -f "$report" ]]; then
            cp "$report" "$destination"
            report_sha256="$(sha256sum "$destination" | cut -d' ' -f1)"
            if [[ "${ZIZMOR_OUTCOME:-unknown}" == "success" ]]; then
              sed -i 's/^zizmor_status=.*/zizmor_status=PASS/' security-audit-results/workflows/summary.txt
            else
              sed -i 's/^zizmor_status=.*/zizmor_status=FAIL/' security-audit-results/workflows/summary.txt
            fi
            echo "zizmor_action_outcome=${ZIZMOR_OUTCOME:-unknown}" >> security-audit-results/workflows/summary.txt
            echo "zizmor_report_sha256=$report_sha256" >> security-audit-results/workflows/summary.txt
          else
            sed -i 's/^zizmor_status=.*/zizmor_status=INCOMPLETE/' security-audit-results/workflows/summary.txt
            echo "zizmor_action_outcome=${ZIZMOR_OUTCOME:-unknown}" >> security-audit-results/workflows/summary.txt
            echo "report_missing=true" >> security-audit-results/workflows/summary.txt
          fi
          case "${ACTIONLINT_OUTCOME:-unknown}" in
            success) sed -i 's/^actionlint_status=.*/actionlint_status=PASS/' "$summary" ;;
            failure|cancelled) sed -i 's/^actionlint_status=.*/actionlint_status=FAIL/' "$summary" ;;
            *) sed -i 's/^actionlint_status=.*/actionlint_status=INCOMPLETE/' "$summary" ;;
          esac
          echo "actionlint_action_outcome=${ACTIONLINT_OUTCOME:-unknown}" >> "$summary"
          actionlint_report="security-audit-results/workflows/actionlint.txt"
          if [[ -f "$actionlint_report" ]]; then
            echo "actionlint_report_sha256=$(sha256sum "$actionlint_report" | cut -d' ' -f1)" >> "$summary"
          else
            echo "actionlint_report_missing=true" >> "$summary"
          fi
      - name: Upload workflow audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-workflows
          path: security-audit-results/workflows/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce workflow and source-secret audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="security-audit-results/workflows/summary.txt"
          for key in engine_identity_status zizmor_status actionlint_status secret_scan_status secret_history_scan_status; do
            value="$(awk -F= -v key="$key" '$1 == key { n++; value=substr($0, index($0,"=")+1) } END { if (n == 1) print value; else exit 2 }' "$summary")"
            if [[ "$value" != "PASS" ]]; then echo "FAIL: $key=$value" >&2; exit 1; fi
          done

  rustsec:
    name: RustSec dependency audit and coverage
    if: inputs.audit_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact audit subject
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false
      - name: Assert exact checkout identity
        id: subject
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Initialize RustSec receipt
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/lockfiles
          {
            echo "schema=luminous.security-audit.receipt.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "observed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rustsec_status=INCOMPLETE"
            echo "incomplete_reason=setup_or_audit_not_completed"
            echo "engine_identity_status=INCOMPLETE"
          } > security-audit-results/summary.txt
          if [[ ! "$AUDIT_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sed -i 's/^rustsec_status=.*/rustsec_status=FAIL/' security-audit-results/summary.txt
            echo "incomplete_reason=invalid_audit_engine_sha" >> security-audit-results/summary.txt
            exit 2
          fi

      - name: Verify declared audit engine identity
        id: engine_identity
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          EVENT_SHA: ${{ github.sha }}
          AUDITED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          engine = os.environ["AUDIT_ENGINE_SHA"]
          subject = os.environ["SUBJECT_SHA"]
          event_sha = os.environ["EVENT_SHA"]
          repository = os.environ["AUDITED_REPOSITORY"]
          summary = Path("security-audit-results/summary.txt")

          def set_receipt_value(key, value):
              lines = summary.read_text(encoding="utf-8").splitlines()
              prefix = f"{key}="
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"receipt field {key} has {len(matches)} entries")
              lines[matches[0]] = f"{key}={value}"
              summary.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def fail(reason):
              set_receipt_value("engine_identity_status", "FAIL")
              with summary.open("a", encoding="utf-8") as receipt:
                  receipt.write(f"engine_identity_reason={reason}\n")
              print(f"FAIL: {reason}", file=sys.stderr)
              raise SystemExit(1)

          if not re.fullmatch(r"[0-9a-f]{40}", engine):
              fail("invalid_engine_sha")
          if not re.fullmatch(r"[0-9a-f]{40}", subject):
              fail("invalid_subject_sha")

          if repository == "Luminous-Dynamics/luminous-platform":
              caller = Path(".github/workflows/security-audit-self.yml")
              if not caller.is_file():
                  fail("platform_self_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              local_uses = re.findall(
                  r"^\s*uses:\s*\./\.github/workflows/security-audit\.yml\s*$",
                  text, re.MULTILINE
              )
              if len(local_uses) != 1:
                  fail("platform_local_engine_reference_missing_or_ambiguous")
              if engine != event_sha:
                  fail("platform_local_engine_sha_does_not_match_event_sha")
          else:
              caller = Path(".github/workflows/security-audit.yml")
              if not caller.is_file():
                  fail("caller_security_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              refs = re.findall(
                  r"^\s*uses:\s*Luminous-Dynamics/luminous-platform/\.github/workflows/security-audit\.yml@([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              declared = re.findall(
                  r"^\s*audit_engine_sha:\s*([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              if len(refs) != 1:
                  fail("immutable_shared_workflow_reference_missing_or_ambiguous")
              if len(declared) != 1:
                  fail("declared_engine_sha_missing_or_ambiguous")
              if refs[0] != engine or declared[0] != engine:
                  fail("caller_reference_and_engine_sha_mismatch")

          set_receipt_value("engine_identity_status", "PASS")
          with summary.open("a", encoding="utf-8") as receipt:
              receipt.write(f"engine_identity_checked_sha={engine}\n")
          print("PASS: declared audit engine identity matches the caller reference")
          PY
      - name: Initialize allow-listed direct submodules
        shell: bash
        run: |
          set -euo pipefail
          verified_file="$RUNNER_TEMP/verified-submodules.txt"
          : > "$verified_file"
          submodule_status="NOT_REQUIRED"
          submodule_reason=""
          if [[ -f .gitmodules ]]; then
            submodule_status="PASS"
            mapfile -t submodule_urls < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]url$' || true)
            mapfile -t submodule_paths < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$' || true)
            if [[ "${#submodule_urls[@]}" -ne 1 || "${#submodule_paths[@]}" -ne 1 ]]; then
              submodule_status="FAIL"
              submodule_reason="submodule_url_path_inventory_empty_or_mismatched"
            fi
            for line in "${submodule_urls[@]}"; do
              key="${line%% *}"
              module_name="${key#submodule.}"
              module_name="${module_name%.url}"
              url="${line#* }"
              case "$module_name:$url" in
                mycelix-health:https://github.com/Luminous-Dynamics/mycelix-health|mycelix-health:https://github.com/Luminous-Dynamics/mycelix-health.git) ;;
                *)
                  submodule_status="FAIL"
                  submodule_reason="submodule_name_or_url_not_exactly_allowlisted"
                  break
                  ;;
              esac
            done
            if [[ "$submodule_status" == "PASS" ]]; then
              for line in "${submodule_paths[@]}"; do
                key="${line%% *}"
                module_name="${key#submodule.}"
                module_name="${module_name%.path}"
                path="${line#* }"
                if [[ "$module_name:$path" != "mycelix-health:mycelix-health" ]]; then
                  submodule_status="FAIL"
                  submodule_reason="submodule_name_or_path_not_exactly_allowlisted"
                  break
                fi
              done
            fi
            if [[ "$submodule_status" == "PASS" ]]; then
              while IFS= read -r line; do
                path="${line#* }"
                if [[ ! "$path" =~ ^[A-Za-z0-9_./-]+$ || "$path" == /* || "$path" == *".."* || "$path" == "." || "$path" == ./* || "$path" == */./* || "$path" == */. ]]; then
                  submodule_status="FAIL"
                  submodule_reason="submodule_path_invalid"
                  break
                fi
              done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$')
            fi
            if [[ "$submodule_status" == "PASS" ]]; then
              if ! git submodule update --init; then
                submodule_status="INCOMPLETE"
                submodule_reason="submodule_checkout_failed"
              fi
            fi
            if [[ "$submodule_status" == "PASS" ]]; then
              while IFS= read -r line; do
                path="${line#* }"
                expected="$(git ls-files --stage -- "$path" | awk '$1 == "160000" {print $2}')"
                if [[ -z "$expected" || ! -d "$path" ]]; then
                  submodule_status="FAIL"
                  submodule_reason="submodule_gitlink_missing"
                  break
                fi
                actual="$(git -C "$path" rev-parse HEAD)"
                if [[ "$actual" != "$expected" ]]; then
                  submodule_status="FAIL"
                  submodule_reason="submodule_head_mismatch"
                  break
                fi
                printf '%s\n' "$path" >> "$verified_file"
              done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$')
            fi
          fi
          {
            echo "submodule_audit_status=$submodule_status"
            echo "submodule_audit_reason=${submodule_reason:-none}"
            echo "verified_direct_submodule_count=$(wc -l < "$verified_file" | tr -d ' ')"
          } | tee -a security-audit-results/summary.txt
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # immutable action commit
        with:
          toolchain: 1.96.0
      - name: Install pinned cargo-audit
        working-directory: ${{ runner.temp }}
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit dependencies and verify manifest coverage
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          result_root="$workspace/security-audit-results"
          verified_file="$RUNNER_TEMP/verified-submodules.txt"
          inventory_file="$RUNNER_TEMP/audit-lockfiles.txt"
          # Inventory locks from the exact checked-out commit tree, not the
          # mutable index or filesystem. Match by basename after NUL-safe tree
          # enumeration so nested lockfiles cannot disappear due to pathspec
          # differences between Git versions or working-directory context.
          tracked_named_paths() {
            local root="$1" prefix="$2"
            shift 2
            local tree_file path basename expected
            tree_file="$(mktemp "$RUNNER_TEMP/tracked-tree.XXXXXX")"
            if ! git -C "$root" ls-tree -r -z --name-only HEAD > "$tree_file"; then
              rm -f -- "$tree_file"
              echo "FAIL: cannot enumerate committed tree for $root" >&2
              return 2
            fi
            while IFS= read -r -d '' path; do
              if [[ "$path" =~ [[:cntrl:]] || "$path" == *=* ]]; then
                rm -f -- "$tree_file"
                echo "FAIL: tracked path cannot be represented safely in evidence: $root/$path" >&2
                return 2
              fi
              basename="${path##*/}"
              for expected in "$@"; do
                if [[ "$basename" == "$expected" ]]; then
                  printf '%s%s\n' "$prefix" "$path"
                  break
                fi
              done
            done < "$tree_file"
            rm -f -- "$tree_file"
          }

          raw_inventory="$RUNNER_TEMP/rustsec-lockfiles.raw"
          : > "$raw_inventory"
          lock_inventory_discovery_failed=0
          tracked_named_paths "$workspace" "" "Cargo.lock" >> "$raw_inventory" || lock_inventory_discovery_failed=1
          while IFS= read -r module_path; do
            [[ -n "$module_path" && -d "$workspace/$module_path" ]] || continue
            tracked_named_paths "$workspace/$module_path" "$module_path/" "Cargo.lock" >> "$raw_inventory" || lock_inventory_discovery_failed=1
          done < "$verified_file"
          if ! LC_ALL=C sort -u "$raw_inventory" > "$inventory_file"; then
            lock_inventory_discovery_failed=1
            : > "$inventory_file"
          fi
          mapfile -t lockfiles < "$inventory_file"
          printf '%s\n' "${lockfiles[@]}" > "$inventory_file"
          echo "lockfile_inventory_source=git-tree-at-HEAD" >> "$result_root/summary.txt"
          echo "lockfile_inventory_discovery_status=$([[ "$lock_inventory_discovery_failed" -eq 0 ]] && echo PASS || echo FAIL)" >> "$result_root/summary.txt"
          echo "lockfile_inventory_sha256=$(sha256sum "$inventory_file" | cut -d' ' -f1)" >> "$result_root/summary.txt"

          rustsec_failed=0
          coverage_failed=0
          if [[ "$lock_inventory_discovery_failed" -ne 0 ]]; then
            rustsec_failed=1
          fi
          if [[ "${#lockfiles[@]}" -eq 0 ]]; then
            rustsec_failed=1
            sed -i 's/^rustsec_status=.*/rustsec_status=FAIL/' "$result_root/summary.txt"
            echo "incomplete_reason=no_tracked_Cargo.lock_files" >> "$result_root/summary.txt"
          else
            sed -i 's/^rustsec_status=.*/rustsec_status=RUNNING/' "$result_root/summary.txt"
            sed -i '/^incomplete_reason=setup_or_audit_not_completed$/d' "$result_root/summary.txt"
          fi
          echo "lockfile_count=${#lockfiles[@]}" >> "$result_root/summary.txt"
          echo "rustc=$(rustc +1.96.0 --version)" >> "$result_root/summary.txt"
          echo "cargo=$(cargo +1.96.0 --version)" >> "$result_root/summary.txt"
          echo "cargo_audit=$(cargo audit --version)" >> "$result_root/summary.txt"

          advisory_db="$RUNNER_TEMP/rustsec-advisory-db"
          if git clone --depth 1 https://github.com/RustSec/advisory-db "$advisory_db"; then
            advisory_db_commit="$(git -C "$advisory_db" rev-parse HEAD)"
            if [[ "$advisory_db_commit" =~ ^[0-9a-f]{40}$ ]]; then
              {
                echo "advisory_db_status=PASS"
                echo "advisory_db_commit=$advisory_db_commit"
                echo "advisory_db_url=https://github.com/RustSec/advisory-db"
              } >> "$result_root/summary.txt"
            else
              echo "advisory_db_status=FAIL" >> "$result_root/summary.txt"
              echo "incomplete_reason=advisory_database_revision_invalid" >> "$result_root/summary.txt"
              rustsec_failed=1
              advisory_db=""
            fi
          else
            echo "advisory_db_status=FAIL" >> "$result_root/summary.txt"
            echo "incomplete_reason=advisory_database_clone_failed" >> "$result_root/summary.txt"
            rustsec_failed=1
            advisory_db=""
          fi

          assert_exact_committed_regular_file() {
            local root="$1" relative="$2" metadata mode object_type object_id actual parent rest component
            [[ -d "$root" && -n "$relative" && "$relative" != /* ]] || return 1
            rest="$relative"
            parent="$root"
            while [[ "$rest" == */* ]]; do
              component="${rest%%/*}"
              rest="${rest#*/}"
              parent="$parent/$component"
              [[ -d "$parent" && ! -L "$parent" ]] || return 1
            done
            metadata="$(git -C "$root" ls-tree --format='%(mode) %(type) %(objectname)' HEAD -- ":(literal)$relative")" || return 1
            [[ -n "$metadata" && "$metadata" != *$'\n'* ]] || return 1
            read -r mode object_type object_id <<< "$metadata"
            [[ "$mode" == "100644" || "$mode" == "100755" ]] || return 1
            [[ "$object_type" == "blob" && "$object_id" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || return 1
            [[ -f "$root/$relative" && ! -L "$root/$relative" ]] || return 1
            actual="$(git -C "$root" hash-object --no-filters -- "$root/$relative")" || return 1
            [[ "$actual" == "$object_id" ]]
          }

          # Regression fixture: a committed lockfile is accepted only while it
          # remains a regular file with the exact committed bytes. Mutations,
          # symlink substitution and untracked lookalikes must all be rejected.
          rustsec_identity_fixture="$RUNNER_TEMP/rustsec-input-identity-fixture"
          rm -rf -- "$rustsec_identity_fixture"
          git init -q "$rustsec_identity_fixture"
          git -C "$rustsec_identity_fixture" config user.name "Audit fixture"
          git -C "$rustsec_identity_fixture" config user.email "audit-fixture@example.invalid"
          mkdir -p "$rustsec_identity_fixture/nested"
          printf 'committed lockfile\n' > "$rustsec_identity_fixture/nested/Cargo.lock"
          printf 'symlink target\n' > "$rustsec_identity_fixture/nested/target.lock"
          git -C "$rustsec_identity_fixture" add nested
          git -C "$rustsec_identity_fixture" commit -qm "fixture: exact committed file identity"
          if ! assert_exact_committed_regular_file "$rustsec_identity_fixture" "nested/Cargo.lock"; then
            echo "FAIL: exact-input verifier rejected committed regular-file fixture" >&2
            exit 1
          fi
          printf 'mutated lockfile\n' > "$rustsec_identity_fixture/nested/Cargo.lock"
          if assert_exact_committed_regular_file "$rustsec_identity_fixture" "nested/Cargo.lock"; then
            echo "FAIL: exact-input verifier accepted worktree/HEAD content drift" >&2
            exit 1
          fi
          git -C "$rustsec_identity_fixture" checkout -- nested/Cargo.lock
          rm -- "$rustsec_identity_fixture/nested/Cargo.lock"
          ln -s target.lock "$rustsec_identity_fixture/nested/Cargo.lock"
          if assert_exact_committed_regular_file "$rustsec_identity_fixture" "nested/Cargo.lock"; then
            echo "FAIL: exact-input verifier accepted symlink substitution" >&2
            exit 1
          fi
          git -C "$rustsec_identity_fixture" checkout -- nested/Cargo.lock
          if assert_exact_committed_regular_file "$rustsec_identity_fixture" "nested/untracked.lock"; then
            echo "FAIL: exact-input verifier accepted an untracked lookalike" >&2
            exit 1
          fi
          echo "PASS: RustSec inputs are tied to exact committed regular-file blobs"

          if [[ -n "$advisory_db" ]]; then
            cd "$RUNNER_TEMP"
            for lockfile in "${lockfiles[@]}"; do
              report_id="$(printf '%s' "$lockfile" | sed 's#[^A-Za-z0-9._-]#_#g')"
              path_hash="$(printf '%s' "$lockfile" | sha256sum | cut -c1-12)"
              report="$result_root/lockfiles/${report_id}_$path_hash.json"
              stderr="$result_root/lockfiles/${report_id}_$path_hash.stderr"
              lockfile_abs="$workspace/$lockfile"
              lockfile_repo="$workspace"
              lockfile_rel="$lockfile"
              while IFS= read -r module_path; do
                [[ -n "$module_path" ]] || continue
                case "$lockfile" in
                  "$module_path"/*)
                    lockfile_repo="$workspace/$module_path"
                    lockfile_rel="${lockfile#${module_path}/}"
                    break
                    ;;
                esac
              done < "$verified_file"
              if [[ ! -f "$lockfile_abs" || -L "$lockfile_abs" ]] || ! assert_exact_committed_regular_file "$lockfile_repo" "$lockfile_rel"; then
                lock_reference="non-regular-or-missing"
                if [[ -L "$lockfile_abs" ]]; then lock_reference="$(readlink -- "$lockfile_abs")"; fi
                lock_reference_sha="$(printf '%s' "$lock_reference" | sha256sum | cut -d' ' -f1)"
                python3 - "$report" "$lockfile" "$lock_reference_sha" <<'PY'
          import json
          import sys
          from pathlib import Path
          report, lockfile, target_sha = sys.argv[1:]
          Path(report).write_text(json.dumps({
              "schema": "luminous.security-audit.rust-lockfile-result.v1",
              "status": "FAIL",
              "scanner_invoked": False,
              "reason": "lockfile_not_regular_file",
              "lockfile": lockfile,
              "lock_reference_sha256": target_sha
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
                printf '%s\n' "cargo-audit was not invoked because the tracked lockfile is missing, not regular, or a symlink." > "$stderr"
                report_sha256="$(sha256sum "$report" | cut -d' ' -f1)"
                stderr_sha256="$(sha256sum "$stderr" | cut -d' ' -f1)"
                printf 'lockfile=%s exit_code=NOT_RUN outcome=FAIL report_sha256=%s stderr_sha256=%s reason=lockfile_not_regular_file\n' "$lockfile" "$report_sha256" "$stderr_sha256" >> "$result_root/summary.txt"
                rustsec_failed=1
                continue
              fi
              lock_sha256="$(sha256sum "$lockfile_abs" | cut -d' ' -f1)"
              if cargo audit --db "$advisory_db" --no-fetch --file "$lockfile_abs" --json > "$report" 2> "$stderr"; then
                rc=0
              else
                rc=$?
                rustsec_failed=1
              fi
              if python3 - "$report" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path

          def valid_report(payload):
              if not isinstance(payload, dict):
                  return False
              database = payload.get("database")
              lockfile = payload.get("lockfile")
              settings = payload.get("settings")
              vulnerabilities = payload.get("vulnerabilities")
              warnings = payload.get("warnings")
              if not isinstance(database, dict) or type(database.get("advisory-count")) is not int or database["advisory-count"] < 0:
                  return False
              last_commit = database.get("last-commit")
              if last_commit is not None and (not isinstance(last_commit, str) or len(last_commit) != 40 or any(ch not in "0123456789abcdef" for ch in last_commit)):
                  return False
              last_updated = database.get("last-updated")
              if last_updated is not None and not isinstance(last_updated, str):
                  return False
              if not isinstance(lockfile, dict) or type(lockfile.get("dependency-count")) is not int or lockfile["dependency-count"] < 0:
                  return False
              if not isinstance(settings, dict):
                  return False
              if not isinstance(settings.get("target_arch"), list) or not all(isinstance(x, str) for x in settings["target_arch"]):
                  return False
              if not isinstance(settings.get("target_os"), list) or not all(isinstance(x, str) for x in settings["target_os"]):
                  return False
              if settings.get("severity") is not None and not isinstance(settings.get("severity"), str):
                  return False
              if not isinstance(settings.get("ignore"), list) or not all(isinstance(x, str) for x in settings["ignore"]):
                  return False
              if not isinstance(settings.get("informational_warnings"), list) or not all(isinstance(x, str) for x in settings["informational_warnings"]):
                  return False
              if not isinstance(vulnerabilities, dict):
                  return False
              if type(vulnerabilities.get("found")) is not bool:
                  return False
              if type(vulnerabilities.get("count")) is not int or vulnerabilities["count"] < 0:
                  return False
              if not isinstance(vulnerabilities.get("list"), list):
                  return False
              if vulnerabilities["count"] != len(vulnerabilities["list"]):
                  return False
              if vulnerabilities["found"] != (vulnerabilities["count"] > 0):
                  return False
              if not all(isinstance(item, dict) for item in vulnerabilities["list"]):
                  return False
              if not isinstance(warnings, dict) or not all(isinstance(items, list) for items in warnings.values()):
                  return False
              return True

          valid_fixture = {
              "database": {"advisory-count": 1, "last-commit": "a" * 40, "last-updated": "2026-01-01T00:00:00Z"},
              "lockfile": {"dependency-count": 2},
              "settings": {"target_arch": [], "target_os": [], "severity": None, "ignore": [], "informational_warnings": []},
              "vulnerabilities": {"found": False, "count": 0, "list": []},
              "warnings": {}
          }
