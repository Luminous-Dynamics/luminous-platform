name: SRQ causal integrity prototype

on:
  pull_request:
    paths:
      - '.github/workflows/srq-causal-integrity.yml'
      - 'benchmarks/srq-lifecycle-interop/causal-integrity/**'
      - 'benchmarks/srq-lifecycle-interop/challenge-ledger-rs/**'
      - 'benchmarks/srq-lifecycle-interop/guarantee-vector/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s benchmarks/srq-lifecycle-interop/causal-integrity -p 'test_*.py' -v
      - name: Run frozen attack/positive-control corpus
        run: |
          python benchmarks/srq-lifecycle-interop/causal-integrity/causal_integrity.py --self-test --commit-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/srq-causal-integrity-report.json"
          python - "$RUNNER_TEMP/srq-causal-integrity-report.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['status'] == 'PASS'
          assert report['qualification_status'] == 'BLOCKED'
          assert report['claim_ceiling'] == 'none'
          assert report['attack_case_count'] == 29
          assert report['positive_control_count'] == 3
          assert report['observed_case_count'] == 32
          assert report['harness_commit_sha'] == os.environ['GITHUB_SHA']
          assert len(report['protocol_raw_sha256']) == 64
          assert len(report['mutation_manifest_raw_sha256']) == 64
          assert report['mutation_manifest_raw_sha256'] == json.load(open('benchmarks/srq-lifecycle-interop/causal-integrity/causal-integrity-protocol-v1.json', encoding='utf-8'))['mutation_manifest_sha256']
          assert len(report['harness_script_raw_sha256']) == 64
          for key in ('false_accept_count', 'false_reject_count', 'unexpected_error_count', 'false_release_pass_count'):
              assert report[key] == 0, (key, report[key])
          PY
      - name: Run exhaustive causal reference-target matrix
        run: |
          python benchmarks/srq-lifecycle-interop/causal-integrity/causal_reference_matrix.py --commit-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/srq-reference-matrix-report.json"
          python - "$RUNNER_TEMP/srq-reference-matrix-report.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['status'] == 'PASS'
          assert report['qualification_status'] == 'BLOCKED'
          assert report['claim_ceiling'] == 'none'
          assert report['expected_state_count'] == report['observed_state_count'] == 143
          assert report['expected_edge_count'] == report['observed_edge_count'] == 14
          assert report['accepted_count'] == 14
          assert report['rejected_count'] == 129
          assert report['harness_commit_sha'] == os.environ['GITHUB_SHA']
          for key in ('false_accept_count', 'false_reject_count', 'unexpected_error_count', 'false_release_pass_count'):
              assert report[key] == 0, (key, report[key])
          PY
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - name: Format, test, and lint durable challenge ledger
        run: |
          cargo fmt --manifest-path benchmarks/srq-lifecycle-interop/challenge-ledger-rs/Cargo.toml --all -- --check
          cargo test --locked --manifest-path benchmarks/srq-lifecycle-interop/challenge-ledger-rs/Cargo.toml
          cargo clippy --locked --manifest-path benchmarks/srq-lifecycle-interop/challenge-ledger-rs/Cargo.toml --all-targets -- -D warnings
      - name: Run durable challenge replay benchmark
        run: |
          cargo run --locked --manifest-path benchmarks/srq-lifecycle-interop/challenge-ledger-rs/Cargo.toml --bin replay-benchmark > "$RUNNER_TEMP/srq-challenge-replay-report.json"
          python3 - "$RUNNER_TEMP/srq-challenge-replay-report.json" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          report_path = pathlib.Path(sys.argv[1])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          root = pathlib.Path.cwd()
          crate = root / "benchmarks/srq-lifecycle-interop/challenge-ledger-rs"
          report["harness_commit_sha"] = os.environ["GITHUB_SHA"]
          report["source_sha256"] = {
              name: hashlib.sha256((crate / name).read_bytes()).hexdigest()
              for name in ("Cargo.toml", "Cargo.lock", "src/lib.rs", "src/bin/replay-benchmark.rs", "tests/process_replay.rs")
          }
          assert report["status"] == "PASS"
          assert report["qualification_status"] == "BLOCKED"
          assert report["claim_ceiling"] == "none"
          assert report["concurrent_submissions"] == 64
          assert report["accepted_submissions"] == 1
          assert report["replay_rejections"] == 63
          assert report["unexpected_errors"] == 0
          assert report["persisted_replay_rejected"] is True
          assert report["concurrency_wall_ns"] > 0
          assert report["latency_p50_ns"] <= report["latency_p95_ns"] <= report["latency_p99_ns"]
          assert report["throughput_submissions_per_second"] > 0
          report["rustc_version"] = subprocess.run(
              ["rustc", "--version", "--verbose"], check=True, capture_output=True, text=True
          ).stdout.strip()
          report["cargo_version"] = subprocess.run(
              ["cargo", "--version"], check=True, capture_output=True, text=True
          ).stdout.strip()
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Format, test, and lint typed guarantee vector
        run: |
          cargo fmt --manifest-path benchmarks/srq-lifecycle-interop/guarantee-vector/Cargo.toml --all -- --check
          cargo test --locked --manifest-path benchmarks/srq-lifecycle-interop/guarantee-vector/Cargo.toml
          cargo clippy --locked --manifest-path benchmarks/srq-lifecycle-interop/guarantee-vector/Cargo.toml --all-targets -- -D warnings
      - name: Run typed guarantee-vector qualification matrix
        run: |
          cargo run --locked --manifest-path benchmarks/srq-lifecycle-interop/guarantee-vector/Cargo.toml --bin qualification-report > "$RUNNER_TEMP/srq-guarantee-vector-report.json"
          python3 - "$RUNNER_TEMP/srq-guarantee-vector-report.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          report_path = pathlib.Path(sys.argv[1])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          crate = pathlib.Path.cwd() / "benchmarks/srq-lifecycle-interop/guarantee-vector"
          report["harness_commit_sha"] = os.environ["GITHUB_SHA"]
          report["source_sha256"] = {
              name: hashlib.sha256((crate / name).read_bytes()).hexdigest()
              for name in ("Cargo.toml", "Cargo.lock", "src/lib.rs", "src/bin/qualification-report.rs")
          }
          assert report["status"] == "PASS"
          assert report["qualification_status"] == "BLOCKED"
          assert report["claim_ceiling"] == "none"
          assert report["scope"] == "typed_evidence_evaluator_only"
          assert report["expected_case_count"] == report["observed_case_count"] == 22
          assert report["unexpected_decision_count"] == 0
          assert report["false_release_count"] == 0
          assert report["false_block_count"] == 0
          assert report["exhaustive_combinations_checked"] == 2000
          assert report["exhaustive_false_release_count"] == 0
          assert report["exhaustive_false_block_count"] == 0
          assert report["harness_commit_sha"] == os.environ["GITHUB_SHA"]
          assert all(len(value) == 64 for value in report["source_sha256"].values())
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\\n", encoding="utf-8")
          PY
      - name: Retain exact-head benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: srq-causal-integrity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/srq-causal-integrity-report.json
            ${{ runner.temp }}/srq-reference-matrix-report.json
            ${{ runner.temp }}/srq-challenge-replay-report.json
            ${{ runner.temp }}/srq-guarantee-vector-report.json
          if-no-files-found: error
          retention-days: 30
