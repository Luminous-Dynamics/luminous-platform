name: ATR policy evidence closure and commit-boundary contract

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/POLICY_EVIDENCE_CLOSURE_AND_COMMIT_BOUNDARY_PROFILE_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/policy-evidence-closure-corpus-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/policy-evidence-closure-corpus-v0.1.json"
      - "tools/validate_policy_evidence_closure.py"
      - ".github/workflows/atr-policy-evidence-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-evidence-closure:
    name: Policy dependency closure and participant commit contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate dependency closure, exact action binding, commit and oracle separation
        run: python tools/validate_policy_evidence_closure.py
