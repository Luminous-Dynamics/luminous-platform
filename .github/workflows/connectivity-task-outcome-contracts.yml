name: connectivity-task-outcome-contracts

on:
  pull_request:
    paths:
      - "tools/connectivity-task-outcome-core/**"
      - "schemas/connectivity-task-outcome-*.schema.json"
      - "profiles/connectivity-task-outcome-benchmark-profile-v1.json"
      - "examples/connectivity-task-outcome-run-synthetic-v1.json"
      - "docs/CONNECTIVITY_TASK_OUTCOME_BENCHMARK_V1.md"
      - ".github/workflows/connectivity-task-outcome-contracts.yml"
  push:
    branches: [main]
    paths:
      - "tools/connectivity-task-outcome-core/**"
      - "schemas/connectivity-task-outcome-*.schema.json"
      - "profiles/connectivity-task-outcome-benchmark-profile-v1.json"
      - "examples/connectivity-task-outcome-run-synthetic-v1.json"
      - "docs/CONNECTIVITY_TASK_OUTCOME_BENCHMARK_V1.md"
      - ".github/workflows/connectivity-task-outcome-contracts.yml"

permissions:
  contents: read

jobs:
  task-outcome-contract:
    name: Check paired task outcomes and report invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/connectivity-task-outcome-core/Cargo.toml -- --check
      - name: Run all tests
        run: cargo test --manifest-path tools/connectivity-task-outcome-core/Cargo.toml --all-targets
      - name: Lint with warnings denied
        run: cargo clippy --manifest-path tools/connectivity-task-outcome-core/Cargo.toml --all-targets -- -D warnings
      - name: Validate synthetic paired run against exact profile bytes
        run: >-
          cargo run
          --manifest-path tools/connectivity-task-outcome-core/Cargo.toml
          --bin connectivity-task-outcome-verify
          --
          schemas/connectivity-task-outcome-run-v1.schema.json
          schemas/connectivity-task-outcome-profile-v1.schema.json
          profiles/connectivity-task-outcome-benchmark-profile-v1.json
          examples/connectivity-task-outcome-run-synthetic-v1.json
