name: SRQ-1 corpus contract

on:
  pull_request:
    paths:
      - ".github/workflows/srq-v1.yml"
      - "benchmarks/srq-v1/**"
      - "tools/srq-recovery-model/**"
      - "tools/srq-challenge-promotion-model/**"
      - "tools/srq-process-kill-model/**"
      - "docs/SOVEREIGN_RECOVERY_QUALIFICATION_V1.md"
      - "docs/SRQ_PROVENANCE_ATTESTATION_V1.md"
      - "docs/SRQ_PROCESS_KILL_MODEL_V1.md"
      - "docs/SRQ_SQLITE_TRANSACTION_BASELINE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  SRQ_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SRQ_EVENT_SHA: ${{ github.sha }}

jobs:
  validate-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source head
        # Immutable commit pin for actions/checkout v4.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact-head provenance
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          printf 'expected_source_sha=%s event_sha=%s actual_checkout_head=%s\n' "$SRQ_EXPECTED_SOURCE_SHA" "$SRQ_EVENT_SHA" "$actual_head"
          test "$actual_head" = "$SRQ_EXPECTED_SOURCE_SHA"

      - name: Install pinned Rust toolchain for the dependency-free model
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n benchmarks/srq-v1/validate.sh
          bash -n benchmarks/srq-v1/test-validator.sh
          bash -n benchmarks/srq-v1/validate-result.sh
          bash -n benchmarks/srq-v1/test-result-validator.sh
          bash -n benchmarks/srq-v1/evaluate-release.sh
          bash -n benchmarks/srq-v1/test-evaluate-release.sh
          bash -n benchmarks/srq-v1/install-pinned-gh.sh
          bash -n benchmarks/srq-v1/verify-attestation.sh
          bash -n benchmarks/srq-v1/test-verify-attestation.sh
          bash -n benchmarks/srq-v1/verify-evidence-bundle.sh
          bash -n benchmarks/srq-v1/test-verify-evidence-bundle.sh
          bash -n benchmarks/srq-v1/test-sqlite-promotion-reference.sh
          bash -n benchmarks/srq-v1/test-evaluate-attested-release.sh
          bash -n benchmarks/srq-v1/evaluate-attested-release.sh

      - name: Run bounded filesystem activation model
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-recovery-model-test.log"
          model_receipt="$RUNNER_TEMP/srq-update-004-model-result.json"
          command='cargo test --manifest-path tools/srq-recovery-model/Cargo.toml --locked'
          cargo test --manifest-path tools/srq-recovery-model/Cargo.toml --locked 2>&1 | tee "$model_log"
          # A green cargo exit is not enough if a required test disappears.
          grep -Fq 'test result: ok. 7 passed; 0 failed' "$model_log"
          grep -Fq 'tests::every_interruption_boundary_leaves_old_or_new_complete_generation ... ok' "$model_log"

          actual_head="$(git rev-parse HEAD)"
          evidence_sha="$(sha256sum "$model_log" | cut -d ' ' -f 1)"
          jq -n \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg command "$command" \
            --arg os "$(uname -sr)" \
            --arg architecture "$(uname -m)" \
            --arg toolchain "$(rustc --version)" \
            --arg evidence_sha "$evidence_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              scenario_id: "UPDATE-004",
              status: "PASS",
              reason: "The filesystem-backed model kept the previous or next complete generation across 100 injected checkpoint-return simulations at each of five activation boundaries (500 trials total). These are not process-kill or physical power-cut tests.",
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              execution: {
                tier: "model",
                steps_executed: true,
                command: $command,
                exit_code: 0,
                environment: {os: $os, architecture: $architecture, toolchain: $toolchain}
              },
              evidence: [{artifact: "srq-recovery-model-test.log", sha256: $evidence_sha, kind: "log"}],
              claim_ceiling: "abstract_model_only",
              non_claims: [
                "This is a filesystem-backed abstract model with synthetic generation payloads, not a production updater or bootloader.",
                "Checkpoint returns followed by reopen do not kill a process mid-syscall and are not equivalent to physical sudden-power-loss testing.",
                "No TUF signature policy, artifact provenance, signer/device identity, firmware root of trust, or TPM evidence is qualified.",
                "QEMU and physical activation scenarios remain unexecuted."
              ],
              fixture: false
            }' > "$model_receipt"

          bash benchmarks/srq-v1/validate-result.sh --evidence-root "$RUNNER_TEMP" "$model_receipt"

      - name: Run atomic challenge-promotion model
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-challenge-promotion-model-test.log"
          model_receipt="$RUNNER_TEMP/srq-evidence-003-model-result.json"
          command='cargo test --manifest-path tools/srq-challenge-promotion-model/Cargo.toml --locked'
          cargo test --manifest-path tools/srq-challenge-promotion-model/Cargo.toml --locked 2>&1 | tee "$model_log"
          # Protect the race/crash acceptance claims against accidental test deletion.
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$model_log"
          grep -Fq 'tests::sixty_four_concurrent_attempts_for_one_challenge_commit_exactly_once ... ok' "$model_log"
          grep -Fq 'tests::eight_independent_processes_share_one_challenge_commit ... ok' "$model_log"
          grep -Fq 'tests::interruption_boundaries_preserve_old_or_fully_promoted_state ... ok' "$model_log"

          actual_head="$(git rev-parse HEAD)"
          evidence_sha="$(sha256sum "$model_log" | cut -d ' ' -f 1)"
          jq -n \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg command "$command" \
            --arg os "$(uname -sr)" \
            --arg architecture "$(uname -m)" \
            --arg toolchain "$(rustc --version)" \
            --arg evidence_sha "$evidence_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              scenario_id: "EVIDENCE-003",
              status: "PASS",
              reason: "The Linux filesystem model serialized 64 concurrent worker threads and eight independent same-host processes so exactly one attempt consumed the challenge and promoted the next policy generation; 100 injected early-return checkpoint simulations preserved the previous or fully promoted state. These are not process-kill or physical power-cut tests.",
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              execution: {
                tier: "model",
                steps_executed: true,
                command: $command,
                exit_code: 0,
                environment: {os: $os, architecture: $architecture, toolchain: $toolchain}
              },
              evidence: [{artifact: "srq-challenge-promotion-model-test.log", sha256: $evidence_sha, kind: "log"}],
              claim_ceiling: "abstract_model_only",
              non_claims: [
                "This is a filesystem-backed contract model, not the production durable promotion database or policy gate.",
                "Linux flock serialization was tested with concurrent worker threads and separate child processes on one runner; cross-host or distributed locking is not qualified.",
                "Injected early returns on the runner filesystem do not emulate a process kill, kernel crash, or sudden physical power loss.",
                "No signer/device identity, trusted time, TUF metadata verification, TPM, firmware root of trust, QEMU or physical-device behavior is qualified."
              ],
              fixture: false
            }' > "$model_receipt"

          bash benchmarks/srq-v1/validate-result.sh --evidence-root "$RUNNER_TEMP" "$model_receipt"

      - name: Exercise real process-kill recovery at persistence boundaries
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-process-kill-model-test.log"
          cargo test --manifest-path tools/srq-process-kill-model/Cargo.toml --locked -- --nocapture 2>&1 | tee "$model_log"
          grep -Fq 'test result: ok. 3 passed; 0 failed' "$model_log"
          for checkpoint in after_temp_create during_temp_write after_temp_sync after_rename after_dir_sync; do
            grep -Fq "PASS: SIGKILL at $checkpoint recovered generation" "$model_log"
          done
          echo "PASS: child-process SIGKILL recovery model completed five persistence-boundary trials."
          echo "LIMIT: live-kernel process-kill test; not a kernel crash or physical power-loss test."

      - name: Exercise SQLite promotion transaction reference
        shell: bash
        run: |
          set -euo pipefail
          reference_log="$RUNNER_TEMP/srq-sqlite-promotion-reference.log"
          bash benchmarks/srq-v1/test-sqlite-promotion-reference.sh 2>&1 | tee "$reference_log"
          grep -Fq 'PASS: successful SQLite reference transaction commits policy, decision and challenge together' "$reference_log"
          grep -Fq 'PASS: stale-generation assertion rolls back policy, decision and challenge writes' "$reference_log"
          grep -Fq 'PASS: duplicate challenge replay is rejected with no partial state' "$reference_log"
          grep -Fq 'PASS: exactly one durable promotion across 64 independent writer processes' "$reference_log"
          grep -Eq '^sqlite_version=[0-9]+[.][0-9]+([.][0-9]+)? journal_mode=wal synchronous=FULL cases=4 process_contenders=64
      - name: Preserve SQLite baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-sqlite-reference-evidence
          path: ${{ runner.temp }}/srq-sqlite-promotion-reference.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile release qualification status from observed receipts
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/srq-release-qualification.json"
          bash benchmarks/srq-v1/evaluate-release.sh \
            --expected-source-sha "$SRQ_EXPECTED_SOURCE_SHA" \
            --evidence-root "$RUNNER_TEMP" \
            --output "$report" \
            "$RUNNER_TEMP/srq-update-004-model-result.json" \
            "$RUNNER_TEMP/srq-evidence-003-model-result.json"

          jq -e '
            .profile_id == "SRQ-1" and
            .expected_source_sha == env.SRQ_EXPECTED_SOURCE_SHA and
            .overall_status == "NOT_QUALIFIED" and
            .summary.total_release_gates == 22 and
            .summary.passed_at_qualifying_tier == 0 and
            .summary.insufficient_tier == 2 and
            .summary.missing_evidence == 20
          ' "$report" >/dev/null

          bash benchmarks/srq-v1/test-evaluate-release.sh \
            "$SRQ_EXPECTED_SOURCE_SHA" "$RUNNER_TEMP" \
            "$RUNNER_TEMP/srq-update-004-model-result.json" \
            "$RUNNER_TEMP/srq-evidence-003-model-result.json"

      - name: Assemble deterministic SRQ evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/srq-evidence-bundle"
          archive="$RUNNER_TEMP/srq-evidence-bundle.tar.gz"
          rm -rf "$bundle_dir" "$archive"
          mkdir -m 700 "$bundle_dir"

          evidence_names=(
            srq-challenge-promotion-model-test.log
            srq-evidence-003-model-result.json
            srq-process-kill-model-test.log
            srq-recovery-model-test.log
            srq-release-qualification.json
            srq-update-004-model-result.json
          )
          for name in "${evidence_names[@]}"; do
            source_file="$RUNNER_TEMP/$name"
            test -f "$source_file"
            cp -- "$source_file" "$bundle_dir/$name"
          done

          (
            cd "$bundle_dir"
            sha256sum "${evidence_names[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          checksum_sha="$(sha256sum "$bundle_dir/SHA256SUMS" | cut -d ' ' -f 1)"
          process_kill_sha="$(sha256sum "$bundle_dir/srq-process-kill-model-test.log" | cut -d ' ' -f 1)"
          corpus_sha="$(sha256sum benchmarks/srq-v1/scenarios.json | cut -d ' ' -f 1)"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$SRQ_EXPECTED_SOURCE_SHA"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path ".github/workflows/srq-v1.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg corpus_sha "$corpus_sha" \
            --arg checksum_sha "$checksum_sha" \
            --arg process_kill_sha "$process_kill_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              repository: $repository,
              workflow_path: $workflow_path,
              workflow_ref: $workflow_ref,
              workflow_sha: $workflow_sha,
              event_name: $event_name,
              run_id: $run_id,
              run_attempt: $run_attempt,
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              corpus_sha256: $corpus_sha,
              checksum_manifest_sha256: $checksum_sha,
              supplemental_observations: [{
                test_id: "SRQ-PROCESS-KILL-V1",
                scenario_id: "UPDATE-004",
                execution_tier: "model",
                claim_ceiling: "abstract_model_only",
                status: "PASS",
                evidence_artifact: "srq-process-kill-model-test.log",
                evidence_sha256: $process_kill_sha
              }]
            }' > "$bundle_dir/manifest.json"

          # GNU tar + gzip -n make archive metadata deterministic for byte-level comparison.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RUNNER_TEMP" srq-evidence-bundle | gzip -n > "$archive"
          sha256sum "$archive"

      - name: Preserve model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-model-evidence
          path: |
            ${{ runner.temp }}/srq-recovery-model-test.log
            ${{ runner.temp }}/srq-update-004-model-result.json
            ${{ runner.temp }}/srq-challenge-promotion-model-test.log
            ${{ runner.temp }}/srq-evidence-003-model-result.json
            ${{ runner.temp }}/srq-process-kill-model-test.log
            ${{ runner.temp }}/srq-release-qualification.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish attestation subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-evidence-attestation-subject
          path: ${{ runner.temp }}/srq-evidence-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Validate the frozen SRQ-1 corpus
        run: bash benchmarks/srq-v1/validate.sh

      - name: Exercise validator negative controls
        run: bash benchmarks/srq-v1/test-validator.sh

      - name: Validate PASS and NOT_RUN result receipt examples
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/validate-result.sh --allow-fixtures benchmarks/srq-v1/fixtures/result-pass-static.example.json
          bash benchmarks/srq-v1/validate-result.sh --allow-fixtures benchmarks/srq-v1/fixtures/result-not-run.example.json

      - name: Exercise result receipt negative controls
        run: bash benchmarks/srq-v1/test-result-validator.sh

      - name: Exercise authenticated provenance verifier contracts
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/test-verify-attestation.sh
          bash benchmarks/srq-v1/test-verify-evidence-bundle.sh
          bash benchmarks/srq-v1/test-evaluate-attested-release.sh


  attest-model-evidence:
    name: Sign and verify trusted-main SRQ evidence
    # PR events—including same-repo PRs—never receive the OIDC/attestation write permissions.
    # A manual run of the protected main branch is the only accepted provenance producer.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted workflow and verification policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Download exact-run evidence subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: srq-evidence-attestation-subject
          path: ${{ runner.temp }}/srq-attest-input

      - name: Install pinned GitHub CLI verifier
        shell: bash
        run: bash benchmarks/srq-v1/install-pinned-gh.sh

      - name: Validate bundle identity before signing
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/verify-evidence-bundle.sh \
            --archive "$RUNNER_TEMP/srq-attest-input/srq-evidence-bundle.tar.gz" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --extract-to "$RUNNER_TEMP/srq-pre-sign-validated"

      - name: Create signed SLSA provenance for the evidence bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/srq-attest-input/srq-evidence-bundle.tar.gz

      - name: Verify signature, signer, ref, source and artifact digest before evaluation
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/evaluate-attested-release.sh \
            --archive "$RUNNER_TEMP/srq-attest-input/srq-evidence-bundle.tar.gz" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-envelope "$RUNNER_TEMP/srq-attested-evaluation-envelope.json" \
            --output-report "$RUNNER_TEMP/srq-attested-release-evaluation.json" \
            --output-verification "$RUNNER_TEMP/srq-attestation-verification.json"

      - name: Preserve verified provenance and evaluation records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-attested-evidence-verification
          path: |
            ${{ runner.temp }}/srq-attested-evaluation-envelope.json
            ${{ runner.temp }}/srq-attested-release-evaluation.json
            ${{ runner.temp }}/srq-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
 "$reference_log"

      - name: Preserve SQLite baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-sqlite-reference-evidence
          path: ${{ runner.temp }}/srq-sqlite-promotion-reference.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile release qualification status from observed receipts
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/srq-release-qualification.json"
          bash benchmarks/srq-v1/evaluate-release.sh \
            --expected-source-sha "$SRQ_EXPECTED_SOURCE_SHA" \
            --evidence-root "$RUNNER_TEMP" \
            --output "$report" \
            "$RUNNER_TEMP/srq-update-004-model-result.json" \
            "$RUNNER_TEMP/srq-evidence-003-model-result.json"

          jq -e '
            .profile_id == "SRQ-1" and
            .expected_source_sha == env.SRQ_EXPECTED_SOURCE_SHA and
            .overall_status == "NOT_QUALIFIED" and
            .summary.total_release_gates == 22 and
            .summary.passed_at_qualifying_tier == 0 and
            .summary.insufficient_tier == 2 and
            .summary.missing_evidence == 20
          ' "$report" >/dev/null

          bash benchmarks/srq-v1/test-evaluate-release.sh \
            "$SRQ_EXPECTED_SOURCE_SHA" "$RUNNER_TEMP" \
            "$RUNNER_TEMP/srq-update-004-model-result.json" \
            "$RUNNER_TEMP/srq-evidence-003-model-result.json"

      - name: Assemble deterministic SRQ evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/srq-evidence-bundle"
          archive="$RUNNER_TEMP/srq-evidence-bundle.tar.gz"
          rm -rf "$bundle_dir" "$archive"
          mkdir -m 700 "$bundle_dir"

          evidence_names=(
            srq-challenge-promotion-model-test.log
            srq-evidence-003-model-result.json
            srq-process-kill-model-test.log
            srq-recovery-model-test.log
            srq-release-qualification.json
            srq-update-004-model-result.json
          )
          for name in "${evidence_names[@]}"; do
            source_file="$RUNNER_TEMP/$name"
            test -f "$source_file"
            cp -- "$source_file" "$bundle_dir/$name"
          done

          (
            cd "$bundle_dir"
            sha256sum "${evidence_names[@]}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          checksum_sha="$(sha256sum "$bundle_dir/SHA256SUMS" | cut -d ' ' -f 1)"
          process_kill_sha="$(sha256sum "$bundle_dir/srq-process-kill-model-test.log" | cut -d ' ' -f 1)"
          corpus_sha="$(sha256sum benchmarks/srq-v1/scenarios.json | cut -d ' ' -f 1)"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$SRQ_EXPECTED_SOURCE_SHA"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_path ".github/workflows/srq-v1.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg corpus_sha "$corpus_sha" \
            --arg checksum_sha "$checksum_sha" \
            --arg process_kill_sha "$process_kill_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              repository: $repository,
              workflow_path: $workflow_path,
              workflow_ref: $workflow_ref,
              workflow_sha: $workflow_sha,
              event_name: $event_name,
              run_id: $run_id,
              run_attempt: $run_attempt,
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              corpus_sha256: $corpus_sha,
              checksum_manifest_sha256: $checksum_sha,
              supplemental_observations: [{
                test_id: "SRQ-PROCESS-KILL-V1",
                scenario_id: "UPDATE-004",
                execution_tier: "model",
                claim_ceiling: "abstract_model_only",
                status: "PASS",
                evidence_artifact: "srq-process-kill-model-test.log",
                evidence_sha256: $process_kill_sha
              }]
            }' > "$bundle_dir/manifest.json"

          # GNU tar + gzip -n make archive metadata deterministic for byte-level comparison.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RUNNER_TEMP" srq-evidence-bundle | gzip -n > "$archive"
          sha256sum "$archive"

      - name: Preserve model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-model-evidence
          path: |
            ${{ runner.temp }}/srq-recovery-model-test.log
            ${{ runner.temp }}/srq-update-004-model-result.json
            ${{ runner.temp }}/srq-challenge-promotion-model-test.log
            ${{ runner.temp }}/srq-evidence-003-model-result.json
            ${{ runner.temp }}/srq-process-kill-model-test.log
            ${{ runner.temp }}/srq-release-qualification.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish attestation subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-evidence-attestation-subject
          path: ${{ runner.temp }}/srq-evidence-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Validate the frozen SRQ-1 corpus
        run: bash benchmarks/srq-v1/validate.sh

      - name: Exercise validator negative controls
        run: bash benchmarks/srq-v1/test-validator.sh

      - name: Validate PASS and NOT_RUN result receipt examples
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/validate-result.sh --allow-fixtures benchmarks/srq-v1/fixtures/result-pass-static.example.json
          bash benchmarks/srq-v1/validate-result.sh --allow-fixtures benchmarks/srq-v1/fixtures/result-not-run.example.json

      - name: Exercise result receipt negative controls
        run: bash benchmarks/srq-v1/test-result-validator.sh

      - name: Exercise authenticated provenance verifier contracts
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/test-verify-attestation.sh
          bash benchmarks/srq-v1/test-verify-evidence-bundle.sh
          bash benchmarks/srq-v1/test-evaluate-attested-release.sh


  attest-model-evidence:
    name: Sign and verify trusted-main SRQ evidence
    # PR events—including same-repo PRs—never receive the OIDC/attestation write permissions.
    # A manual run of the protected main branch is the only accepted provenance producer.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted workflow and verification policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Download exact-run evidence subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: srq-evidence-attestation-subject
          path: ${{ runner.temp }}/srq-attest-input

      - name: Install pinned GitHub CLI verifier
        shell: bash
        run: bash benchmarks/srq-v1/install-pinned-gh.sh

      - name: Validate bundle identity before signing
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/verify-evidence-bundle.sh \
            --archive "$RUNNER_TEMP/srq-attest-input/srq-evidence-bundle.tar.gz" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --extract-to "$RUNNER_TEMP/srq-pre-sign-validated"

      - name: Create signed SLSA provenance for the evidence bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/srq-attest-input/srq-evidence-bundle.tar.gz

      - name: Verify signature, signer, ref, source and artifact digest before evaluation
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/evaluate-attested-release.sh \
            --archive "$RUNNER_TEMP/srq-attest-input/srq-evidence-bundle.tar.gz" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-envelope "$RUNNER_TEMP/srq-attested-evaluation-envelope.json" \
            --output-report "$RUNNER_TEMP/srq-attested-release-evaluation.json" \
            --output-verification "$RUNNER_TEMP/srq-attestation-verification.json"

      - name: Preserve verified provenance and evaluation records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-attested-evidence-verification
          path: |
            ${{ runner.temp }}/srq-attested-evaluation-envelope.json
            ${{ runner.temp }}/srq-attested-release-evaluation.json
            ${{ runner.temp }}/srq-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
