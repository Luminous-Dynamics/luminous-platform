name: Security Audit Verifier Unit Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-verifier-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verifier-tests:
    name: Test independent verifier policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head (unprivileged test only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'

      - name: Compile all policy test sources and run exact test inventory
        env:
          EXPECTED_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/verify_security_audit_trust_anchor.py \
            .github/scripts/test_verify_security_audit_trust_anchor.py \
            .github/scripts/audit_security_required_checks.py \
            .github/scripts/test_audit_security_required_checks.py \
            .github/scripts/run_security_audit_policy_tests.py \
            .github/scripts/test_run_security_audit_policy_tests.py
          python3 .github/scripts/run_security_audit_policy_tests.py

      - name: Upload exact-head policy test receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-policy-test-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-audit-policy-test-receipt.json
          if-no-files-found: warn
          retention-days: 7
