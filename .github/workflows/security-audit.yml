      - name: Upload RustSec audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-rustsec
          path: security-audit-results/
          if-no-files-found: error
          retention-days: 14

  npmsec:
    name: npm dependency audit
    if: inputs.audit_node
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact audit subject
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false
      - name: Assert exact checkout identity
        id: subject
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Initialize npm audit receipt
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/npm/lockfiles
          {
            echo "schema=luminous.security-audit.npm-receipt.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "observed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "npm_status=INCOMPLETE"
            echo "engine_identity_status=INCOMPLETE"
            echo "incomplete_reason=setup_or_audit_not_completed"
          } > security-audit-results/npm/summary.txt
          if [[ ! "$AUDIT_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sed -i 's/^npm_status=.*/npm_status=FAIL/' security-audit-results/npm/summary.txt
            echo "incomplete_reason=invalid_audit_engine_sha" >> security-audit-results/npm/summary.txt
            exit 2
          fi
      - name: Verify declared audit engine identity
        id: engine_identity
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          EVENT_SHA: ${{ github.sha }}
          AUDITED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          engine = os.environ["AUDIT_ENGINE_SHA"]
          subject = os.environ["SUBJECT_SHA"]
          event_sha = os.environ["EVENT_SHA"]
          repository = os.environ["AUDITED_REPOSITORY"]
          summary = Path("security-audit-results/npm/summary.txt")

          def set_receipt_value(key, value):
              lines = summary.read_text(encoding="utf-8").splitlines()
              prefix = f"{key}="
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"receipt field {key} has {len(matches)} entries")
              lines[matches[0]] = f"{key}={value}"
              summary.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def fail(reason):
              set_receipt_value("engine_identity_status", "FAIL")
              with summary.open("a", encoding="utf-8") as receipt:
                  receipt.write(f"engine_identity_reason={reason}\n")
              print(f"FAIL: {reason}", file=sys.stderr)
              raise SystemExit(1)

          if not re.fullmatch(r"[0-9a-f]{40}", engine):
              fail("invalid_engine_sha")
          if not re.fullmatch(r"[0-9a-f]{40}", subject):
              fail("invalid_subject_sha")

          if repository == "Luminous-Dynamics/luminous-platform":
              # The platform audits its local reusable workflow from the
              # event commit (including the PR merge ref), while it scans the
              # PR head separately as subject_sha.
              caller = Path(".github/workflows/security-audit-self.yml")
              if not caller.is_file():
                  fail("platform_self_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              local_uses = re.findall(
                  r"^\s*uses:\s*\./\.github/workflows/security-audit\.yml\s*$",
                  text, re.MULTILINE
              )
              if len(local_uses) != 1:
                  fail("platform_local_engine_reference_missing_or_ambiguous")
              if engine != event_sha:
                  fail("platform_local_engine_sha_does_not_match_event_sha")
          else:
              caller = Path(".github/workflows/security-audit.yml")
              if not caller.is_file():
                  fail("caller_security_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              refs = re.findall(
                  r"^\s*uses:\s*Luminous-Dynamics/luminous-platform/\.github/workflows/security-audit\.yml@([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              declared = re.findall(
                  r"^\s*audit_engine_sha:\s*([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              if len(refs) != 1:
                  fail("immutable_shared_workflow_reference_missing_or_ambiguous")
              if len(declared) != 1:
                  fail("declared_engine_sha_missing_or_ambiguous")
              if refs[0] != engine or declared[0] != engine:
                  fail("caller_reference_and_engine_sha_mismatch")

          set_receipt_value("engine_identity_status", "PASS")
          with summary.open("a", encoding="utf-8") as receipt:
              receipt.write(f"engine_identity_checked_sha={engine}\n")
          print("PASS: declared audit engine identity matches the caller reference")
          PY
      - name: Install pinned Node.js LTS runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Audit tracked npm lockfiles without installing project code
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          result_root="$workspace/security-audit-results/npm"
          verified_npm_submodules="$RUNNER_TEMP/verified-npm-submodules.txt"
          : > "$verified_npm_submodules"
          npm_submodule_status="NOT_REQUIRED"
          npm_submodule_reason=""
          npm_failed=0
          if [[ -f .gitmodules ]]; then
            npm_submodule_status="PASS"
            mapfile -t submodule_urls < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]url$' || true)
            mapfile -t submodule_paths < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$' || true)
            if [[ "${#submodule_urls[@]}" -ne 1 || "${#submodule_paths[@]}" -ne 1 ]]; then
              npm_submodule_status="FAIL"
              npm_submodule_reason="submodule_url_path_inventory_empty_or_mismatched"
            fi
            for line in "${submodule_urls[@]}"; do
              key="${line%% *}"
              module_name="${key#submodule.}"
              module_name="${module_name%.url}"
              url="${line#* }"
              case "$module_name:$url" in
                mycelix-health:https://github.com/Luminous-Dynamics/mycelix-health|mycelix-health:https://github.com/Luminous-Dynamics/mycelix-health.git) ;;
                *)
                  npm_submodule_status="FAIL"
                  npm_submodule_reason="submodule_name_or_url_not_exactly_allowlisted"
                  break
                  ;;
              esac
            done
            if [[ "$npm_submodule_status" == "PASS" ]]; then
              for line in "${submodule_paths[@]}"; do
                key="${line%% *}"
                module_name="${key#submodule.}"
                module_name="${module_name%.path}"
                path="${line#* }"
                if [[ "$module_name:$path" != "mycelix-health:mycelix-health" ]]; then
                  npm_submodule_status="FAIL"
                  npm_submodule_reason="submodule_name_or_path_not_exactly_allowlisted"
                  break
                fi
              done
            fi
            if [[ "$npm_submodule_status" == "PASS" ]]; then
              while IFS= read -r line; do
                path="${line#* }"
                if [[ ! "$path" =~ ^[A-Za-z0-9_./-]+$ || "$path" == /* || "$path" == *".."* || "$path" == "." || "$path" == ./* || "$path" == */./* || "$path" == */. ]]; then
                  npm_submodule_status="FAIL"
                  npm_submodule_reason="submodule_path_invalid"
                  break
                fi
              done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$' || true)
            fi
            if [[ "$npm_submodule_status" == "PASS" ]]; then
              if ! git submodule update --init mycelix-health; then
                npm_submodule_status="INCOMPLETE"
                npm_submodule_reason="submodule_checkout_failed"
              fi
            fi
            if [[ "$npm_submodule_status" == "PASS" ]]; then
              while IFS= read -r line; do
                path="${line#* }"
                expected="$(git ls-files --stage -- "$path" | awk '$1 == "160000" {print $2}')"
                if [[ -z "$expected" || ! -d "$path" ]]; then
                  npm_submodule_status="FAIL"
                  npm_submodule_reason="submodule_gitlink_missing"
                  break
                fi
                actual="$(git -C "$path" rev-parse HEAD)"
                if [[ "$actual" != "$expected" ]]; then
                  npm_submodule_status="FAIL"
                  npm_submodule_reason="submodule_head_mismatch"
                  break
                fi
                printf '%s\n' "$path" >> "$verified_npm_submodules"
                nested_count="$(git -C "$path" ls-files --stage | awk '$1 == "160000" {count++} END {print count+0}')"
                if [[ "$nested_count" -gt 0 ]]; then
                  npm_submodule_status="FAIL"
                  npm_submodule_reason="nested_submodule_not_audited"
                fi
              done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$' || true)
            fi
          fi
          if [[ "$npm_submodule_status" != "PASS" && "$npm_submodule_status" != "NOT_REQUIRED" ]]; then npm_failed=1; fi
          {
            echo "npm_submodule_audit_status=$npm_submodule_status"
            echo "npm_submodule_audit_reason=${npm_submodule_reason:-none}"
            echo "verified_npm_direct_submodule_count=$(wc -l < "$verified_npm_submodules" | tr -d ' ')"
          } | tee -a "$result_root/summary.txt"
          # Use the exact subject commit tree for both the lockfile and
          # manifest inventory. This makes nested-file discovery explicit and
          # avoids treating a stale/mutated index as evidence about HEAD.
          tracked_named_paths() {
            local root="$1" prefix="$2"
            shift 2
            local tree_file path basename expected
            tree_file="$(mktemp "$RUNNER_TEMP/tracked-tree.XXXXXX")"
            if ! git -C "$root" ls-tree -r -z --name-only HEAD > "$tree_file"; then
              rm -f -- "$tree_file"
              echo "FAIL: cannot enumerate committed tree for $root" >&2
              return 2
            fi
            while IFS= read -r -d '' path; do
              if [[ "$path" =~ [[:cntrl:]] || "$path" == *=* ]]; then
                rm -f -- "$tree_file"
                echo "FAIL: tracked path cannot be represented safely in evidence: $root/$path" >&2
                return 2
              fi
              basename="${path##*/}"
              for expected in "$@"; do
                if [[ "$basename" == "$expected" ]]; then
                  printf '%s%s\n' "$prefix" "$path"
                  break
                fi
              done
            done < "$tree_file"
            rm -f -- "$tree_file"
          }

          stage_exact_committed_blob() {
            local root="$1" relative="$2" destination="$3" metadata mode object_type object_id actual staged parent rest component temporary
            [[ -d "$root" && -n "$relative" && "$relative" != /* ]] || return 1
            rest="$relative"
            parent="$root"
            while [[ "$rest" == */* ]]; do
              component="${rest%%/*}"
              rest="${rest#*/}"
              parent="$parent/$component"
              [[ -d "$parent" && ! -L "$parent" ]] || return 1
            done
            metadata="$(git -C "$root" ls-tree --format='%(mode) %(type) %(objectname)' HEAD -- ":(literal)$relative")" || return 1
            [[ -n "$metadata" && "$metadata" != *$'\n'* ]] || return 1
            read -r mode object_type object_id <<< "$metadata"
            [[ "$mode" == "100644" || "$mode" == "100755" ]] || return 1
            [[ "$object_type" == "blob" && "$object_id" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || return 1
            [[ -f "$root/$relative" && ! -L "$root/$relative" ]] || return 1
            actual="$(git -C "$root" hash-object --no-filters -- "$root/$relative")" || return 1
            [[ "$actual" == "$object_id" ]] || return 1
            mkdir -p -- "$(dirname -- "$destination")" || return 1
            temporary="${destination}.tmp.$$"
            rm -f -- "$temporary"
            if ! git -C "$root" cat-file blob "$object_id" > "$temporary"; then
              rm -f -- "$temporary"
              return 1
            fi
            staged="$(git -C "$root" hash-object --no-filters -- "$temporary")" || { rm -f -- "$temporary"; return 1; }
            if [[ "$staged" != "$object_id" ]]; then
              rm -f -- "$temporary"
              return 1
            fi
            mv -f -- "$temporary" "$destination"
          }

          # Adversarial fixture: prove that recursive discovery includes a
          # committed nested SDK lock, ignores untracked lookalikes, does not
          # walk into a gitlink, and stages only exact committed file bytes.
          npm_discovery_fixture="$RUNNER_TEMP/npm-lock-discovery-fixture"
          rm -rf -- "$npm_discovery_fixture"
          git init -q "$npm_discovery_fixture"
          git -C "$npm_discovery_fixture" config user.name "Audit fixture"
          git -C "$npm_discovery_fixture" config user.email "audit-fixture@example.invalid"
          mkdir -p "$npm_discovery_fixture/sdk"
          printf '{"name":"fixture-sdk"}\n' > "$npm_discovery_fixture/sdk/package.json"
          printf '{"name":"fixture-sdk","lockfileVersion":3}\n' > "$npm_discovery_fixture/sdk/package-lock.json"
          printf 'symlink target\n' > "$npm_discovery_fixture/sdk/target.lock"
          git -C "$npm_discovery_fixture" add sdk
          git -C "$npm_discovery_fixture" commit -qm "fixture: nested tracked npm lock"
          if ! stage_exact_committed_blob "$npm_discovery_fixture" "sdk/package-lock.json" "$RUNNER_TEMP/npm-input-fixture/staged-lock.json"; then
            echo "FAIL: exact-input stager rejected the nested tracked SDK lockfile" >&2
            exit 1
          fi
          if ! cmp -s "$npm_discovery_fixture/sdk/package-lock.json" "$RUNNER_TEMP/npm-input-fixture/staged-lock.json"; then
            echo "FAIL: staged npm lockfile bytes do not match the committed blob" >&2
            exit 1
          fi
          npm_fixture_inventory="$RUNNER_TEMP/npm-lock-discovery-fixture-inventory.txt"
          tracked_named_paths "$npm_discovery_fixture" "" "package-lock.json" "npm-shrinkwrap.json" > "$npm_fixture_inventory"
          if [[ "$(wc -l < "$npm_fixture_inventory" | tr -d ' ')" != "1" ]] || ! grep -Fxq "sdk/package-lock.json" "$npm_fixture_inventory"; then
            echo "FAIL: recursive npm discovery did not return the exact nested committed lockfile" >&2
            exit 1
          fi
          mkdir -p "$npm_discovery_fixture/untracked"
          printf '{"name":"untracked"}\n' > "$npm_discovery_fixture/untracked/package-lock.json"
          tracked_named_paths "$npm_discovery_fixture" "" "package-lock.json" "npm-shrinkwrap.json" > "$npm_fixture_inventory"
          if [[ "$(wc -l < "$npm_fixture_inventory" | tr -d ' ')" != "1" ]] || grep -Fxq "untracked/package-lock.json" "$npm_fixture_inventory"; then
            echo "FAIL: recursive npm discovery accepted an untracked lookalike" >&2
            exit 1
          fi
          printf '{"name":"mutated-worktree"}\n' > "$npm_discovery_fixture/sdk/package-lock.json"
          if stage_exact_committed_blob "$npm_discovery_fixture" "sdk/package-lock.json" "$RUNNER_TEMP/npm-input-fixture/mutated.json"; then
            echo "FAIL: npm stager accepted worktree/HEAD content drift" >&2
            exit 1
          fi
          git -C "$npm_discovery_fixture" checkout -- sdk/package-lock.json
          rm -- "$npm_discovery_fixture/sdk/package-lock.json"
          ln -s target.lock "$npm_discovery_fixture/sdk/package-lock.json"
          if stage_exact_committed_blob "$npm_discovery_fixture" "sdk/package-lock.json" "$RUNNER_TEMP/npm-input-fixture/symlink.json"; then
            echo "FAIL: npm stager accepted symlink substitution" >&2
            exit 1
          fi
          git -C "$npm_discovery_fixture" checkout -- sdk/package-lock.json
          rm -rf -- "$npm_discovery_fixture/untracked"
          git init -q "$npm_discovery_fixture/opaque-submodule"
          git -C "$npm_discovery_fixture/opaque-submodule" config user.name "Audit fixture"
          git -C "$npm_discovery_fixture/opaque-submodule" config user.email "audit-fixture@example.invalid"
          printf '{"name":"nested-submodule","lockfileVersion":3}\n' > "$npm_discovery_fixture/opaque-submodule/package-lock.json"
          git -C "$npm_discovery_fixture/opaque-submodule" add package-lock.json
          git -C "$npm_discovery_fixture/opaque-submodule" commit -qm "fixture: nested submodule lock"
          npm_fixture_submodule_sha="$(git -C "$npm_discovery_fixture/opaque-submodule" rev-parse HEAD)"
          git -C "$npm_discovery_fixture" update-index --add --cacheinfo "160000,$npm_fixture_submodule_sha,opaque-submodule"
          git -C "$npm_discovery_fixture" -c user.name="Audit fixture" -c user.email="audit-fixture@example.invalid" commit -qm "fixture: commit gitlink"
          tracked_named_paths "$npm_discovery_fixture" "" "package-lock.json" "npm-shrinkwrap.json" > "$npm_fixture_inventory"
          if [[ "$(wc -l < "$npm_fixture_inventory" | tr -d ' ')" != "1" ]] || ! grep -Fxq "sdk/package-lock.json" "$npm_fixture_inventory"; then
            echo "FAIL: npm root discovery crossed the committed gitlink boundary" >&2
            exit 1
          fi
          if stage_exact_committed_blob "$npm_discovery_fixture" "opaque-submodule/package-lock.json" "$RUNNER_TEMP/npm-input-fixture/submodule-lock.json"; then
            echo "FAIL: npm root stager accepted a path inside an unverified gitlink" >&2
            exit 1
          fi
          echo "PASS: nested npm lock discovery, gitlink boundaries and exact-blob staging fixtures"

          lock_inventory_raw="$RUNNER_TEMP/npm-lockfiles.raw"
          lock_inventory_file="$RUNNER_TEMP/npm-lockfiles.txt"
          : > "$lock_inventory_raw"
          lock_inventory_discovery_failed=0
          tracked_named_paths "$workspace" "" "package-lock.json" "npm-shrinkwrap.json" >> "$lock_inventory_raw" || lock_inventory_discovery_failed=1
          while IFS= read -r module_path; do
            [[ -n "$module_path" && -d "$workspace/$module_path" ]] || continue
            tracked_named_paths "$workspace/$module_path" "$module_path/" "package-lock.json" "npm-shrinkwrap.json" >> "$lock_inventory_raw" || lock_inventory_discovery_failed=1
          done < "$verified_npm_submodules"
          if ! LC_ALL=C sort -u "$lock_inventory_raw" > "$lock_inventory_file"; then
            lock_inventory_discovery_failed=1
            : > "$lock_inventory_file"
          fi
          mapfile -t lockfiles < "$lock_inventory_file"
          if [[ "$lock_inventory_discovery_failed" -ne 0 ]]; then
            npm_failed=1
          fi
          echo "lockfile_inventory_source=git-tree-at-HEAD" >> "$result_root/summary.txt"
          echo "lockfile_inventory_discovery_status=$([[ "$lock_inventory_discovery_failed" -eq 0 ]] && echo PASS || echo FAIL)" >> "$result_root/summary.txt"
          echo "node=$(node --version)" >> "$result_root/summary.txt"
          echo "npm=$(npm --version)" >> "$result_root/summary.txt"
          echo "lockfile_count=${#lockfiles[@]}" >> "$result_root/summary.txt"
          printf 'lockfile_inventory_path=%s\n' "${lockfiles[@]}" >> "$result_root/summary.txt"

          if [[ "${#lockfiles[@]}" -eq 0 ]]; then
            npm_failed=1
            sed -i 's/^npm_status=.*/npm_status=FAIL/' "$result_root/summary.txt"
            echo "incomplete_reason=no_tracked_npm_lockfiles" >> "$result_root/summary.txt"
            echo "FAIL: audit_node=true but no tracked package-lock.json or npm-shrinkwrap.json was found."
          else
            sed -i 's/^npm_status=.*/npm_status=RUNNING/' "$result_root/summary.txt"
            sed -i '/^incomplete_reason=setup_or_audit_not_completed$/d' "$result_root/summary.txt"
          fi

          # Run npm only against a metadata-only sandbox. This intentionally
          # excludes all project/user/global .npmrc files and all source code:
          # a PR cannot redirect audit payloads to a scope registry via project
          # configuration, and lifecycle scripts/source code are never needed.
          npm_sandbox="$RUNNER_TEMP/npm-audit-sandbox"
          npm_home="$RUNNER_TEMP/npm-audit-home"
          rm -rf -- "$npm_sandbox" "$npm_home"
          mkdir -p "$npm_sandbox" "$npm_home"
          manifest_inventory_raw="$RUNNER_TEMP/npm-manifests.raw"
          manifest_inventory_file="$RUNNER_TEMP/npm-manifests.txt"
          : > "$manifest_inventory_raw"
          manifest_inventory_discovery_failed=0
          tracked_named_paths "$workspace" "" "package.json" >> "$manifest_inventory_raw" || manifest_inventory_discovery_failed=1
          while IFS= read -r module_path; do
            [[ -n "$module_path" && -d "$workspace/$module_path" ]] || continue
            tracked_named_paths "$workspace/$module_path" "$module_path/" "package.json" >> "$manifest_inventory_raw" || manifest_inventory_discovery_failed=1
          done < "$verified_npm_submodules"
          if ! LC_ALL=C sort -u "$manifest_inventory_raw" > "$manifest_inventory_file"; then
            manifest_inventory_discovery_failed=1
            : > "$manifest_inventory_file"
          fi
          mapfile -t manifests < "$manifest_inventory_file"
          if [[ "$manifest_inventory_discovery_failed" -ne 0 ]]; then
            npm_failed=1
          fi
          echo "manifest_inventory_source=git-tree-at-HEAD" >> "$result_root/summary.txt"
          echo "manifest_inventory_discovery_status=$([[ "$manifest_inventory_discovery_failed" -eq 0 ]] && echo PASS || echo FAIL)" >> "$result_root/summary.txt"
          echo "tracked_package_manifest_count=${#manifests[@]}" >> "$result_root/summary.txt"
          for manifest_path in "${manifests[@]}"; do
            source_repo="$workspace"
            source_rel="$manifest_path"
            while IFS= read -r module_path; do
              [[ -n "$module_path" ]] || continue
              case "$manifest_path" in
                "$module_path"/*)
                  source_repo="$workspace/$module_path"
                  source_rel="${manifest_path#${module_path}/}"
                  break
                  ;;
              esac
            done < "$verified_npm_submodules"
            if ! stage_exact_committed_blob "$source_repo" "$source_rel" "$npm_sandbox/$manifest_path"; then
              npm_failed=1
              echo "npm_sandbox_manifest_status=FAIL path=$manifest_path reason=not_exact_committed_regular_blob" >> "$result_root/summary.txt"
              continue
            fi
          done
          for lockfile in "${lockfiles[@]}"; do
            source_repo="$workspace"
            source_rel="$lockfile"
            while IFS= read -r module_path; do
              [[ -n "$module_path" ]] || continue
              case "$lockfile" in
                "$module_path"/*)
                  source_repo="$workspace/$module_path"
                  source_rel="${lockfile#${module_path}/}"
                  break
                  ;;
              esac
            done < "$verified_npm_submodules"
            if ! stage_exact_committed_blob "$source_repo" "$source_rel" "$npm_sandbox/$lockfile"; then
              npm_failed=1
              echo "npm_sandbox_lockfile_status=FAIL path=$lockfile reason=not_exact_committed_regular_blob" >> "$result_root/summary.txt"
              continue
            fi
          done
          echo "npm_audit_environment=sandbox_without_project_npmrc" >> "$result_root/summary.txt"
          echo "npm_audit_registry=https://registry.npmjs.org/" >> "$result_root/summary.txt"

          cd "$RUNNER_TEMP"
          : > "$RUNNER_TEMP/npm-audit-userconfig"
          : > "$RUNNER_TEMP/npm-audit-globalconfig"
          for lockfile in "${lockfiles[@]}"; do
            lock_dir="$(dirname -- "$lockfile")"
            if [[ "$lock_dir" == "." ]]; then
              manifest="package.json"
              project_dir="$npm_sandbox"
            else
              manifest="$lock_dir/package.json"
              project_dir="$npm_sandbox/$lock_dir"
            fi
            report_id="$(printf '%s' "$lockfile" | sed 's#[^A-Za-z0-9._-]#_#g')"
            path_hash="$(printf '%s' "$lockfile" | sha256sum | cut -c1-12)"
            report="$result_root/lockfiles/${report_id}_$path_hash.json"
            stderr="$result_root/lockfiles/${report_id}_$path_hash.stderr"
            lock_abs="$workspace/$lockfile"
            lock_repo="$workspace"
            lock_rel="$lockfile"
            lock_prefix=""
            while IFS= read -r module_path; do
              [[ -n "$module_path" ]] || continue
              case "$lockfile" in
                "$module_path"/*)
                  lock_repo="$workspace/$module_path"
                  lock_rel="${lockfile#${module_path}/}"
                  lock_prefix="${module_path}/"
                  break
                  ;;
              esac
            done < "$verified_npm_submodules"
                        if [[ ! -f "$lock_abs" || -L "$lock_abs" ]]; then
              lock_reference="non-regular-or-missing"
              if [[ -L "$lock_abs" ]]; then lock_reference="$(readlink -- "$lock_abs")"; fi
              lock_reference_sha="$(printf '%s' "$lock_reference" | sha256sum | cut -d' ' -f1)"
              python3 - "$report" "$lockfile" "$manifest" "$lock_reference_sha" <<'PY'
          import json
          import sys
          from pathlib import Path
          report, lockfile, manifest, target_sha = sys.argv[1:]
          Path(report).write_text(json.dumps({
              "schema": "luminous.security-audit.npm-lockfile-result.v1",
              "status": "FAIL",
              "scanner_invoked": False,
              "reason": "lockfile_not_regular_file",
              "lockfile": lockfile,
              "manifest": manifest,
              "lock_reference_sha256": target_sha
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
              printf '%s\n' "npm audit was not invoked because the tracked lockfile is missing, not regular, or a symlink." > "$stderr"
              report_sha="$(sha256sum "$report" | cut -d' ' -f1)"
              stderr_sha="$(sha256sum "$stderr" | cut -d' ' -f1)"
              printf 'lockfile=%s manifest=%s exit_code=NOT_RUN report_parse_status=NOT_APPLICABLE outcome=FAIL report_sha256=%s stderr_sha256=%s reason=lockfile_not_regular_file\n' "$lockfile" "$manifest" "$report_sha" "$stderr_sha" >> "$result_root/summary.txt"
              npm_failed=1
              continue
            fi
            # npm prefers npm-shrinkwrap.json over package-lock.json in the
            # same package root. A report for the ignored package-lock must not
            # be misrepresented as an audit of the effective dependency graph.
            if [[ "$lockfile" == "package-lock.json" || "$lockfile" == */package-lock.json ]]; then
              shrinkwrap_rel="${lock_rel%package-lock.json}npm-shrinkwrap.json"
              shrinkwrap="${lock_prefix}${shrinkwrap_rel}"
              if git -C "$lock_repo" cat-file -e "HEAD:$shrinkwrap_rel" >/dev/null 2>&1 && [[ -f "$lock_repo/$shrinkwrap_rel" && ! -L "$lock_repo/$shrinkwrap_rel" ]]; then
                lock_sha="$(sha256sum "$lock_abs" | cut -d' ' -f1)"
                shrinkwrap_sha="$(sha256sum "$lock_repo/$shrinkwrap_rel" | cut -d' ' -f1)"
                python3 - "$report" "$lockfile" "$lock_sha" "$shrinkwrap" "$shrinkwrap_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          report, lockfile, lock_sha, authoritative, authoritative_sha = sys.argv[1:]
          Path(report).write_text(json.dumps({
              "schema": "luminous.security-audit.npm-lockfile-result.v1",
              "scanner_invoked": False,
              "status": "SKIPPED_NOT_AUTHORITATIVE",
              "reason": "npm-shrinkwrap.json takes precedence over package-lock.json",
              "lockfile": lockfile,
              "lockfile_sha256": lock_sha,
              "authoritative_lockfile": authoritative,
              "authoritative_lockfile_sha256": authoritative_sha
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
                printf '%s\n' "npm audit was not invoked because npm-shrinkwrap.json takes precedence." > "$stderr"
                report_sha="$(sha256sum "$report" | cut -d' ' -f1)"
                stderr_sha="$(sha256sum "$stderr" | cut -d' ' -f1)"
                printf 'lockfile=%s lockfile_sha256=%s exit_code=NOT_RUN outcome=SKIPPED_NOT_AUTHORITATIVE authoritative_lockfile=%s authoritative_lockfile_sha256=%s report_sha256=%s stderr_sha256=%s\n' \
                  "$lockfile" "$lock_sha" "$shrinkwrap" "$shrinkwrap_sha" "$report_sha" "$stderr_sha" \
                  >> "$result_root/summary.txt"
                continue
              fi
            fi

            manifest_repo="$workspace"
            manifest_rel="$manifest"
            while IFS= read -r module_path; do
              [[ -n "$module_path" ]] || continue
              case "$manifest" in
                "$module_path"/*)
                  manifest_repo="$workspace/$module_path"
                  manifest_rel="${manifest#${module_path}/}"
                  break
                  ;;
              esac
            done < "$verified_npm_submodules"
            if ! git -C "$manifest_repo" cat-file -e "HEAD:$manifest_rel" >/dev/null 2>&1 || [[ ! -f "$workspace/$manifest" || -L "$workspace/$manifest" ]]; then
              lock_sha="$(sha256sum "$lock_abs" | cut -d' ' -f1)"
              python3 - "$report" "$lockfile" "$lock_sha" "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          report, lockfile, lock_sha, manifest = sys.argv[1:]
          Path(report).write_text(json.dumps({
              "schema": "luminous.security-audit.npm-lockfile-result.v1",
              "status": "FAIL",
              "scanner_invoked": False,
              "reason": "tracked_sibling_package_json_missing",
              "lockfile": lockfile,
              "lockfile_sha256": lock_sha,
              "expected_manifest": manifest
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
              printf '%s\n' "npm audit was not invoked because the tracked sibling package.json is missing." > "$stderr"
              report_sha="$(sha256sum "$report" | cut -d' ' -f1)"
              stderr_sha="$(sha256sum "$stderr" | cut -d' ' -f1)"
              printf 'lockfile=%s lockfile_sha256=%s manifest=%s exit_code=NOT_RUN report_parse_status=NOT_APPLICABLE outcome=FAIL report_sha256=%s stderr_sha256=%s reason=package_manifest_missing\n' \
                "$lockfile" "$lock_sha" "$manifest" "$report_sha" "$stderr_sha" \
                >> "$result_root/summary.txt"
              npm_failed=1
              continue
            fi

            lock_sha="$(sha256sum "$lock_abs" | cut -d' ' -f1)"
            manifest_sha="$(sha256sum "$workspace/$manifest" | cut -d' ' -f1)"
            rc=0
            if env -i PATH="$PATH" HOME="$npm_home" npm --prefix "$project_dir" audit \
              --package-lock-only \
              --audit=true \
              --audit-level=high \
              --include=prod \
              --include=dev \
              --include=optional \
              --include=peer \
              --ignore-scripts=true \
              --offline=false \
              --registry=https://registry.npmjs.org/ \
              --cafile=/etc/ssl/certs/ca-certificates.crt \
              --proxy= \
              --https-proxy= \
              --strict-ssl=true \
              --cache="$RUNNER_TEMP/npm-audit-cache" \
              --userconfig="$RUNNER_TEMP/npm-audit-userconfig" \
              --globalconfig="$RUNNER_TEMP/npm-audit-globalconfig" \
              --json > "$report" 2> "$stderr"; then
              rc=0
            else
              rc=$?
              npm_failed=1
            fi
            if python3 - "$report" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path

          SEVERITIES = ("info", "low", "moderate", "high", "critical")

          def nonnegative_int(value):
              return type(value) is int and value >= 0

          def valid_report(payload):
              if not isinstance(payload, dict) or type(payload.get("auditReportVersion")) is not int or payload.get("auditReportVersion") != 2:
                  return False
              vulnerabilities = payload.get("vulnerabilities")
              metadata = payload.get("metadata")
              if not isinstance(vulnerabilities, dict) or not isinstance(metadata, dict):
                  return False
              metadata_vulns = metadata.get("vulnerabilities")
              dependencies = metadata.get("dependencies")
              if not isinstance(metadata_vulns, dict) or not isinstance(dependencies, dict):
                  return False
              if not all(nonnegative_int(metadata_vulns.get(key)) for key in (*SEVERITIES, "total")):
                  return False
              if sum(metadata_vulns[key] for key in SEVERITIES) != metadata_vulns["total"]:
                  return False
              if not nonnegative_int(dependencies.get("total")):
                  return False
              if not all(nonnegative_int(dependencies.get(key)) for key in ("prod", "dev", "optional", "peer", "peerOptional")):
                  return False
              observed = {severity: 0 for severity in SEVERITIES}
              for name, item in vulnerabilities.items():
                  if not isinstance(name, str) or not isinstance(item, dict):
                      return False
                  if item.get("severity") not in SEVERITIES or not isinstance(item.get("via"), list):
                      return False
                  observed[item["severity"]] += 1
              if len(vulnerabilities) != metadata_vulns["total"]:
                  return False
              return all(observed[severity] == metadata_vulns[severity] for severity in SEVERITIES)

          valid_fixture = {
              "auditReportVersion": 2,
              "vulnerabilities": {},
              "metadata": {
                  "vulnerabilities": {"info": 0, "low": 0, "moderate": 0, "high": 0, "critical": 0, "total": 0},
                  "dependencies": {"prod": 0, "dev": 0, "optional": 0, "peer": 0, "peerOptional": 0, "total": 0}
              }
          }
          assert valid_report(valid_fixture), "validator rejects a valid npm audit fixture"
          for mutate in (
              lambda x: x.pop("metadata"),
              lambda x: x["metadata"]["vulnerabilities"].update({"high": "0"}),
              lambda x: x["metadata"]["vulnerabilities"].update({"total": 1}),
              lambda x: x["vulnerabilities"].update({"bad-package": {"severity": "high", "via": []}}),
              lambda x: x["metadata"]["dependencies"].update({"total": False}),
          ):
              invalid = copy.deepcopy(valid_fixture)
              mutate(invalid)
              assert not valid_report(invalid), "validator accepted a malformed npm audit fixture"

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"invalid npm audit JSON: {type(exc).__name__}: {exc}", file=sys.stderr)
              raise SystemExit(1)
          if not valid_report(payload):
              print("npm audit report does not match the expected JSON schema/invariants", file=sys.stderr)
              raise SystemExit(1)
          print("npm audit JSON schema and consistency checks passed")
          PY
            then
              report_parse_status="PASS"
            else
              report_parse_status="FAIL"
              npm_failed=1
            fi
            npm_findings_total=-1; npm_info=-1; npm_low=-1; npm_moderate=-1; npm_high=-1; npm_critical=-1
            if [[ "$report_parse_status" == "PASS" ]]; then
              if report_stats="$(python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          severity = payload["metadata"]["vulnerabilities"]
          values = [severity[key] for key in ("total", "info", "low", "moderate", "high", "critical")]
          print(chr(9).join(str(value) for value in values))
          PY
              )"; then
                IFS=$'\t' read -r npm_findings_total npm_info npm_low npm_moderate npm_high npm_critical <<< "$report_stats"
              else
                report_parse_status="FAIL"
                npm_findings_total=-1; npm_info=-1; npm_low=-1; npm_moderate=-1; npm_high=-1; npm_critical=-1; npm_failed=1
              fi
            fi
            printf 'report_parse_status=%s lockfile=%s findings_total=%s info=%s low=%s moderate=%s high=%s critical=%s\n' "$report_parse_status" "$lockfile" "$npm_findings_total" "$npm_info" "$npm_low" "$npm_moderate" "$npm_high" "$npm_critical" >> "$result_root/summary.txt"
            if [[ "$rc" -eq 0 && "$report_parse_status" == "PASS" && "$npm_high" -eq 0 && "$npm_critical" -eq 0 ]]; then
              if [[ "$npm_findings_total" -eq 0 ]]; then outcome="PASS"; else outcome="PASS_BELOW_BLOCKING_THRESHOLD_WITH_FINDINGS"; fi
            else
              outcome="FAIL"
              npm_failed=1
            fi
            if [[ -f "$report" ]]; then report_sha="$(sha256sum "$report" | cut -d' ' -f1); else report_sha="missing"; npm_failed=1; fi
            if [[ -f "$stderr" ]]; then stderr_sha="$(sha256sum "$stderr" | cut -d' ' -f1); else stderr_sha="missing"; npm_failed=1; fi
            printf 'lockfile=%s lockfile_sha256=%s manifest=%s manifest_sha256=%s exit_code=%s outcome=%s report_sha256=%s stderr_sha256=%s\n' \
              "$lockfile" "$lock_sha" "$manifest" "$manifest_sha" "$rc" "$outcome" "$report_sha" "$stderr_sha" \
              >> "$result_root/summary.txt"
          done

          # Exactly one result row must exist for each committed lockfile.
          # Without this completeness invariant, an errexit/unbound-variable
          # failure mid-loop could leave a partial artifact that looks like a
          # completed scan of the discovered inventory.
          lockfile_result_count="$(grep -c '^lockfile=.* exit_code=' "$result_root/summary.txt" || true)"
          echo "lockfile_result_count=$lockfile_result_count" >> "$result_root/summary.txt"
          if [[ "$lockfile_result_count" -eq "${#lockfiles[@]}" ]]; then
            echo "lockfile_result_coverage_status=PASS" >> "$result_root/summary.txt"
          else
            echo "lockfile_result_coverage_status=FAIL" >> "$result_root/summary.txt"
            echo "lockfile_result_coverage_failure=expected_${#lockfiles[@]}_observed_$lockfile_result_count" >> "$result_root/summary.txt"
            npm_failed=1
          fi
          if [[ "$npm_failed" -eq 0 ]]; then overall="PASS"; else overall="FAIL"; fi
          sed -i "s/^npm_status=.*/npm_status=$overall/" "$result_root/summary.txt"
          echo "overall_status=$overall" | tee -a "$result_root/summary.txt"
          cat "$result_root/summary.txt"
          [[ "$overall" == "PASS" ]]
      - name: Ensure npm evidence receipt exists
        if: always()
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/npm/lockfiles
          summary="security-audit-results/npm/summary.txt"
          if [[ ! -f "$summary" ]]; then
            {
              echo "schema=luminous.security-audit.npm-receipt.v1"
              echo "repository=${GITHUB_REPOSITORY}"
              echo "subject_sha=$SUBJECT_SHA"
              echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
              echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
              echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
              echo "npm_status=INCOMPLETE"
              echo "incomplete_reason=checkout_or_receipt_initialization_failed"
            } > "$summary"
          fi
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-npm
          path: security-audit-results/npm/
          if-no-files-found: error
          retention-days: 14

  verdict:
    name: Deterministic audit verdict and evidence completeness
    if: always()
    needs:
      - workflow-security
      - rustsec
      - npmsec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download workflow-security evidence
        id: get-workflows
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-workflows
          path: audit-evidence/workflows

      - name: Download RustSec evidence when required
        id: get-rustsec
        if: inputs.audit_rust
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-rustsec
          path: audit-evidence/rustsec

      - name: Download npm evidence when required
        id: get-npm
        if: inputs.audit_node
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-npm
          path: audit-evidence/npm

      - name: Verify audit completeness and write deterministic verdict
        id: verdict
        if: always()
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          AUDIT_RUST: ${{ inputs.audit_rust }}
          AUDIT_NODE: ${{ inputs.audit_node }}
          WORKFLOW_JOB_RESULT: ${{ needs.workflow-security.result }}
          RUSTSEC_JOB_RESULT: ${{ needs.rustsec.result }}
          NPM_JOB_RESULT: ${{ needs.npmsec.result }}
        run: |
          set -o pipefail
          mkdir -p audit-evidence
          verdict_status=PASS
          workflow_status=INCOMPLETE
          rustsec_status=SKIPPED_NOT_REQUESTED
          npm_status=SKIPPED_NOT_REQUESTED
          failure_reasons=()
          finding_sources=()
          non_blocking_findings_present=false

          field() {
            local file="$1" key="$2"
            awk -F= -v wanted="$key" '$1 == wanted { n++; value=substr($0, index($0, "=") + 1) } END { if (n == 1) print value; else exit 2 }' "$file" 2>/dev/null
          }

          field_equals() {
            local file="$1" key="$2" expected="$3" actual
            if ! actual="$(field "$file" "$key")" || [[ "$actual" != "$expected" ]]; then
              failure_reasons+=("receipt_field_mismatch:${key}")
              return 1
            fi
            return 0
          }

          unique_summary() {
            local root="$1"
            local -a found=()
            mapfile -t found < <(find "$root" -type f -name summary.txt -print 2>/dev/null | LC_ALL=C sort)
            [[ "${#found[@]}" -eq 1 ]] || return 1
            printf '%s\n' "${found[0]}"
          }

          check_common_receipt() {
            local file="$1"
            field_equals "$file" subject_sha "$SUBJECT_SHA" || return 1
            field_equals "$file" declared_audit_engine_sha "$AUDIT_ENGINE_SHA" || return 1
            field_equals "$file" engine_identity_status PASS || return 1
            return 0
          }

          verify_workflow_report_digests() {
            local receipt="$1" root expected actual file key
            root="$(dirname "$receipt")"
            for spec in "zizmor.txt:zizmor_report_sha256" "actionlint.txt:actionlint_report_sha256" "gitleaks-sanitized.json:secret_report_sha256" "gitleaks-history-sanitized.json:secret_history_report_sha256"; do
              file="${spec%%:*}"
              key="${spec#*:}"
              if ! expected="$(field "$receipt" "$key")" || [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]] || [[ ! -f "$root/$file" ]]; then
                failure_reasons+=("workflow_report_missing_or_uncommitted:$file")
                return 1
              fi
              actual="$(sha256sum "$root/$file" | cut -d' ' -f1)"
              if [[ "$actual" != "$expected" ]]; then
                failure_reasons+=("workflow_report_digest_mismatch:$file")
                return 1
              fi
            done
            return 0
          }

          verify_dependency_report_digests() {
            local root="$1" receipt="$2" count_key="$3" manifest_key="$4" manifest_file="$5" lane="$6"
            local expected_count expected_manifest actual_manifest file digest
            local -a json_files=() stderr_files=() expected_json=() expected_stderr=() actual_json=() actual_stderr=()

            if ! expected_count="$(field "$receipt" "$count_key")" || [[ ! "$expected_count" =~ ^[0-9]+$ ]] || (( expected_count < 1 )); then
              failure_reasons+=("${lane}_lockfile_count_missing_or_invalid")
              return 1
            fi
            if [[ -n "$manifest_file" ]]; then
              if ! expected_manifest="$(field "$receipt" "$manifest_key")" || [[ ! "$expected_manifest" =~ ^[0-9a-f]{64}$ ]] || [[ ! -f "$root/$manifest_file" ]]; then
                failure_reasons+=("${lane}_coverage_manifest_missing_or_uncommitted")
                return 1
              fi
              actual_manifest="$(sha256sum "$root/$manifest_file" | cut -d' ' -f1)"
              if [[ "$actual_manifest" != "$expected_manifest" ]]; then
                failure_reasons+=("${lane}_coverage_manifest_digest_mismatch")
                return 1
              fi
            fi

            mapfile -t json_files < <(find "$root/lockfiles" -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | LC_ALL=C sort)
            mapfile -t stderr_files < <(find "$root/lockfiles" -maxdepth 1 -type f -name '*.stderr' -print 2>/dev/null | LC_ALL=C sort)
            if [[ "${#json_files[@]}" -ne "$expected_count" || "${#stderr_files[@]}" -ne "$expected_count" ]]; then
              failure_reasons+=("${lane}_report_file_count_mismatch")
              return 1
            fi

            mapfile -t expected_json < <(sed -n 's/.*report_sha256=\([0-9a-f]\{64\}\).*/\1/p' "$receipt" | LC_ALL=C sort)
            mapfile -t expected_stderr < <(sed -n 's/.*stderr_sha256=\([0-9a-f]\{64\}\).*/\1/p' "$receipt" | LC_ALL=C sort)
            if [[ "${#expected_json[@]}" -ne "$expected_count" || "${#expected_stderr[@]}" -ne "$expected_count" ]]; then
              failure_reasons+=("${lane}_reported_digest_count_mismatch")
              return 1
            fi
            for file in "${json_files[@]}"; do
              digest="$(sha256sum "$file" | cut -d' ' -f1)"
              actual_json+=("$digest")
            done
            for file in "${stderr_files[@]}"; do
              digest="$(sha256sum "$file" | cut -d' ' -f1)"
              actual_stderr+=("$digest")
            done
            mapfile -t actual_json < <(printf '%s\n' "${actual_json[@]}" | LC_ALL=C sort)
            mapfile -t actual_stderr < <(printf '%s\n' "${actual_stderr[@]}" | LC_ALL=C sort)
            if ! diff -u <(printf '%s\n' "${expected_json[@]}") <(printf '%s\n' "${actual_json[@]}") >/dev/null; then
              failure_reasons+=("${lane}_report_digest_mismatch")
              return 1
            fi
            if ! diff -u <(printf '%s\n' "${expected_stderr[@]}") <(printf '%s\n' "${actual_stderr[@]}") >/dev/null; then
              failure_reasons+=("${lane}_stderr_digest_mismatch")
              return 1
            fi
            return 0
          }

          verify_gitleaks_report() {
            local receipt="$1" root report expected actual config_sha raw_sha source_count source_inventory
            local history_report history_inventory history_expected history_actual inventory_expected inventory_actual
            local history_raw history_root_count history_sub_count history_finding_count history_tip history_sub_tip history_exit
            root="$(dirname "$receipt")"
            report="$root/gitleaks-sanitized.json"
            history_report="$root/gitleaks-history-sanitized.json"
            history_inventory="$root/gitleaks-history-inventory.json"

            if ! field_equals "$receipt" secret_scan_status PASS || ! field_equals "$receipt" secret_history_scan_status PASS; then return 1; fi
            if ! expected="$(field "$receipt" secret_report_sha256)" || [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]] || [[ ! -f "$report" ]]; then
              failure_reasons+=("gitleaks_sanitized_report_missing_or_uncommitted")
              return 1
            fi
            actual="$(sha256sum "$report" | cut -d' ' -f1)"
            if [[ "$actual" != "$expected" ]]; then
              failure_reasons+=("gitleaks_sanitized_report_digest_mismatch")
              return 1
            fi
            config_sha="$(field "$receipt" secret_config_sha256 2>/dev/null || true)"
            raw_sha="$(field "$receipt" secret_raw_report_sha256 2>/dev/null || true)"
            source_count="$(field "$receipt" secret_source_file_count 2>/dev/null || true)"
            source_inventory="$(field "$receipt" secret_source_inventory_sha256 2>/dev/null || true)"
            if [[ ! "$source_count" =~ ^[0-9]+$ || "$source_count" -le 0 || ! "$source_inventory" =~ ^[0-9a-f]{64}$ ]]; then
              failure_reasons+=("gitleaks_source_inventory_invalid")
              return 1
            fi
            if [[ ! "$config_sha" =~ ^[0-9a-f]{64}$ || ! "$raw_sha" =~ ^[0-9a-f]{64}$ ]] || [[ "$(field "$receipt" secret_scan_exit_code 2>/dev/null || true)" != "0" ]] || [[ "$(field "$receipt" secret_finding_count 2>/dev/null || true)" != "0" ]]; then
              failure_reasons+=("gitleaks_receipt_counts_or_digests_invalid")
              return 1
            fi
            if ! jq -e --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config_sha "$config_sha" --arg source_inventory "$source_inventory" --arg source_count "$source_count" '
              .schema == "luminous.security-audit.gitleaks-summary.v1" and
              .repository == $repository and .subject_sha == $subject and
              .scanner_version == "v8.30.1" and .config_sha256 == $config_sha and
              .source_file_count == ($source_count | tonumber) and .source_inventory_sha256 == $source_inventory and
              .status == "PASS" and .reason == "none" and .finding_count == 0 and
              (.findings | type == "array" and length == 0)
            ' "$report" >/dev/null; then
              failure_reasons+=("gitleaks_sanitized_report_policy_mismatch")
              return 1
            fi

            history_expected="$(field "$receipt" secret_history_report_sha256 2>/dev/null || true)"
            inventory_expected="$(field "$receipt" secret_history_inventory_sha256 2>/dev/null || true)"
            history_raw="$(field "$receipt" secret_history_raw_report_sha256 2>/dev/null || true)"
            history_root_count="$(field "$receipt" secret_history_root_commit_count 2>/dev/null || true)"
            history_sub_count="$(field "$receipt" secret_history_submodule_commit_count 2>/dev/null || true)"
            history_finding_count="$(field "$receipt" secret_history_finding_count 2>/dev/null || true)"
            history_exit="$(field "$receipt" secret_history_exit_code 2>/dev/null || true)"
            if [[ ! "$history_expected" =~ ^[0-9a-f]{64}$ || ! -f "$history_report" || ! "$inventory_expected" =~ ^[0-9a-f]{64}$ || ! -f "$history_inventory" ]]; then
              failure_reasons+=("gitleaks_history_report_or_inventory_missing")
              return 1
            fi
            history_actual="$(sha256sum "$history_report" | cut -d' ' -f1)"
            inventory_actual="$(sha256sum "$history_inventory" | cut -d' ' -f1)"
            if [[ "$history_actual" != "$history_expected" || "$inventory_actual" != "$inventory_expected" ]]; then
              failure_reasons+=("gitleaks_history_report_or_inventory_digest_mismatch")
              return 1
            fi
            if [[ ! "$history_raw" =~ ^[0-9a-f]{64}$ || ! "$history_root_count" =~ ^[0-9]+$ || "$history_root_count" -lt 1 || ! "$history_sub_count" =~ ^[0-9]+$ || ! "$history_finding_count" =~ ^[0-9]+$ || "$history_finding_count" -ne 0 ]]; then
              failure_reasons+=("gitleaks_history_receipt_counts_or_digests_invalid")
              return 1
            fi
            if [[ "$history_exit" != "root=0,submodule=0" && "$history_exit" != "root=0,submodule=NOT_REQUIRED" ]]; then
              failure_reasons+=("gitleaks_history_scanner_exit_codes_not_clean")
              return 1
            fi
            history_tip="$(jq -er '.history_tip | strings' "$history_report" 2>/dev/null || true)"
            history_sub_tip="$(jq -er '.submodule_tip | strings' "$history_report" 2>/dev/null || true)"
            if [[ "$history_tip" != "$SUBJECT_SHA" ]]; then
              failure_reasons+=("gitleaks_history_tip_mismatch")
              return 1
            fi
            if ! jq -e --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config_sha "$config_sha" --arg raw_sha "$history_raw" --arg inventory_sha "$inventory_expected" --arg history_tip "$history_tip" --arg submodule_tip "$history_sub_tip" --argjson root_count "$history_root_count" --argjson sub_count "$history_sub_count" --argjson finding_count "$history_finding_count" '
              .schema == "luminous.security-audit.gitleaks-history-summary.v1" and
              .repository == $repository and .subject_sha == $subject and .scanner_version == "v8.30.1" and
              .status == "PASS" and .reason == "none" and .history_tip == $history_tip and
              .history_commit_count == $root_count and .submodule_tip == $submodule_tip and
              .submodule_commit_count == $sub_count and .history_inventory_sha256 == $inventory_sha and
              .config_sha256 == $config_sha and .raw_report_sha256 == $raw_sha and
              .finding_count == $finding_count and $finding_count == 0 and
              (.findings | type == "array" and length == 0) and
              (if $sub_count == 0 then $submodule_tip == "not_required" else ($submodule_tip | test("^[0-9a-f]{40}$")) end)
            ' "$history_report" >/dev/null; then
              failure_reasons+=("gitleaks_history_report_policy_mismatch")
              return 1
            fi
            if ! jq -e --arg subject "$SUBJECT_SHA" --arg inventory_sha "$inventory_expected" --arg submodule_tip "$history_sub_tip" --argjson root_count "$history_root_count" --argjson sub_count "$history_sub_count" '
              .schema == "luminous.security-audit.gitleaks-history-inventory.v1" and
              .subject_sha == $subject and .status == "PASS" and
              .root.head == $subject and .root.commit_count == $root_count and .root.is_shallow == false and
              .submodule.head == $submodule_tip and .submodule.commit_count == $sub_count and .submodule.is_shallow == false and
              ($sub_count == 0 or .submodule.path == "mycelix-health")
            ' "$history_inventory" >/dev/null; then
              failure_reasons+=("gitleaks_history_inventory_policy_mismatch")
              return 1
            fi
            return 0
          }

          workflow_receipt=""
          if [[ "$WORKFLOW_JOB_RESULT" == "failure" ]]; then
            workflow_status=FAIL
            failure_reasons+=("workflow_security_job_failed")
          elif [[ "$WORKFLOW_JOB_RESULT" != "success" ]]; then
            workflow_status=INCOMPLETE
            failure_reasons+=("workflow_security_job_${WORKFLOW_JOB_RESULT}")
          elif workflow_receipt="$(unique_summary audit-evidence/workflows)"; then
            if check_common_receipt "$workflow_receipt" \
              && field_equals "$workflow_receipt" zizmor_status PASS \
              && field_equals "$workflow_receipt" actionlint_status PASS \
              && field_equals "$workflow_receipt" secret_scan_status PASS \
              && verify_workflow_report_digests "$workflow_receipt" \
              && verify_gitleaks_report "$workflow_receipt"; then
              workflow_status=PASS
            else
              workflow_status=FAIL
              failure_reasons+=("workflow_security_receipt_not_qualified")
            fi
          else
            workflow_status=INCOMPLETE
            failure_reasons+=("workflow_security_receipt_missing_or_ambiguous")
          fi

          if [[ "$AUDIT_RUST" == "true" ]]; then
            if [[ "$RUSTSEC_JOB_RESULT" == "failure" ]]; then
              rustsec_status=FAIL
              failure_reasons+=("rustsec_job_failed")
            elif [[ "$RUSTSEC_JOB_RESULT" != "success" ]]; then
              rustsec_status=INCOMPLETE
              failure_reasons+=("rustsec_job_${RUSTSEC_JOB_RESULT}")
            elif rustsec_receipt="$(unique_summary audit-evidence/rustsec)"; then
              if check_common_receipt "$rustsec_receipt" \
                && field_equals "$rustsec_receipt" rustsec_status PASS \
                && field_equals "$rustsec_receipt" manifest_coverage_status PASS \
                && field_equals "$rustsec_receipt" advisory_db_status PASS \
                && field_equals "$rustsec_receipt" overall_status PASS \
                && verify_dependency_report_digests "$(dirname "$rustsec_receipt")" "$rustsec_receipt" lockfile_count manifest_coverage_sha256 manifest-coverage.json rustsec; then
                rustsec_status=PASS
                if grep -Fq 'outcome=PASS_WITH_WARNINGS' "$rustsec_receipt"; then
                  finding_sources+=("rustsec_warnings")
                  non_blocking_findings_present=true
                fi
              else
                rustsec_status=FAIL
                failure_reasons+=("rustsec_receipt_not_qualified")
              fi
            else
              rustsec_status=INCOMPLETE
              failure_reasons+=("rustsec_receipt_missing_or_ambiguous")
            fi
          fi

          if [[ "$AUDIT_NODE" == "true" ]]; then
            if [[ "$NPM_JOB_RESULT" == "failure" ]]; then
              npm_status=FAIL
              failure_reasons+=("npm_job_failed")
            elif [[ "$NPM_JOB_RESULT" != "success" ]]; then
              npm_status=INCOMPLETE
              failure_reasons+=("npm_job_${NPM_JOB_RESULT}")
            elif npm_receipt="$(unique_summary audit-evidence/npm)"; then
              if check_common_receipt "$npm_receipt" \
                && field_equals "$npm_receipt" npm_status PASS \
                && field_equals "$npm_receipt" overall_status PASS \
                && verify_dependency_report_digests "$(dirname "$npm_receipt")" "$npm_receipt" lockfile_count '' '' npm; then
                npm_status=PASS
                if grep -Fq 'outcome=PASS_BELOW_BLOCKING_THRESHOLD_WITH_FINDINGS' "$npm_receipt"; then
                  finding_sources+=("npm_below_threshold")
                  non_blocking_findings_present=true
                fi
                if [[ "$(field "$npm_receipt" npm_submodule_audit_status 2>/dev/null || true)" != "PASS" && "$(field "$npm_receipt" npm_submodule_audit_status 2>/dev/null || true)" != "NOT_REQUIRED" ]]; then
                  npm_status=FAIL
                  failure_reasons+=("npm_submodule_coverage_not_qualified")
                fi
              else
                npm_status=FAIL
                failure_reasons+=("npm_receipt_not_qualified")
              fi
            else
              npm_status=INCOMPLETE
              failure_reasons+=("npm_receipt_missing_or_ambiguous")
            fi
          fi

          if [[ "$workflow_status" == "FAIL" || ( "$AUDIT_RUST" == "true" && "$rustsec_status" == "FAIL" ) || ( "$AUDIT_NODE" == "true" && "$npm_status" == "FAIL" ) ]]; then
            verdict_status=FAIL
          elif [[ "$workflow_status" == "INCOMPLETE" || ( "$AUDIT_RUST" == "true" && "$rustsec_status" == "INCOMPLETE" ) || ( "$AUDIT_NODE" == "true" && "$npm_status" == "INCOMPLETE" ) ]]; then
            verdict_status=INCOMPLETE
          elif [[ "$non_blocking_findings_present" == "true" ]]; then
            verdict_status=PASS_WITH_FINDINGS
          fi
          for reason in "${failure_reasons[@]}"; do echo "AUDIT_BLOCK: $reason" >&2; done

          failure_reasons_json='[]'
          if ((${#failure_reasons[@]} > 0)); then
            failure_reasons_json="$(printf '%s\n' "${failure_reasons[@]}" | jq -Rsc 'split("\n") | map(select(length>0))')"
          fi

          finding_sources_json='[]'
          if ((${#finding_sources[@]} > 0)); then
            finding_sources_json="$(printf '%s\n' "${finding_sources[@]}" | jq -Rsc 'split("\n") | map(select(length>0))')"
          fi

          files_json='[]'
          while IFS= read -r -d '' file; do
            rel="${file#audit-evidence/}"
            digest="$(sha256sum "$file" | cut -d' ' -f1)"
            files_json="$(jq -cn --argjson prior "$files_json" --arg path "$rel" --arg sha "$digest" '$prior + [{path:$path,sha256:$sha}]')"
          done < <(find audit-evidence -type f -print0 | LC_ALL=C sort -z)

          jq -n \
            --arg schema 'luminous.security-audit.verdict.v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg subject_sha "$SUBJECT_SHA" \
            --arg audit_engine_sha "$AUDIT_ENGINE_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "${GITHUB_WORKFLOW_SHA:-unknown}" \
            --arg workflow_run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg generated_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson aggregate_artifact_retention_days 30 \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_job_result "$WORKFLOW_JOB_RESULT" \
            --arg rustsec_job_result "$RUSTSEC_JOB_RESULT" \
            --arg npm_job_result "$NPM_JOB_RESULT" \
            --arg workflow_security_status "$workflow_status" \
            --arg rustsec_status "$rustsec_status" \
            --arg npm_status "$npm_status" \
            --arg status "$verdict_status" \
            --argjson audit_rust "$AUDIT_RUST" \
            --argjson audit_node "$AUDIT_NODE" \
            --argjson non_blocking_findings_present "$non_blocking_findings_present" \
            --argjson non_blocking_finding_sources "$finding_sources_json" \
            --argjson failure_reasons "$failure_reasons_json" \
            --argjson evidence_files "$files_json" \
            '{schema:$schema, repository:$repository, subject_sha:$subject_sha, audit_engine_sha:$audit_engine_sha, workflow_ref:$workflow_ref, workflow_sha:$workflow_sha, workflow_run_url:$workflow_run_url, generated_at_utc:$generated_at_utc, aggregate_artifact_retention_days:$aggregate_artifact_retention_days, run_id:$run_id, run_attempt:$run_attempt, workflow_job_result:$workflow_job_result, rustsec_job_result:$rustsec_job_result, npm_job_result:$npm_job_result, audit_rust:$audit_rust, audit_node:$audit_node, required_lanes:{workflow_security:$workflow_security_status, rustsec:(if $audit_rust then $rustsec_status else "SKIPPED_NOT_REQUESTED" end), npm:(if $audit_node then $npm_status else "SKIPPED_NOT_REQUESTED" end)}, non_blocking_findings_present:$non_blocking_findings_present, non_blocking_finding_sources:$non_blocking_finding_sources, status:$status, failure_reasons:$failure_reasons, evidence_files:$evidence_files}' > audit-evidence/verdict.json

          if ! jq -e '
            .schema == "luminous.security-audit.verdict.v1" and
            (.repository | type == "string" and test("^[^/]+/[^/]+$")) and
            (.subject_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.audit_engine_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.workflow_ref | type == "string" and length > 0) and
            (.workflow_sha == "unknown" or (.workflow_sha | test("^[0-9a-f]{40}$"))) and
            (.workflow_run_url | type == "string" and startswith("https://")) and
            (.generated_at_utc | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
            .aggregate_artifact_retention_days == 30 and
            (.audit_rust | type == "boolean") and (.audit_node | type == "boolean") and
            (.non_blocking_findings_present == ((.non_blocking_finding_sources | length) > 0)) and
            all(.non_blocking_finding_sources[]; . == "rustsec_warnings" or . == "npm_below_threshold") and
            (if .status == "PASS" then
              (.failure_reasons | length) == 0 and
              .non_blocking_findings_present == false and
              .required_lanes.workflow_security == "PASS" and
              .required_lanes.rustsec == (if .audit_rust then "PASS" else "SKIPPED_NOT_REQUESTED" end) and
              .required_lanes.npm == (if .audit_node then "PASS" else "SKIPPED_NOT_REQUESTED" end)
             elif .status == "PASS_WITH_FINDINGS" then
              (.failure_reasons | length) == 0 and
              .non_blocking_findings_present == true and
              .required_lanes.workflow_security == "PASS" and
              .required_lanes.rustsec == (if .audit_rust then "PASS" else "SKIPPED_NOT_REQUESTED" end) and
              .required_lanes.npm == (if .audit_node then "PASS" else "SKIPPED_NOT_REQUESTED" end) and
              ((.non_blocking_finding_sources | index("rustsec_warnings")) == null or (.audit_rust and .required_lanes.rustsec == "PASS")) and
              ((.non_blocking_finding_sources | index("npm_below_threshold")) == null or (.audit_node and .required_lanes.npm == "PASS"))
             elif .status == "FAIL" or .status == "INCOMPLETE" then
              (.failure_reasons | length) > 0
             else false end)
          ' audit-evidence/verdict.json >/dev/null; then
            echo "FAIL: generated aggregate verdict violated the v1 cross-field contract." >&2
            exit 1
          fi

          cat audit-evidence/verdict.json
          {
            echo '### Security audit verdict'
            echo
            echo "- Overall: **$verdict_status**"
            echo "- Subject: `$SUBJECT_SHA`"
            echo "- Audit engine: `$AUDIT_ENGINE_SHA`"
            echo "- Workflow analysis: **$workflow_status**"
            echo "- RustSec: **$rustsec_status** (requested: $AUDIT_RUST)"
            echo "- npm: **$npm_status** (requested: $AUDIT_NODE)"
            echo
            echo 'The aggregate verdict checks job outcomes and receipt identity/completeness. It is not an independent trust anchor; an external verifier must still validate the actual workflow reference and artifact provenance.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$verdict_status" == "FAIL" || "$verdict_status" == "INCOMPLETE" ]]; then exit 1; fi

      - name: Upload aggregate verdict and evidence manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-verdict
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 30
