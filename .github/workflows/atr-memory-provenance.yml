name: ATR persistent-memory provenance contract

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/TROJAN_HIPPO_ADAPTER_PROTOCOL_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/memory-provenance-conformance-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/memory-provenance-conformance-v0.1.json"
      - "tools/validate_memory_provenance.py"
      - ".github/workflows/atr-memory-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-provenance:
    name: Persistent-memory provenance / taint contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate memory provenance, taint inheritance and authority separation
        run: python tools/validate_memory_provenance.py
