name: Sealed assurance evaluation contract

on:
  pull_request:
    paths:
      - ".github/workflows/assurance-sealed-evaluation.yml"
      - "docs/assurance/sealed-evaluation/**"
      - "tools/assurance-sealed-evaluation/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/assurance-sealed-evaluation.yml"
      - "docs/assurance/sealed-evaluation/**"
      - "tools/assurance-sealed-evaluation/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path tools/assurance-sealed-evaluation/Cargo.toml -- --check
      - name: Commitment, reveal and access-boundary tests
        run: cargo test --manifest-path tools/assurance-sealed-evaluation/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path tools/assurance-sealed-evaluation/Cargo.toml --all-targets -- -D warnings
