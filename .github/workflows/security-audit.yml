                  )
                  workspace_name = prefixed(prefix, root_rel)
                  expected_lock_name = prefixed(prefix, lock)
                  workspace_record = workspace_records.setdefault(workspace_name, {
                      "workspace_root": workspace_name,
                      "expected_lockfile": expected_lock_name,
                      "lockfile_tracked": exists,
                      "status": "PASS" if exists else "FAIL",
                      "reason": lock_reason,
                      "member_manifest_count": 0,
