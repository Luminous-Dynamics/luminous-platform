name: export exact Rust formatting for endpoint model

on:
  pull_request:
    paths:
      - ".github/workflows/rustfmt-export.yml"
      - "tools/agentic-endpoint-security-v1/src/lib.rs"
      - "tools/agentic-endpoint-security-v1/src/trace.rs"
      - "tools/agentic-endpoint-security-v1/src/trajectory.rs"

permissions:
  contents: read

jobs:
  rustfmt-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install the benchmark Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: "1.96.0"
          components: "rustfmt"
          cache: false
      - name: Apply canonical formatting
        run: cargo fmt --manifest-path tools/agentic-endpoint-security-v1/Cargo.toml
      - name: Emit formatted source as bounded log chunks
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          paths = [
              "tools/agentic-endpoint-security-v1/src/lib.rs",
              "tools/agentic-endpoint-security-v1/src/trace.rs",
              "tools/agentic-endpoint-security-v1/src/trajectory.rs",
          ]
          for path in paths:
              encoded = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              print(f"RUSTFMT_SOURCE_BEGIN:{path}")
              for offset in range(0, len(encoded), 3000):
                  print(f"RUSTFMT_SOURCE_CHUNK:{encoded[offset:offset + 3000]}")
              print(f"RUSTFMT_SOURCE_END:{path}")
          PY
