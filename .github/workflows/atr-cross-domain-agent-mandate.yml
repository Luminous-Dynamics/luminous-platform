name: ATR cross-domain agent mandate assurance

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/CROSS_DOMAIN_AGENT_MANDATE_ASSURANCE_PROFILE_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/mandate-assurance-corpus-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/mandate-assurance-corpus-v0.1.json"
      - "tools/validate_mandate_assurance.py"
      - ".github/workflows/atr-cross-domain-agent-mandate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mandate-assurance:
    name: Draft 2020-12 mandate assurance corpus contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate mandate authority, chain attenuation, PoP and RP separation
        run: python tools/validate_mandate_assurance.py
