name: OMSI manufacturing semantic validator

on:
  pull_request:
    paths:
      - 'tools/omsi-manufacturing-validator/**'
      - 'docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json'
  push:
    branches: [main]
    paths:
      - 'tools/omsi-manufacturing-validator/**'
      - 'docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json'

permissions:
  contents: read

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Detect validator crate
        id: source
        shell: bash
        run: |
          if test -f tools/omsi-manufacturing-validator/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No validator crate in this documentation-only revision; formatting job is not applicable."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.present == 'true'
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        if: steps.source.outputs.present == 'true'
        run: cargo fmt --manifest-path tools/omsi-manufacturing-validator/Cargo.toml --all -- --check

  test:
    name: Rust semantic conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Detect validator crate
        id: source
        shell: bash
        run: |
          if test -f tools/omsi-manufacturing-validator/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No validator crate in this documentation-only revision; semantic tests are not applicable."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.present == 'true'
        with:
          toolchain: stable
          components: clippy
      - name: Run executable conformance tests
        if: steps.source.outputs.present == 'true'
        run: cargo test --manifest-path tools/omsi-manufacturing-validator/Cargo.toml
      - name: Run semantic validator against the committed profile vectors
        if: steps.source.outputs.present == 'true'
        run: cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- validate-vectors docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json
      - name: Smoke-test raw-byte replay envelope
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          input_file="$RUNNER_TEMP/omsi-replay-input.json"
          envelope_file="$RUNNER_TEMP/omsi-replay-envelope.json"
          jq '.vectors[0].input' docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json > "$input_file"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- create-envelope "$input_file" > "$envelope_file"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- verify-envelope "$envelope_file" "$input_file"
      - name: Smoke-test non-gating benchmark report
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          report_file="$RUNNER_TEMP/omsi-benchmark-report.json"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- benchmark-vectors docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json 10 > "$report_file"
          jq -e '
            .benchmark_contract == "omsi-manufacturing-benchmark-report/0.1" and
            .status == "measured_no_acceptance_claim" and
            .authority == "performance_observation_only" and
            .run.sample_count_per_phase == (.corpus.case_count * .run.iterations_per_case) and
            .run.max_cases == 10000 and
            .run.max_samples_per_phase == 1000000 and
            .run.sample_count_per_phase <= .run.max_samples_per_phase and
            .run.throughput_measurement_mode == "separate_batch_pass_without_per_operation_timers" and
            (.phases | has("json_parse") and has("semantic_evaluation") and has("envelope_creation") and has("envelope_verification")) and
            .phases.json_parse.wall_clock_elapsed_ns > 0 and
            .phases.json_parse.wall_clock_operations_per_second > 0 and
            .phases.semantic_evaluation.wall_clock_elapsed_ns > 0 and
            .phases.semantic_evaluation.wall_clock_operations_per_second > 0 and
            .phases.envelope_creation.wall_clock_elapsed_ns > 0 and
            .phases.envelope_creation.wall_clock_operations_per_second > 0 and
            .phases.envelope_verification.wall_clock_elapsed_ns > 0 and
            .phases.envelope_verification.wall_clock_operations_per_second > 0
          ' "$report_file" > /dev/null
      - name: Clippy
        if: steps.source.outputs.present == 'true'
        run: cargo clippy --manifest-path tools/omsi-manufacturing-validator/Cargo.toml --all-targets -- -D warnings
