name: Ambient Scene Pack Contract

on:
  pull_request:
    paths:
      - "contracts/ambient-scene-pack-v1.schema.json"
      - "contracts/renderer-capability-profile-v1.schema.json"
      - "contracts/examples/**"
      - "contracts/tests/**"
      - "tools/ambient_validation/**"
      - ".github/workflows/ambient-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/ambient-scene-pack-v1.schema.json"
      - "contracts/renderer-capability-profile-v1.schema.json"
      - "contracts/examples/**"
      - "contracts/tests/**"
      - "tools/ambient_validation/**"
      - ".github/workflows/ambient-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambient-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-scene-pack:
    name: Validate Scene Pack v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out revision identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/ambient_validation/requirements.txt
      - name: Validate schema and example
        id: validate_manifest
        continue-on-error: true
        run: python tools/ambient_validation/validate_scene_pack.py contracts/examples/first-germination.scene.json
      - name: Run contract and renderer compatibility tests
        id: contract_tests
        continue-on-error: true
        run: python -m unittest discover -s tools/ambient_validation -p 'test_*.py' -v
      - name: Create machine-readable qualification receipt
        id: make_receipt
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCHEMA_OUTCOME: ${{ steps.validate_manifest.outcome }}
          TESTS_OUTCOME: ${{ steps.contract_tests.outcome }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          python tools/ambient_validation/qualification_receipt.py create \
            --expected-commit "$EXPECTED_SHA" \
            --schema-outcome "$SCHEMA_OUTCOME" \
            --tests-outcome "$TESTS_OUTCOME" \
            --output artifacts/ambient-qualification-receipt.json
      - name: Upload qualification receipt
        id: upload_receipt
        if: always() && steps.make_receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ambient-qualification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ambient-qualification-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce validation gates
        if: always()
        env:
          SCHEMA_OUTCOME: ${{ steps.validate_manifest.outcome }}
          TESTS_OUTCOME: ${{ steps.contract_tests.outcome }}
          RECEIPT_OUTCOME: ${{ steps.make_receipt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_receipt.outcome }}
        run: |
          test "$SCHEMA_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$RECEIPT_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
