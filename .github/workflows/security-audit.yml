name: Reusable Security Audit

on:
  workflow_call:
    inputs:
      subject_sha:
        description: Exact commit SHA of the caller repository to audit.
        required: true
        type: string
      audit_engine_sha:
        description: Declared exact revision of the reusable audit workflow; an external verifier must cross-check it against the caller's uses reference.
        required: true
        type: string
      audit_rust:
        description: Audit every tracked Cargo.lock in the caller repository.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  workflow-security:
    name: GitHub Actions workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact audit subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false

      - name: Assert exact checkout identity
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Initialize workflow audit evidence
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/workflows
          {
            echo "schema=luminous.security-audit.workflow-receipt.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "zizmor_status=INCOMPLETE"
          } > security-audit-results/workflows/summary.txt
          if [[ ! "$AUDIT_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sed -i 's/^zizmor_status=.*/zizmor_status=FAIL/' security-audit-results/workflows/summary.txt
            echo "incomplete_reason=invalid_audit_engine_sha" >> security-audit-results/workflows/summary.txt
            exit 2
          fi

      - name: Audit workflow definitions
        id: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/
          advanced-security: false
          annotations: true
          online-audits: true
          persona: auditor
          version: v1.30.1

      - name: Preserve workflow audit output
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zizmor"
          destination="security-audit-results/workflows/zizmor.txt"
          if [[ -f "$report" ]]; then
            cp "$report" "$destination"
            report_sha256="$(sha256sum "$destination" | cut -d' ' -f1)"
            if [[ "${ZIZMOR_OUTCOME:-unknown}" == "success" ]]; then
              sed -i 's/^zizmor_status=.*/zizmor_status=PASS/' security-audit-results/workflows/summary.txt
            else
              sed -i 's/^zizmor_status=.*/zizmor_status=FAIL/' security-audit-results/workflows/summary.txt
            fi
            echo "zizmor_action_outcome=${ZIZMOR_OUTCOME:-unknown}" >> security-audit-results/workflows/summary.txt
            echo "zizmor_report_sha256=$report_sha256" >> security-audit-results/workflows/summary.txt
          else
            sed -i 's/^zizmor_status=.*/zizmor_status=INCOMPLETE/' security-audit-results/workflows/summary.txt
            echo "zizmor_action_outcome=${ZIZMOR_OUTCOME:-unknown}" >> security-audit-results/workflows/summary.txt
            echo "report_missing=true" >> security-audit-results/workflows/summary.txt
          fi

      - name: Upload workflow audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-workflows
          path: security-audit-results/workflows/
          if-no-files-found: error
          retention-days: 14

  rustsec:
    name: RustSec dependency audit
    if: inputs.audit_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact audit subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false

      - name: Assert exact checkout identity
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Initialize RustSec evidence
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/lockfiles
          {
            echo "schema=luminous.security-audit.receipt.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "observed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rustsec_status=INCOMPLETE"
            echo "incomplete_reason=setup_or_audit_not_completed"
          } > security-audit-results/summary.txt
          if [[ ! "$AUDIT_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sed -i 's/^rustsec_status=.*/rustsec_status=FAIL/' security-audit-results/summary.txt
            echo "incomplete_reason=invalid_audit_engine_sha" >> security-audit-results/summary.txt
            exit 2
          fi

      - name: Initialize allow-listed direct submodules
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ ! -f .gitmodules ]]; then
            echo "submodule_audit_status=NOT_REQUIRED" | tee -a security-audit-results/summary.txt
            exit 0
          fi

          # Only initialize direct submodules hosted in the caller's GitHub owner.
          # This prevents a PR from redirecting the runner to arbitrary Git hosts.
          while IFS= read -r line; do
            url="${line#* }"
            if [[ ! "$url" =~ ^https://github[.]com/${REPOSITORY_OWNER}/[A-Za-z0-9._-]+([.]git)?$ ]]; then
              echo "submodule_audit_status=FAIL" | tee -a security-audit-results/summary.txt
              echo "incomplete_reason=submodule_url_not_allowlisted" | tee -a security-audit-results/summary.txt
              exit 0
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]url$')

          while IFS= read -r line; do
            path="${line#* }"
            if [[ ! "$path" =~ ^[A-Za-z0-9_./-]+$ || "$path" == /* || "$path" == *".."* || "$path" == "." || "$path" == ./* || "$path" == */./* || "$path" == */. ]]; then
              echo "submodule_audit_status=FAIL" | tee -a security-audit-results/summary.txt
              echo "incomplete_reason=submodule_path_invalid" | tee -a security-audit-results/summary.txt
              exit 0
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$')

          if ! git submodule update --init; then
            echo "submodule_audit_status=INCOMPLETE" | tee -a security-audit-results/summary.txt
            echo "incomplete_reason=submodule_checkout_failed" | tee -a security-audit-results/summary.txt
            exit 0
          fi

          while IFS= read -r line; do
            path="${line#* }"
            expected="$(git ls-files --stage -- "$path" | awk '$1 == "160000" {print $2}')"
            if [[ -z "$expected" || ! -d "$path" ]]; then
              echo "submodule_audit_status=FAIL" | tee -a security-audit-results/summary.txt
              echo "incomplete_reason=submodule_gitlink_missing" | tee -a security-audit-results/summary.txt
              exit 0
            fi
            actual="$(git -C "$path" rev-parse HEAD)"
            if [[ "$actual" != "$expected" ]]; then
              echo "submodule_audit_status=FAIL" | tee -a security-audit-results/summary.txt
              echo "incomplete_reason=submodule_head_mismatch" | tee -a security-audit-results/summary.txt
              exit 0
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$')

          echo "submodule_audit_status=PASS" | tee -a security-audit-results/summary.txt

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # immutable action commit
        with:
          toolchain: 1.96.0
      - name: Install pinned cargo-audit
        working-directory: ${{ runner.temp }}
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit every tracked Cargo.lock and emit evidence
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          result_root="$workspace/security-audit-results"
          subject_sha="$(git rev-parse HEAD)"
          mapfile -t lockfiles < <(
            {
              git ls-files -- 'Cargo.lock' '**/Cargo.lock'
              if [[ -f .gitmodules ]]; then
                while IFS= read -r line; do
                  module_path="${line#* }"
                  if [[ -d "$workspace/$module_path" ]]; then
                    git -C "$workspace/$module_path" ls-files -- 'Cargo.lock' '**/Cargo.lock' | sed "s#^#${module_path}/#"
                  fi
                done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path

          lockfile_missing=0
          if [[ "${#lockfiles[@]}" -eq 0 ]]; then
            lockfile_missing=1
            sed -i 's/^rustsec_status=.*/rustsec_status=FAIL/' "$result_root/summary.txt"
            echo "incomplete_reason=no_tracked_Cargo.lock_files" >> "$result_root/summary.txt"
            echo "FAIL: no tracked Cargo.lock files; Rust dependency audit coverage is absent."
          else
            sed -i 's/^rustsec_status=.*/rustsec_status=RUNNING/' "$result_root/summary.txt"
            sed -i '/^incomplete_reason=setup_or_audit_not_completed$/d' "$result_root/summary.txt"
          fi
          {
            echo "rustc=$(rustc +1.96.0 --version)"
            echo "cargo=$(cargo +1.96.0 --version)"
            echo "cargo_audit=$(cargo audit --version)"
            echo "lockfile_count=${#lockfiles[@]}"
          } >> "$result_root/summary.txt"

          coverage_failed=0
          rustsec_failed="$lockfile_missing"

          # Freeze one RustSec advisory database snapshot for the entire run.
          # Every lockfile is evaluated against the same recorded database
          # revision, avoiding different findings as the upstream DB advances.
          advisory_db="$RUNNER_TEMP/rustsec-advisory-db"
          if ! git clone --depth 1 https://github.com/RustSec/advisory-db "$advisory_db"; then
            echo "advisory_db_status=FAIL" | tee -a "$result_root/summary.txt"
            echo "incomplete_reason=advisory_database_clone_failed" | tee -a "$result_root/summary.txt"
            exit 2
          fi
          advisory_db_commit="$(git -C "$advisory_db" rev-parse HEAD)"
          if [[ ! "$advisory_db_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "advisory_db_status=FAIL" | tee -a "$result_root/summary.txt"
            echo "incomplete_reason=advisory_database_revision_invalid" | tee -a "$result_root/summary.txt"
            exit 2
          fi
          {
            echo "advisory_db_status=PASS"
            echo "advisory_db_commit=$advisory_db_commit"
            echo "advisory_db_url=https://github.com/RustSec/advisory-db"
          } | tee -a "$result_root/summary.txt"

          # Prove tracked Cargo manifests map to tracked workspace lockfiles.
          # This is intentionally separate from cargo-audit: scanner coverage
          # must be evidenced, not inferred from finding some lockfiles.
          if python3 - "$workspace" "$result_root/manifest-coverage.json" <<'PY'
          import json
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          repo = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])

          def git_output(root, *args):
              return subprocess.check_output(["git", *args], cwd=root)

          def tracked(root, patterns):
              raw = git_output(root, "ls-files", "-z", "--", *patterns)
              return sorted(set(item.decode() for item in raw.split(bytes([0])) if item))

          def gitlinks(root):
              raw = git_output(root, "ls-files", "--stage", "-z")
              found = []
              for record in raw.split(bytes([0])):
                  if not record:
                      continue
                  metadata, path_bytes = record.split(bytes([9]), 1)
                  fields = metadata.split()
                  if fields and fields[0] == b"160000":
                      found.append((path_bytes.decode(), fields[1].decode()))
              return found

          def declared_submodule_paths(root):
              if not (root / ".gitmodules").is_file():
                  return []
              try:
                  raw = git_output(root, "config", "-f", ".gitmodules", "--get-regexp", "^submodule[.].*[.]path$")
              except subprocess.CalledProcessError:
                  return []
              paths = []
              for line in raw.decode().splitlines():
                  fields = line.split(None, 1)
                  if len(fields) == 2:
                      paths.append(fields[1])
              return sorted(set(paths))

          def prefixed(prefix, relative):
              return f"{prefix}/{relative}" if prefix else relative

          # Root plus direct, allow-listed, initialized submodules. Nested
          # submodules are reported as unaudited instead of being fetched.
          root_links = dict(gitlinks(repo))
          declared_paths = declared_submodule_paths(repo)
          roots = [("", repo)]
          unaudited_submodules = []
          summary_path = output.parent / "summary.txt"
          summary_text = summary_path.read_text() if summary_path.exists() else ""
          submodule_status = next(
              (line.split("=", 1)[1] for line in summary_text.splitlines()
               if line.startswith("submodule_audit_status=")),
              "INCOMPLETE"
          )
          if submodule_status not in ("PASS", "NOT_REQUIRED"):
              unaudited_submodules.append(f"submodule_initialization:{submodule_status}")
          for path in declared_paths:
              expected = root_links.get(path)
              if not expected:
                  unaudited_submodules.append(f"{path}:declared_path_without_gitlink")
                  continue
              relative_path = Path(path)
              if relative_path.is_absolute() or ".." in relative_path.parts or "." in relative_path.parts:
                  unaudited_submodules.append(f"{path}:invalid_declared_path")
                  continue
              module_root = (repo / relative_path).resolve()
              if repo not in module_root.parents:
                  unaudited_submodules.append(f"{path}:path_outside_checkout")
                  continue
              if not module_root.is_dir():
                  unaudited_submodules.append(f"{path}:not_initialized")
                  continue
              try:
                  actual_root = Path(git_output(module_root, "rev-parse", "--show-toplevel").decode().strip()).resolve()
                  actual_sha = git_output(module_root, "rev-parse", "HEAD").decode().strip()
              except subprocess.CalledProcessError:
                  unaudited_submodules.append(f"{path}:not_a_git_checkout")
                  continue
              if actual_root != module_root or actual_sha != expected:
                  unaudited_submodules.append(f"{path}:checkout_does_not_match_gitlink")
                  continue
              roots.append((path, module_root))
          for path, _sha in root_links.items():
              if path not in declared_paths:
                  unaudited_submodules.append(f"{path}:gitlink_without_gitmodules_entry")

          entries = []
          all_lockfiles = set()
          for prefix, checkout in roots:
              local_manifests = tracked(checkout, ["Cargo.toml", "**/Cargo.toml"])
              local_lockfiles = set(tracked(checkout, ["Cargo.lock", "**/Cargo.lock"]))
              all_lockfiles.update(prefixed(prefix, path) for path in local_lockfiles)
              parsed = {}
              parse_errors = {}
              for rel in local_manifests:
                  try:
                      with (checkout / rel).open("rb") as fh:
                          parsed[rel] = tomllib.load(fh)
                  except Exception as exc:
                      parse_errors[rel] = f"{type(exc).__name__}: {exc}"

              def workspace_root_for(rel):
                  manifest = checkout / rel
                  data = parsed.get(rel, {})
                  if "workspace" in data:
                      return manifest.parent
                  explicit = data.get("package", {}).get("workspace")
                  if explicit:
                      return (manifest.parent / explicit).resolve()
                  parent = manifest.parent.parent
                  while parent == checkout or checkout in parent.parents:
                      parent_manifest = parent / "Cargo.toml"
                      parent_rel = parent_manifest.relative_to(checkout).as_posix()
                      if parent_rel in parsed and "workspace" in parsed[parent_rel]:
                          return parent
                      if parent == checkout:
                          break
                      parent = parent.parent
                  return manifest.parent

              for rel in local_manifests:
                  display_manifest = prefixed(prefix, rel)
                  if rel in parse_errors:
                      entries.append({
                          "manifest": display_manifest, "status": "INCOMPLETE",
                          "reason": "manifest_parse_error", "detail": parse_errors[rel]
                      })
                      continue
                  root = workspace_root_for(rel)
                  try:
                      root_rel = root.relative_to(checkout).as_posix()
                  except ValueError:
                      entries.append({
                          "manifest": display_manifest, "status": "FAIL",
                          "reason": "workspace_outside_checkout"
                      })
                      continue
                  local_lock = (Path(root_rel) / "Cargo.lock").as_posix() if root_rel != "." else "Cargo.lock"
                  lock_tracked = local_lock in local_lockfiles
                  lock_exists = (checkout / local_lock).is_file()
                  display_lock = prefixed(prefix, local_lock)
                  entries.append({
                      "manifest": display_manifest,
                      "workspace_root": prefixed(prefix, root_rel),
                      "expected_lockfile": display_lock,
                      "lockfile_tracked": lock_tracked,
                      "lockfile_exists": lock_exists,
                      "status": "PASS" if lock_tracked and lock_exists else "FAIL",
                      "reason": None if lock_tracked and lock_exists else "workspace_lockfile_missing_or_untracked"
                  })

              if prefix:
                  for nested_path, _nested_sha in gitlinks(checkout):
                      unaudited_submodules.append(f"{prefix}/{nested_path}:nested_submodule_not_initialized")

          failures = [entry for entry in entries if entry["status"] != "PASS"]
          report = {
              "schema": "luminous.security-audit.manifest-coverage.v1",
              "repository_path": ".",
              "manifest_count": len(entries),
              "tracked_lockfile_count": len(all_lockfiles),
              "mapped_manifest_count": sum(entry["status"] == "PASS" for entry in entries),
              "entry_failure_count": len(failures),
              "initialized_direct_submodule_count": max(0, len(roots) - 1),
              "unaudited_submodules": sorted(set(unaudited_submodules)),
              "failure_count": len(failures) + len(set(unaudited_submodules)),
              "status": "PASS" if entries and not failures and not unaudited_submodules else "FAIL",
              "limitations": [
                  "Tracked Cargo manifests and lockfiles are inventoried in the root repository and verified direct submodules.",
                  "Cargo package resolution is not fully reconstructed; nested submodules are not fetched and force a coverage failure.",
                  "Non-Rust dependency systems are outside this RustSec coverage report."
              ],
              "lockfiles_to_audit": sorted(all_lockfiles),
              "entries": entries
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + chr(10))
          print(f"Manifest coverage: {report['status']} "
                f"({report['mapped_manifest_count']}/{report['manifest_count']} manifests; "
                f"{report['tracked_lockfile_count']} tracked lockfiles; "
                f"{report['initialized_direct_submodule_count']} direct submodules)")
          for entry in failures:
              print(f"UNCOVERED: {entry}")
          for submodule in report["unaudited_submodules"]:
              print(f"SUBMODULE_UNAUDITED: {submodule}")
          if report["status"] != "PASS":
              sys.exit(1)          PY
          then
            coverage_status="PASS"
          else
            coverage_status="FAIL"
            coverage_failed=1
          fi
          echo "manifest_coverage_status=$coverage_status" | tee -a "$result_root/summary.txt"
          if [[ -f "$result_root/manifest-coverage.json" ]]; then
            coverage_sha256="$(sha256sum "$result_root/manifest-coverage.json" | cut -d' ' -f1)"
          else
            coverage_sha256="missing"
            coverage_failed=1
          fi
          echo "manifest_coverage_sha256=$coverage_sha256" | tee -a "$result_root/summary.txt"

          # RustSec explicitly recommends reading untrusted lockfiles from
          # outside the checked-out project directory so project-local Cargo
          # configuration cannot influence the audit invocation.
          cd "$RUNNER_TEMP"
          for lockfile in "${lockfiles[@]}"; do
            report_id="$(printf '%s' "$lockfile" | sed 's#[^A-Za-z0-9._-]#_#g')"
            path_hash="$(printf '%s' "$lockfile" | sha256sum | cut -c1-12)"
            report="$result_root/lockfiles/${report_id}_${path_hash}.json"
            stderr="$result_root/lockfiles/${report_id}_${path_hash}.stderr"
            lockfile_abs="$workspace/$lockfile"
            lock_sha256="$(sha256sum "$lockfile_abs" | cut -d' ' -f1)"
            echo "Auditing $lockfile (sha256=$lock_sha256)"

            rc=0
            if cargo audit --db "$advisory_db" --no-fetch --file "$lockfile_abs" --json > "$report" 2> "$stderr"; then
              rc=0
            else
              rc=$?
              rustsec_failed=1
            fi

            if [[ "$rc" -eq 0 ]]; then outcome="PASS"; else outcome="FAIL"; fi
            printf 'lockfile=%s sha256=%s exit_code=%s outcome=%s\n' \
              "$lockfile" "$lock_sha256" "$rc" "$outcome" \
              | tee -a "$result_root/summary.txt"
          done

          if [[ "$rustsec_failed" -eq 0 ]]; then rustsec_status="PASS"; else rustsec_status="FAIL"; fi
          sed -i "s/^rustsec_status=.*/rustsec_status=$rustsec_status/" "$result_root/summary.txt"
          if [[ "$rustsec_failed" -eq 0 && "$coverage_failed" -eq 0 ]]; then overall="PASS"; else overall="FAIL"; fi
          echo "overall_status=$overall" | tee -a "$result_root/summary.txt"
          cat "$result_root/summary.txt"
          if [[ "$overall" == "PASS" ]]; then exit 0; else exit 1; fi

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-rustsec
          path: security-audit-results/
          if-no-files-found: error
          retention-days: 14
)

          while IFS= read -r line; do
            path="${line#* }"
            if [[ ! "$path" =~ ^[A-Za-z0-9_./-]+$ || "$path" == /* || "$path" == *".."* ]]; then
              echo "submodule_audit_status=FAIL" | tee -a security-audit-results/summary.txt
              echo "incomplete_reason=submodule_path_invalid" | tee -a security-audit-results/summary.txt
              exit 2
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule\\..*\\.path
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # immutable action commit
        with:
          toolchain: 1.96.0

      - name: Install pinned cargo-audit
        working-directory: ${{ runner.temp }}
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit every tracked Cargo.lock and emit evidence
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          result_root="$workspace/security-audit-results"
          subject_sha="$(git rev-parse HEAD)"
          mapfile -t lockfiles < <(git ls-files -- 'Cargo.lock' '**/Cargo.lock' | LC_ALL=C sort -u)

          lockfile_missing=0
          if [[ "${#lockfiles[@]}" -eq 0 ]]; then
            lockfile_missing=1
            sed -i 's/^rustsec_status=.*/rustsec_status=FAIL/' "$result_root/summary.txt"
            echo "incomplete_reason=no_tracked_Cargo.lock_files" >> "$result_root/summary.txt"
            echo "FAIL: no tracked Cargo.lock files; Rust dependency audit coverage is absent."
          else
            sed -i 's/^rustsec_status=.*/rustsec_status=RUNNING/' "$result_root/summary.txt"
            sed -i '/^incomplete_reason=/d' "$result_root/summary.txt"
