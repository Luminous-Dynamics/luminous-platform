name: service episode saga v1 reference model

on:
  pull_request:
    paths:
      - "docs/SERVICE_EPISODE_SAGA_CONTRACT_V1.md"
      - "tools/service-episode-saga-v1/**"
      - ".github/workflows/service-episode-saga-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/SERVICE_EPISODE_SAGA_CONTRACT_V1.md"
      - "tools/service-episode-saga-v1/**"
      - ".github/workflows/service-episode-saga-v1.yml"

permissions:
  contents: read

concurrency:
  group: service-episode-saga-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-model:
    name: Exact-plan saga transition model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Rust toolchain and components
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: "1.96.0"
          components: "rustfmt, clippy"
          cache: false
      - name: Check formatting
        run: cargo fmt --manifest-path tools/service-episode-saga-v1/Cargo.toml -- --check
      - name: Run dependency-locked model tests
        run: cargo test --locked --manifest-path tools/service-episode-saga-v1/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/service-episode-saga-v1/Cargo.toml -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"
