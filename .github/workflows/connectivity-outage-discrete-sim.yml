name: connectivity-outage-discrete-sim

on:
  pull_request:
    paths:
      - "tools/connectivity-outage-discrete-sim/**"
      - "tools/connectivity-task-outcome-core/**"
      - "schemas/connectivity-outage-scenario-v1.schema.json"
      - "schemas/connectivity-task-outcome-*.schema.json"
      - "profiles/connectivity-task-outcome-benchmark-profile-v1.json"
      - "examples/connectivity-outage-scenario-synthetic-v1.json"
      - "docs/CONNECTIVITY_OUTAGE_DISCRETE_SIM_V1.md"
      - ".github/workflows/connectivity-outage-discrete-sim.yml"
  push:
    branches: [main]
    paths:
      - "tools/connectivity-outage-discrete-sim/**"
      - "tools/connectivity-task-outcome-core/**"
      - "schemas/connectivity-outage-scenario-v1.schema.json"
      - "schemas/connectivity-task-outcome-*.schema.json"
      - "profiles/connectivity-task-outcome-benchmark-profile-v1.json"
      - "examples/connectivity-outage-scenario-synthetic-v1.json"
      - "docs/CONNECTIVITY_OUTAGE_DISCRETE_SIM_V1.md"
      - ".github/workflows/connectivity-outage-discrete-sim.yml"

permissions:
  contents: read

jobs:
  outage-simulation-contract:
    name: Simulate outage task outcomes and validate receipt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/connectivity-outage-discrete-sim/Cargo.toml -- --check
      - name: Run all tests
        run: cargo test --manifest-path tools/connectivity-outage-discrete-sim/Cargo.toml --all-targets
      - name: Lint with warnings denied
        run: cargo clippy --manifest-path tools/connectivity-outage-discrete-sim/Cargo.toml --all-targets -- -D warnings
      - name: Generate and validate synthetic receipt
        run: >-
          cargo run
          --manifest-path tools/connectivity-outage-discrete-sim/Cargo.toml
          --bin connectivity-outage-discrete-sim
          --
          schemas/connectivity-outage-scenario-v1.schema.json
          examples/connectivity-outage-scenario-synthetic-v1.json
          schemas/connectivity-task-outcome-run-v1.schema.json
          schemas/connectivity-task-outcome-profile-v1.schema.json
          profiles/connectivity-task-outcome-benchmark-profile-v1.json
          "$RUNNER_TEMP/connectivity-outage-run.json"
      - name: Confirm receipt is explicitly synthetic
        run: grep -q '"evidence_class": "synthetic_simulation"' "$RUNNER_TEMP/connectivity-outage-run.json"
