name: Firmware assurance corpus contract

on:
  pull_request:
    paths:
      - 'docs/FIRMWARE_ASSURANCE_BENCHMARK_V1.md'
      - 'docs/fixtures/firmware-assurance-corpus-v1.json'
      - 'docs/schemas/firmware-assurance-corpus-v1.schema.json'
      - 'tools/firmware-assurance-corpus-checker/**'
      - '.github/workflows/firmware-assurance-corpus-checker.yml'
  push:
    branches:
      - research/firmware-assurance-benchmark-v1
    paths:
      - 'docs/FIRMWARE_ASSURANCE_BENCHMARK_V1.md'
      - 'docs/fixtures/firmware-assurance-corpus-v1.json'
      - 'docs/schemas/firmware-assurance-corpus-v1.schema.json'
      - 'tools/firmware-assurance-corpus-checker/**'
      - '.github/workflows/firmware-assurance-corpus-checker.yml'

permissions:
  contents: read

jobs:
  corpus-contract:
    name: Rust corpus contract validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/firmware-assurance-corpus-checker/Cargo.toml --all -- --check

      - name: Run bounded Rust tests
        run: cargo test --manifest-path tools/firmware-assurance-corpus-checker/Cargo.toml

      - name: Run corpus contract checker
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/firmware-assurance-corpus-report.json"
          cargo run --manifest-path tools/firmware-assurance-corpus-checker/Cargo.toml -- \
            validate-corpus \
            docs/fixtures/firmware-assurance-corpus-v1.json \
            docs/schemas/firmware-assurance-corpus-v1.schema.json > "$report"
          jq -e '
            .report_version == "firmware-assurance-corpus-check/1.0.0" and
            .status == "passed" and
            .scope.profile_id == "synthetic-uefi-uki-v1" and
            .scope.physical_target == "none" and
            .scope.mutation_enabled == false and
            .scope.claim_ceiling == "corpus_structure_only_not_firmware_verification" and
            .case_count == 44 and
            .case_kind_counts.positive_control == 9 and
            .case_kind_counts.negative_control == 26 and
            .case_kind_counts.indeterminate_control == 9 and
            .executed_cases == 0 and
            .physical_device_operations == 0 and
            (.inputs.corpus_sha256 | test("^[0-9a-f]{64}$")) and
            (.inputs.schema_sha256 | test("^[0-9a-f]{64}$"))
          ' "$report" > /dev/null

      - name: Prove schema-invalid corpus cannot pass
        shell: bash
        run: |
          set -euo pipefail
          bad="$RUNNER_TEMP/firmware-assurance-corpus-bad.json"
          report="$RUNNER_TEMP/firmware-assurance-corpus-bad-report.json"
          jq '.case_count = (.case_count + 1)' \
            docs/fixtures/firmware-assurance-corpus-v1.json > "$bad"
          if cargo run --manifest-path tools/firmware-assurance-corpus-checker/Cargo.toml -- \
            validate-corpus "$bad" \
            docs/schemas/firmware-assurance-corpus-v1.schema.json > "$report"; then
            echo "Mutated case_count unexpectedly passed" >&2
            exit 1
          fi
          jq -e '.status == "blocked" and .checks.semantic_contract == "failed"' \
            "$report" > /dev/null

      - name: Clippy
        run: cargo clippy --manifest-path tools/firmware-assurance-corpus-checker/Cargo.toml --all-targets -- -D warnings
