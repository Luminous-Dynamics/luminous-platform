[package]
name = "connectivity-task-outcome-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline validator and aggregator for paired task-first connectivity benchmarks"

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "connectivity-task-outcome-verify"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
