name: connectivity-recovery-fairshare-sim

on:
  pull_request:
    paths:
      - "tools/community-bandwidth-fairshare-core/**"
      - "tools/connectivity-recovery-fairshare-sim/**"
      - "tools/connectivity-task-outcome-core/**"
      - "schemas/connectivity-recovery-fairshare-scenario-v1.schema.json"
      - "schemas/connectivity-task-outcome-*.schema.json"
      - "profiles/connectivity-task-outcome-benchmark-profile-v1.json"
      - "examples/connectivity-recovery-fairshare-scenario-synthetic-v1.json"
      - "docs/COMMUNITY_BANDWIDTH_FAIRSHARE_V1.md"
      - "docs/CONNECTIVITY_RECOVERY_FAIRSHARE_SIM_V1.md"
      - ".github/workflows/connectivity-recovery-fairshare-sim.yml"
  push:
    branches: [main, feat/connectivity-recovery-fairshare-sim-v1]
    paths:
      - "tools/community-bandwidth-fairshare-core/**"
      - "tools/connectivity-recovery-fairshare-sim/**"
      - "tools/connectivity-task-outcome-core/**"
      - "schemas/connectivity-recovery-fairshare-scenario-v1.schema.json"
      - "schemas/connectivity-task-outcome-*.schema.json"
      - "profiles/connectivity-task-outcome-benchmark-profile-v1.json"
      - "examples/connectivity-recovery-fairshare-scenario-synthetic-v1.json"
      - "docs/COMMUNITY_BANDWIDTH_FAIRSHARE_V1.md"
      - "docs/CONNECTIVITY_RECOVERY_FAIRSHARE_SIM_V1.md"
      - ".github/workflows/connectivity-recovery-fairshare-sim.yml"

permissions:
  contents: read

jobs:
  recovery-fairshare:
    name: Compare FCFS and fair-share recovery task outcomes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - name: Check allocator formatting
        run: cargo fmt --manifest-path tools/community-bandwidth-fairshare-core/Cargo.toml -- --check
      - name: Test allocator
        run: cargo test --manifest-path tools/community-bandwidth-fairshare-core/Cargo.toml --all-targets
      - name: Lint allocator
        run: cargo clippy --manifest-path tools/community-bandwidth-fairshare-core/Cargo.toml --all-targets -- -D warnings
      - name: Check simulator formatting
        run: cargo fmt --manifest-path tools/connectivity-recovery-fairshare-sim/Cargo.toml -- --check
      - name: Test recovery outcomes
        run: cargo test --manifest-path tools/connectivity-recovery-fairshare-sim/Cargo.toml --all-targets
      - name: Lint recovery simulator
        run: cargo clippy --manifest-path tools/connectivity-recovery-fairshare-sim/Cargo.toml --all-targets -- -D warnings
      - name: Generate and validate paired synthetic run
        run: >-
          cargo run
          --manifest-path tools/connectivity-recovery-fairshare-sim/Cargo.toml
          --bin connectivity-recovery-fairshare-sim
          --
          schemas/connectivity-recovery-fairshare-scenario-v1.schema.json
          examples/connectivity-recovery-fairshare-scenario-synthetic-v1.json
          schemas/connectivity-task-outcome-run-v1.schema.json
          schemas/connectivity-task-outcome-profile-v1.schema.json
          profiles/connectivity-task-outcome-benchmark-profile-v1.json
          "$RUNNER_TEMP/connectivity-recovery-fairshare-run.json"
      - name: Confirm synthetic evidence and privacy boundary
        run: |
          grep -q '"evidence_class": "synthetic_simulation"' "$RUNNER_TEMP/connectivity-recovery-fairshare-run.json"
          ! grep -q '"peer_id"' "$RUNNER_TEMP/connectivity-recovery-fairshare-run.json"
      - name: Run deterministic offered-load sweep
        run: |
          cargo run --manifest-path tools/connectivity-recovery-fairshare-sim/Cargo.toml --bin connectivity-recovery-sensitivity | tee "$RUNNER_TEMP/recovery-load-sweep.csv"
          grep -q '^49152,12288,250000,online,3,3,1000000,1000000,' "$RUNNER_TEMP/recovery-load-sweep.csv"
          grep -q '^9830,12288,1250050,online,1,2,333333,666666,' "$RUNNER_TEMP/recovery-load-sweep.csv"
          grep -q '^6144,12288,2000000,online,0,1,NA,333333,' "$RUNNER_TEMP/recovery-load-sweep.csv"
          grep -q '^6144,12288,2000000,wan_partition,0,2,NA,666666,' "$RUNNER_TEMP/recovery-load-sweep.csv"
