name: ACS-Nixward Bridge Corpus

on:
  pull_request:
    paths:
      - ".github/workflows/acs-nixward-bridge-corpus.yml"
      - "docs/ACS_NIXWARD_VERIFIABLE_OPERATIONS_BRIDGE.md"
      - "docs/fixtures/acs-nixward-bridge-v1-cases.json"
      - "docs/fixtures/acs-v0.1.0-schema-lock.json"
      - "docs/schemas/acs-nixward-bridge-test-corpus-v1.schema.json"
      - "vendor/agent-control-standard/**"
      - "tools/acs-bridge-validation/**"
      - "tests/acs-bridge-validation/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/acs-nixward-bridge-corpus.yml"
      - "docs/ACS_NIXWARD_VERIFIABLE_OPERATIONS_BRIDGE.md"
      - "docs/fixtures/acs-nixward-bridge-v1-cases.json"
      - "docs/fixtures/acs-v0.1.0-schema-lock.json"
      - "docs/schemas/acs-nixward-bridge-test-corpus-v1.schema.json"
      - "vendor/agent-control-standard/**"
      - "tools/acs-bridge-validation/**"
      - "tests/acs-bridge-validation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acs-nixward-bridge-corpus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    name: Validate pinned schema and corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
          check-latest: false

      - name: Record validation environment
        run: |
          python --version
          python -m pip --version

      - name: Install pinned validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r tools/acs-bridge-validation/requirements.txt

      - name: Run validator negative and mutation tests
        id: unit-tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests/acs-bridge-validation -v 2>&1 | tee "$RUNNER_TEMP/acs-nixward-unit-tests.log"

      - name: Verify pinned ACS schema bundle and offline references
        id: schema-lock
        run: python tools/acs-bridge-validation/verify_schema_lock.py

      - name: Validate corpus schema and invariants
        id: corpus-validation
        run: python tools/acs-bridge-validation/validate_corpus.py

      - name: Emit machine-readable validation receipt
        id: validation-receipt
        if: always()
        env:
          ACS_UNIT_TESTS_OUTCOME: ${{ steps.unit-tests.outcome }}
          ACS_SCHEMA_LOCK_OUTCOME: ${{ steps.schema-lock.outcome }}
          ACS_CORPUS_OUTCOME: ${{ steps.corpus-validation.outcome }}
          ACS_TEST_LOG: ${{ runner.temp }}/acs-nixward-unit-tests.log
          ACS_RECEIPT_OUTPUT: ${{ runner.temp }}/acs-nixward-validation-receipt-v1.json
        run: python tools/acs-bridge-validation/emit_validation_receipt.py

      - name: Upload machine-readable validation receipt
        if: always() && steps.validation-receipt.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acs-nixward-validation-receipt-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acs-nixward-validation-receipt-v1.json
          if-no-files-found: error
          retention-days: 30
