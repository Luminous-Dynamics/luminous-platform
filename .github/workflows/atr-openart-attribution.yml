name: ATR OpenART attribution sidecar contract

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/OPENART_ADAPTER_PROTOCOL_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/openart-atr-sidecar-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/openart-atr-sidecar-corpus-v0.1.json"
      - "tools/validate_openart_attribution.py"
      - ".github/workflows/atr-openart-attribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openart-sidecar:
    name: OpenART native/ATR trace attribution contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate causal ancestry, hidden-contract isolation and effect receipts
        run: python tools/validate_openart_attribution.py
