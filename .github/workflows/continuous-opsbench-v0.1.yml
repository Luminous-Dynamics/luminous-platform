name: continuous opsbench v0.1

on:
  pull_request:
    paths:
      - "research/continuous-opsbench-v0.1/**"
      - ".github/workflows/continuous-opsbench-v0.1.yml"
  push:
    branches: [main]
    paths:
      - "research/continuous-opsbench-v0.1/**"
      - ".github/workflows/continuous-opsbench-v0.1.yml"

permissions:
  contents: read

concurrency:
  group: continuous-opsbench-v0.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuous-evaluator:
    name: Continuous lifecycle evaluator and adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.96.0
      - name: Validate benchmark schemas are valid JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("research/continuous-opsbench-v0.1").glob("*.schema.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
      - name: Check Rust formatting
        run: rustfmt --edition 2021 --check research/continuous-opsbench-v0.1/src/watch_probe.rs research/continuous-opsbench-v0.1/src/paired_attention.rs research/continuous-opsbench-v0.1/src/event_schedule.rs research/continuous-opsbench-v0.1/src/episode_audit.rs research/continuous-opsbench-v0.1/src/scheduled_attention.rs research/continuous-opsbench-v0.1/src/context_ablation.rs
      - name: Run dependency-locked tests
        run: cargo test --manifest-path research/continuous-opsbench-v0.1/Cargo.toml --locked
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path research/continuous-opsbench-v0.1/Cargo.toml --locked -- -D warnings
