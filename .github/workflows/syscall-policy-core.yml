name: syscall policy core

on:
  pull_request:
    paths:
      - "tools/syscall-policy-core/**"
      - "tools/landlock-readonly-fixture/**"
      - ".github/workflows/syscall-policy-core.yml"
  push:
    branches: [main]
    paths:
      - "tools/syscall-policy-core/**"
      - "tools/landlock-readonly-fixture/**"
      - ".github/workflows/syscall-policy-core.yml"

permissions:
  contents: read

concurrency:
  group: syscall-policy-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-policy-core:
    name: Fail-closed policy decision tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pinned Rust toolchain and components
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: "1.96.0"
          components: "rustfmt, clippy"
          cache: false

      - name: Check formatting
        run: cargo fmt --manifest-path tools/syscall-policy-core/Cargo.toml -- --check

      - name: Run locked unit and adversarial tests
        run: cargo test --locked --manifest-path tools/syscall-policy-core/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/syscall-policy-core/Cargo.toml -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run synthetic decision demo
        run: cargo run --locked --manifest-path tools/syscall-policy-core/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Check Landlock fixture formatting
        run: cargo fmt --manifest-path tools/landlock-readonly-fixture/Cargo.toml -- --check

      - name: Build Landlock fixture adapter
        run: cargo build --locked --manifest-path tools/landlock-readonly-fixture/Cargo.toml
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run Landlock fixture and validate its JSON evidence
        run: |
          cargo run --quiet --locked --manifest-path tools/landlock-readonly-fixture/Cargo.toml | tee /tmp/landlock-fixture-output.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          lines = Path("/tmp/landlock-fixture-output.txt").read_text(encoding="utf-8").splitlines()
          records = [line for line in lines if line.startswith("{") and line.endswith("}")]
          assert len(records) == 1, f"expected one JSON result record, got {len(records)}"
          result = json.loads(records[0])
          assert result.get("schema") == "luminous.landlock-readonly-fixture-result.v1"
          assert result.get("status") == "pass"
          assert type(result.get("landlock_abi")) is int and result["landlock_abi"] >= 3
          for field in (
              "allowed_read_by_child",
              "outside_read_denied_by_child",
              "existing_write_denied_by_child",
              "outside_create_denied_by_child",
              "parent_oracle_allowed_canary_unchanged",
              "parent_oracle_outside_canary_unchanged",
              "parent_oracle_forbidden_output_absent",
          ):
              assert result.get(field) is True, f"missing or false evidence field: {field}"
          assert result.get("landlock_metadata_mutation_syscalls_covered") is False
          assert result.get("scope") == "disposable_file_content_access_fixture_only"
          print(f"PASS Landlock result schema; ABI {result['landlock_abi']}; 7 evidence fields confirmed.")
          PY
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run Landlock adapter Clippy
        run: cargo clippy --locked --manifest-path tools/landlock-readonly-fixture/Cargo.toml -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"
