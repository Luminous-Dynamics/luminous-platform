name: SRQ lifecycle interoperability

on:
  pull_request:
    paths:
      - ".github/workflows/srq-lifecycle-interop.yml"
      - "benchmarks/srq-lifecycle-interop/**"
      - "docs/SRQ_LIFECYCLE_INTEROP_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact SRQ integration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out the pinned Nixward transaction contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Luminous-Dynamics/nixward
          ref: ae60256f0be73138a539ecda048e81056dd14a30
          path: integration-upstream/nixward
          sparse-checkout: |
            docs/fixtures/system-transaction-v1.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the pinned Mycelix evidence-plane contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Luminous-Dynamics/mycelix
          ref: b02cefab8474262aef23b61a4ac3811fe92e29bf
          path: integration-upstream/mycelix
          sparse-checkout: |
            research/evidence-plane/receipt-v0.schema.json
            research/evidence-plane/examples/synthetic-planned-receipt-v0.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the pinned Sovereign Boot diagnostic producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Luminous-Dynamics/sovereign-boot
          ref: 9d183163a0f2bb101e6dd0ad3609afde04f1c5a4
          path: integration-upstream/sovereign-boot
          sparse-checkout: |
            tools/srq-boot-observation-probe
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Execute cross-repository interoperability and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import platform
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"BLOCKED: schema environment requires CPython 3.12, found {sys.version}")
          if sys.platform != "linux" or platform.machine() != "x86_64":
              raise SystemExit(f"BLOCKED: schema environment requires Linux x86_64, found {sys.platform}/{platform.machine()}")
          PY
          schema_venv="$RUNNER_TEMP/srq-schema-venv"
          schema_install_report="$RUNNER_TEMP/srq-schema-pip-install-report.json"
          schema_environment_report="$RUNNER_TEMP/srq-schema-environment-validation.json"
          python3 -m venv "$schema_venv"
          "$schema_venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --report "$schema_install_report" -r benchmarks/srq-lifecycle-interop/requirements-schema.txt
          export SRQ_SCHEMA_PYTHON="$schema_venv/bin/python"
          export SRQ_SCHEMA_INSTALL_REPORT="$schema_install_report"
          export SRQ_SCHEMA_ENV_VALIDATION_REPORT="$schema_environment_report"
          "$SRQ_SCHEMA_PYTHON" -m py_compile benchmarks/srq-lifecycle-interop/schema_validate.py benchmarks/srq-lifecycle-interop/schema_validate_test.py benchmarks/srq-lifecycle-interop/corpus_validate.py benchmarks/srq-lifecycle-interop/corpus_validate_test.py benchmarks/srq-lifecycle-interop/schema_env_validate.py benchmarks/srq-lifecycle-interop/schema_env_validate_test.py
          "$SRQ_SCHEMA_PYTHON" benchmarks/srq-lifecycle-interop/schema_env_validate_test.py
          "$SRQ_SCHEMA_PYTHON" benchmarks/srq-lifecycle-interop/schema_env_validate.py --lock benchmarks/srq-lifecycle-interop/schema-env-lock-v1.json --install-report "$schema_install_report" --output "$schema_environment_report"
          "$SRQ_SCHEMA_PYTHON" benchmarks/srq-lifecycle-interop/schema_validate_test.py
          "$SRQ_SCHEMA_PYTHON" benchmarks/srq-lifecycle-interop/corpus_validate_test.py
          bash -n benchmarks/srq-lifecycle-interop/validate.sh
          bash -n benchmarks/srq-lifecycle-interop/test.sh
          bash -n benchmarks/srq-lifecycle-interop/adversarial.sh
          bash -n benchmarks/srq-lifecycle-interop/transaction-phase-matrix.sh
          jq -e '.["$schema"] == "https://json-schema.org/draft/2020-12/schema" and .properties.contract_status.const == "PASS" and .properties.release_status.const == "BLOCKED" and .properties.claim_ceiling.const == "none" and (.properties.sources.required | index("interop_harness") != null) and (.properties.sources.properties.interop_harness.required | index("adversarial_script_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("adversarial_script_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_validator_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("schema_validator_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_validator_test_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("schema_validator_test_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_requirements_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("schema_requirements_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_protocol_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_protocol_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_protocol_id") != null) and (.properties.sources.properties.interop_harness.required | index("executable_mutations_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("executable_mutations_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_schema_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_schema_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_validator_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_validator_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_validator_test_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("corpus_validator_test_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_lock_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_lock_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_validator_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_validator_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_validator_test_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_validator_test_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_install_report_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("schema_environment_validation_report_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("phase_matrix_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("phase_matrix_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("phase_matrix_protocol_git_blob_sha1") != null) and (.properties.sources.properties.interop_harness.required | index("phase_matrix_protocol_raw_sha256") != null) and (.properties.sources.properties.interop_harness.required | index("phase_matrix_protocol_id") != null)' benchmarks/srq-lifecycle-interop/assessment-v1.schema.json
          jq -e --slurpfile lock benchmarks/srq-lifecycle-interop/upstream-lock-v1.json '
            .schema == "srq-lifecycle-adversarial-protocol-v1"
            and .protocol_id == "srq-lifecycle-adversarial-v1"
            and .version == 1
            and (.cases | length == 17)
            and .target_metrics.negative_case_count == 17
            and .target_metrics.negative_false_accept_count == 0
            and .target_metrics.positive_control_count == 5
            and .target_metrics.positive_false_reject_count == 0
            and .target_metrics.release_false_pass_count == 0
            and ([.cases[] | select(.input_kind == "mycelix_receipt" and .expected_schema_result == "INVALID")] | length == 9)
            and ([.cases[] | select(.input_kind == "nixward_transaction" and .expected_schema_result == "NOT_APPLICABLE")] | length == 8)
            and (.positive_controls | length == 5)
            and ([.positive_controls[] | select(.input_kind == "mycelix_receipt" and .expected_schema_result == "VALID")] | length == 2)
            and ([.positive_controls[] | select(.input_kind == "nixward_transaction" and .expected_schema_result == "NOT_APPLICABLE")] | length == 3)
            and .release_invariant.accepted_structural_control_must_leave_release_status == "BLOCKED"
            and .release_invariant.accepted_structural_control_must_leave_claim_ceiling == "none"
            and .release_invariant.release_pass_allowed == false
            and all(.upstream_inputs[]; . as $input | any($lock[0].pins[]; .repository == $input.repository and .commit_sha == $input.commit_sha and .path == $input.path and .git_blob_sha1 == $input.git_blob_sha1))
            and ([.cases[].id] | length == (unique | length))
            and ([.positive_controls[].id] | length == (unique | length))
          ' benchmarks/srq-lifecycle-interop/corpus-v1.json

          jq -e --slurpfile parent benchmarks/srq-lifecycle-interop/corpus-v1.json '
            .schema == "srq-lifecycle-executable-mutations-v1"
            and .version == 1
            and .parent_protocol_id == $parent[0].protocol_id
            and .invariants.exact_parent_case_id_join == true
            and .invariants.exact_parent_positive_control_id_join == true
            and .invariants.reject_missing_or_duplicate_ids == true
            and .invariants.transformations_must_be_non_empty_strings == true
            and .invariants.release_status_after_positive_controls == "BLOCKED"
            and .invariants.claim_ceiling_after_positive_controls == "none"
            and ([.cases[] | {id,input_kind,expected_schema_result,expected_lifecycle_result}] | sort_by(.id))
                == ([$parent[0].cases[] | {id,input_kind,expected_schema_result,expected_lifecycle_result}] | sort_by(.id))
            and ([.positive_controls[] | {id,input_kind,expected_schema_result,expected_lifecycle_result,expected_evidence_tier,expected_evidence_claim_ceiling,expected_transaction_phase}] | sort_by(.id))
                == ([$parent[0].positive_controls[] | {id,input_kind,expected_schema_result,expected_lifecycle_result,expected_evidence_tier,expected_evidence_claim_ceiling,expected_transaction_phase}] | sort_by(.id))
            and ([.cases[].id] | length == (unique | length))
            and ([.positive_controls[].id] | length == (unique | length))
            and (.cases | all(.[]; (.transform_filter | type == "string" and length > 0) and (.expected_failure_reason | type == "string" and length > 0)))
            and (.positive_controls | all(.[]; (.transform_filter | type == "string" and length > 0)))
          ' benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json

          jq -e '
            .schema == "srq-transaction-phase-state-protocol-v1"
            and .protocol_id == "nixward-transaction-phase-presence-v1"
            and .version == 1
            and (.record_bits | map(.name) == ["validation","authorization","snapshot","application","verification","outcome"])
            and (.record_bits | map(.bit) == [0,1,2,3,4,5])
            and (.phases | map(.id) == ["planned","validated","authorized","snapshotted","applied","verified","promoted","failed","recovered"])
            and .oracle.kind == "minimum_record_presence"
            and .oracle.expected_state_count == 576
            and .oracle.expected_accept_count == 175
            and .oracle.expected_reject_count == 401
            and .target_metrics.false_accept_count == 0
            and .target_metrics.false_reject_count == 0
            and .target_metrics.unexpected_error_count == 0
            and .target_metrics.false_release_pass_count == 0
            and .release_invariant.every_accepted_state_release_status == "BLOCKED"
            and .release_invariant.every_accepted_state_claim_ceiling == "none"
            and .release_invariant.release_pass_allowed == false
            and ([.phases[].id] | length == (unique | length))
          ' benchmarks/srq-lifecycle-interop/transaction-phase-state-protocol-v1.json

          evidence_dir="$RUNNER_TEMP/srq-lifecycle-interop"
          mkdir -p "$evidence_dir"
          cp benchmarks/srq-lifecycle-interop/corpus-v1.json "$evidence_dir/corpus-v1.json"
          cp benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json "$evidence_dir/corpus-executable-mutations-v1.json"
          cp benchmarks/srq-lifecycle-interop/transaction-phase-state-protocol-v1.json "$evidence_dir/transaction-phase-state-protocol-v1.json"
          cp benchmarks/srq-lifecycle-interop/schema-env-lock-v1.json "$evidence_dir/schema-env-lock-v1.json"
          cp "$schema_install_report" "$evidence_dir/schema-pip-install-report.json"
          cp "$schema_environment_report" "$evidence_dir/schema-environment-validation.json"
          bash benchmarks/srq-lifecycle-interop/test.sh \
            "$GITHUB_WORKSPACE/integration-upstream/nixward" \
            "$GITHUB_WORKSPACE/integration-upstream/mycelix" \
            "$GITHUB_WORKSPACE/integration-upstream/sovereign-boot" \
            "$evidence_dir"
          jq -e --slurpfile protocol benchmarks/srq-lifecycle-interop/corpus-v1.json --slurpfile executable benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json --arg protocol_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/corpus-v1.json | cut -d ' ' -f 1)" --arg protocol_blob "$(git hash-object -- benchmarks/srq-lifecycle-interop/corpus-v1.json)" --arg mutation_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json | cut -d ' ' -f 1)" --arg mutation_blob "$(git hash-object -- benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json)" '
            .schema == "srq-lifecycle-adversarial-assessment-v1"
            and .executable_mutations.schema == $executable[0].schema
            and .executable_mutations.version == $executable[0].version
            and .executable_mutations.parent_protocol_id == $protocol[0].protocol_id
            and .executable_mutations.raw_sha256 == $mutation_sha256
            and .executable_mutations.git_blob_sha1 == $mutation_blob
            and ([.cases[] | {id,input_kind,mutation_filter}] | sort_by(.id))
                == ([$executable[0].cases[] | {id,input_kind,mutation_filter:.transform_filter}] | sort_by(.id))
            and ([.positive_controls[] | {id,input_kind,mutation_filter}] | sort_by(.id))
                == ([$executable[0].positive_controls[] | {id,input_kind,mutation_filter:.transform_filter}] | sort_by(.id))
            and .protocol.protocol_id == $protocol[0].protocol_id
            and .protocol.version == $protocol[0].version
            and .protocol.raw_sha256 == $protocol_sha256
            and .protocol.git_blob_sha1 == $protocol_blob
            and ([.cases[] | {id,input_kind,schema_validation_result}] | sort_by(.id))
                == ([$protocol[0].cases[] | {id,input_kind,schema_validation_result:.expected_schema_result}] | sort_by(.id))
            and ([.positive_controls[] | {id,input_kind,schema_validation_result}] | sort_by(.id))
                == ([$protocol[0].positive_controls[] | {id,input_kind,schema_validation_result:.expected_schema_result}] | sort_by(.id))
            and .status == "PASS" and .release_status == "BLOCKED"
            and .expected_case_count == 17 and .rejected_case_count == 17
            and .all_expected_mutations_rejected == true
            and .expected_positive_control_count == 5
            and .accepted_positive_control_count == 5
            and .all_positive_controls_accepted == true
            and (.positive_controls | length == 5)
            and .observed_metrics.negative_false_accept_count == 0
            and .observed_metrics.positive_false_reject_count == 0
            and .observed_metrics.release_false_pass_count == 0
            and $protocol[0].target_metrics.negative_false_accept_count == .observed_metrics.negative_false_accept_count
            and $protocol[0].target_metrics.positive_false_reject_count == .observed_metrics.positive_false_reject_count
            and $protocol[0].target_metrics.release_false_pass_count == .observed_metrics.release_false_pass_count
            and .schema_validator.library == "python-jsonschema"
            and .schema_validator.version == "4.26.0"
            and .schema_validator.format_assertion == true
            and (.fixture.schema_raw_sha256 | test("^[0-9a-f]{64}$"))
            and ([.cases[] | select(.input_kind == "mycelix_receipt")] | (length == 9 and all(.[]; .schema_validation_result == "INVALID" and (.schema_validation_report_raw_sha256 | test("^[0-9a-f]{64}$")))))
            and ([.cases[] | select(.input_kind == "nixward_transaction")] | (length == 8 and all(.[]; .schema_validation_result == "NOT_APPLICABLE" and .schema_validation_report_raw_sha256 == null)))
            and ([.positive_controls[] | select(.input_kind == "mycelix_receipt")] | (length == 2 and all(.[]; .schema_validation_result == "VALID" and (.schema_validation_report_raw_sha256 | test("^[0-9a-f]{64}$")))))
            and ([.positive_controls[] | select(.input_kind == "nixward_transaction")] | (length == 3 and all(.[]; .schema_validation_result == "NOT_APPLICABLE" and .schema_validation_report_raw_sha256 == null)))
          ' "$evidence_dir/srq-lifecycle-adversarial-assessment.json"
          jq -e --arg protocol_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/corpus-v1.json | cut -d ' ' -f 1)" --arg protocol_blob "$(git hash-object -- benchmarks/srq-lifecycle-interop/corpus-v1.json)" --arg mutation_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json | cut -d ' ' -f 1)" --arg mutation_blob "$(git hash-object -- benchmarks/srq-lifecycle-interop/corpus-executable-mutations-v1.json)" --arg schema_env_lock_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/schema-env-lock-v1.json | cut -d ' ' -f 1)" --arg schema_install_report_sha256 "$(sha256sum "$schema_install_report" | cut -d ' ' -f 1)" --arg schema_environment_report_sha256 "$(sha256sum "$schema_environment_report" | cut -d ' ' -f 1)" --arg phase_matrix_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/transaction-phase-matrix.sh | cut -d ' ' -f 1)" --arg phase_matrix_blob "$(git hash-object -- benchmarks/srq-lifecycle-interop/transaction-phase-matrix.sh)" --arg phase_protocol_sha256 "$(sha256sum benchmarks/srq-lifecycle-interop/transaction-phase-state-protocol-v1.json | cut -d ' ' -f 1)" --arg phase_protocol_blob "$(git hash-object -- benchmarks/srq-lifecycle-interop/transaction-phase-state-protocol-v1.json)" --arg phase_protocol_id "$(jq -er '.protocol_id' benchmarks/srq-lifecycle-interop/transaction-phase-state-protocol-v1.json)" '
            .schema == "srq-lifecycle-interop-assessment-v1"
            and .contract_status == "PASS"
            and .release_status == "BLOCKED"
            and .claim_ceiling == "none"
            and (.sources.interop_harness.commit_sha | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.validator_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.schema_validator_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.schema_validator_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.schema_validator_test_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.schema_validator_test_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.schema_requirements_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.schema_requirements_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.corpus_protocol_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.corpus_protocol_raw_sha256 | test("^[0-9a-f]{64}$"))
            and .sources.interop_harness.corpus_protocol_id == "srq-lifecycle-adversarial-v1"
            and (.sources.interop_harness.corpus_schema_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.corpus_schema_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.corpus_validator_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.corpus_validator_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.corpus_validator_test_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.corpus_validator_test_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.schema_environment_lock_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and .sources.interop_harness.schema_environment_lock_raw_sha256 == $schema_env_lock_sha256
            and (.sources.interop_harness.schema_environment_validator_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.schema_environment_validator_raw_sha256 | test("^[0-9a-f]{64}$"))
            and (.sources.interop_harness.schema_environment_validator_test_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and (.sources.interop_harness.schema_environment_validator_test_raw_sha256 | test("^[0-9a-f]{64}$"))
            and .sources.interop_harness.schema_install_report_raw_sha256 == $schema_install_report_sha256
            and .sources.interop_harness.schema_environment_validation_report_raw_sha256 == $schema_environment_report_sha256
            and .sources.interop_harness.phase_matrix_git_blob_sha1 == $phase_matrix_blob
            and .sources.interop_harness.phase_matrix_raw_sha256 == $phase_matrix_sha256
            and .sources.interop_harness.phase_matrix_protocol_git_blob_sha1 == $phase_protocol_blob
            and .sources.interop_harness.phase_matrix_protocol_raw_sha256 == $phase_protocol_sha256
            and .sources.interop_harness.phase_matrix_protocol_id == $phase_protocol_id
            and .sources.interop_harness.corpus_protocol_raw_sha256 == $protocol_sha256
            and .sources.interop_harness.corpus_protocol_git_blob_sha1 == $protocol_blob
            and (.sources.interop_harness.executable_mutations_git_blob_sha1 | test("^[0-9a-f]{40}$"))
            and .sources.interop_harness.executable_mutations_raw_sha256 == $mutation_sha256
            and .sources.interop_harness.executable_mutations_git_blob_sha1 == $mutation_blob
            and (.release_blockers | length >= 5)
          ' "$evidence_dir/lifecycle-interop-assessment.json"

      - name: Preserve cross-layer interoperability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-lifecycle-interop-evidence
          path: |
            ${{ runner.temp }}/srq-lifecycle-interop/lifecycle-interop-assessment.json
            ${{ runner.temp }}/srq-lifecycle-interop/srq-lifecycle-adversarial-assessment.json
            ${{ runner.temp }}/srq-lifecycle-interop/transaction-phase-matrix-assessment.json
            ${{ runner.temp }}/srq-lifecycle-interop/transaction-phase-state-protocol-v1.json
            ${{ runner.temp }}/srq-lifecycle-interop/corpus-v1.json
            ${{ runner.temp }}/srq-lifecycle-interop/corpus-executable-mutations-v1.json
            ${{ runner.temp }}/srq-lifecycle-interop/schema-env-lock-v1.json
            ${{ runner.temp }}/srq-lifecycle-interop/schema-pip-install-report.json
            ${{ runner.temp }}/srq-lifecycle-interop/schema-environment-validation.json
            ${{ runner.temp }}/srq-lifecycle-interop/schema-validation/*.json
          if-no-files-found: ignore
          retention-days: 30
