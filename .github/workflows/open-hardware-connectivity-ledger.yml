name: open-hardware-connectivity-ledger

on:
  pull_request:
    paths:
      - "docs/OPEN_HARDWARE_CONNECTIVITY_QUALIFICATION_V1.md"
      - "profiles/open-hardware-connectivity-candidate-ledger-v1.json"
      - "schemas/open-hardware-connectivity-candidate-ledger-v1.schema.json"
      - "tools/open-hardware-connectivity-ledger-validator/**"
      - ".github/workflows/open-hardware-connectivity-ledger.yml"
  push:
    branches: [main, research/open-hardware-connectivity-ledger-v1]
    paths:
      - "docs/OPEN_HARDWARE_CONNECTIVITY_QUALIFICATION_V1.md"
      - "profiles/open-hardware-connectivity-candidate-ledger-v1.json"
      - "schemas/open-hardware-connectivity-candidate-ledger-v1.schema.json"
      - "tools/open-hardware-connectivity-ledger-validator/**"
      - ".github/workflows/open-hardware-connectivity-ledger.yml"

permissions:
  contents: read

concurrency:
  group: open-hardware-connectivity-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hardware-ledger:
    name: Open-hardware evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and Clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned immutable revision
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Test hardware ledger validator and negative cases
        run: cargo test --manifest-path tools/open-hardware-connectivity-ledger-validator/Cargo.toml --all-targets

      - name: Lint hardware ledger validator
        run: cargo clippy --manifest-path tools/open-hardware-connectivity-ledger-validator/Cargo.toml --all-targets -- -D warnings

      - name: Validate checked-in candidate ledger
        run: >-
          cargo run
          --manifest-path tools/open-hardware-connectivity-ledger-validator/Cargo.toml
          --
          schemas/open-hardware-connectivity-candidate-ledger-v1.schema.json
          profiles/open-hardware-connectivity-candidate-ledger-v1.json
