[package]
name = "luminous-work-case-postgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Rust-native PostgreSQL repository baseline for Luminous Work Case V1"

[dependencies]
chrono = { version = "=0.4.42", features = ["serde"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "chrono", "json", "uuid"] }
thiserror = "=2.0.18"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
