[package]
name = "luminous-security-audit-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Candidate Rust implementation of the Luminous independent security-audit verifier"

[[bin]]
name = "security-audit-verifier"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
