name: Security Audit Workflow Syntax

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-syntax-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  actionlint:
    name: Validate security audit workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download and verify pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint_1.7.12"
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          shellcheck_dir="$RUNNER_TEMP/shellcheck-v0.11.0"
          mkdir -p "$tool_dir" security-audit-syntax-results
          setup_report="security-audit-syntax-results/tool-setup.txt"
          {
            echo "schema=luminous.security-audit.syntax-setup.v1"
            echo "subject_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "actionlint_version_expected=v1.7.12"
            echo "actionlint_archive_sha256_expected=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
            echo "shellcheck_version_expected=v0.11.0"
            echo "shellcheck_archive_sha256_expected=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
            echo "tool_setup_status=INCOMPLETE"
          } > "$setup_report"
          if ! curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"; then
            echo "tool_setup_status=FAIL reason=actionlint_download_failed" >> "$setup_report"
            exit 1
          fi
          if ! echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -; then
            echo "tool_setup_status=FAIL reason=actionlint_checksum_mismatch" >> "$setup_report"
            exit 1
          fi
          if ! tar -xzf "$archive" -C "$tool_dir" actionlint; then
            echo "tool_setup_status=FAIL reason=actionlint_extract_failed" >> "$setup_report"
            exit 1
          fi
          if ! curl -fsSL --retry 3 -o "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"; then
            echo "tool_setup_status=FAIL reason=shellcheck_download_failed" >> "$setup_report"
            exit 1
          fi
          if ! echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" | sha256sum -c -; then
            echo "tool_setup_status=FAIL reason=shellcheck_checksum_mismatch" >> "$setup_report"
            exit 1
          fi
          if ! tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck; then
            echo "tool_setup_status=FAIL reason=shellcheck_extract_failed" >> "$setup_report"
            exit 1
          fi
          if ! "$tool_dir/actionlint" -version > "$RUNNER_TEMP/actionlint-version.txt" 2>&1; then
            echo "tool_setup_status=FAIL reason=actionlint_unusable" >> "$setup_report"
            exit 1
          fi
          if ! "$shellcheck_dir/shellcheck" --version > "$RUNNER_TEMP/shellcheck-version.txt" 2>&1; then
            echo "tool_setup_status=FAIL reason=shellcheck_unusable" >> "$setup_report"
            exit 1
          fi
          cat "$RUNNER_TEMP/actionlint-version.txt" "$RUNNER_TEMP/shellcheck-version.txt" >> "$setup_report"
          echo "tool_setup_status=PASS" >> "$setup_report"

      - name: Lint workflow YAML and GitHub Actions expressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-audit-syntax-results
          report="security-audit-syntax-results/actionlint.txt"
          binary="$RUNNER_TEMP/actionlint_1.7.12/actionlint"
          mapfile -d '' -t workflows < <(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | LC_ALL=C sort -z
          )
          if [[ "${#workflows[@]}" -eq 0 ]]; then
            echo "FAIL: no workflow files found" | tee "$report"
            exit 2
          fi
          shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          if "$binary" -shellcheck="$shellcheck" "${workflows[@]}" > "$report" 2>&1; then
            echo "status=PASS" >> "$report"
            cat "$report"
          else
            rc=$?
            echo "status=FAIL exit_code=$rc" >> "$report"
            cat "$report"
            exit "$rc"
          fi

      - name: Preserve syntax report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-syntax-${{ github.sha }}-${{ github.run_id }}
          path: security-audit-syntax-results/
          if-no-files-found: warn
          retention-days: 14
