name: SRQ-1 corpus contract

on:
  pull_request:
    paths:
      - ".github/workflows/srq-v1.yml"
      - "benchmarks/srq-v1/**"
      - "tools/srq-recovery-model/**"
      - "docs/SOVEREIGN_RECOVERY_QUALIFICATION_V1.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  SRQ_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SRQ_EVENT_SHA: ${{ github.sha }}

jobs:
  validate-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source head
        # Immutable commit pin for actions/checkout v4.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact-head provenance
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          printf 'expected_source_sha=%s event_sha=%s actual_checkout_head=%s\n' "$SRQ_EXPECTED_SOURCE_SHA" "$SRQ_EVENT_SHA" "$actual_head"
          test "$actual_head" = "$SRQ_EXPECTED_SOURCE_SHA"

      - name: Install pinned Rust toolchain for the dependency-free model
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n benchmarks/srq-v1/validate.sh
          bash -n benchmarks/srq-v1/test-validator.sh
          bash -n benchmarks/srq-v1/validate-result.sh
          bash -n benchmarks/srq-v1/test-result-validator.sh

      - name: Run bounded filesystem activation model
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-recovery-model-test.log"
          model_receipt="$RUNNER_TEMP/srq-update-004-model-result.json"
          command='cargo test --manifest-path tools/srq-recovery-model/Cargo.toml --locked'
          cargo test --manifest-path tools/srq-recovery-model/Cargo.toml --locked 2>&1 | tee "$model_log"
          # A green cargo exit is not enough if a required test disappears.
          grep -Fq 'test result: ok. 7 passed; 0 failed' "$model_log"
          grep -Fq 'tests::every_interruption_boundary_leaves_old_or_new_complete_generation ... ok' "$model_log"

          actual_head="$(git rev-parse HEAD)"
          evidence_sha="$(sha256sum "$model_log" | cut -d ' ' -f 1)"
          jq -n \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg command "$command" \
            --arg os "$(uname -sr)" \
            --arg architecture "$(uname -m)" \
            --arg toolchain "$(rustc --version)" \
            --arg evidence_sha "$evidence_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              scenario_id: "UPDATE-004",
              status: "PASS",
              reason: "The filesystem-backed model kept the previous or next complete generation across 100 trials at each of five injected process-interruption checkpoints (500 trials total).",
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              execution: {
                tier: "model",
                steps_executed: true,
                command: $command,
                exit_code: 0,
                environment: {os: $os, architecture: $architecture, toolchain: $toolchain}
              },
              evidence: [{artifact: "srq-recovery-model-test.log", sha256: $evidence_sha, kind: "log"}],
              claim_ceiling: "abstract_model_only",
              non_claims: [
                "This is a filesystem-backed abstract model with synthetic generation payloads, not a production updater or bootloader.",
                "Process interruption on a normal filesystem is not equivalent to physical sudden-power-loss testing.",
                "No TUF signature policy, artifact provenance, signer/device identity, firmware root of trust, or TPM evidence is qualified.",
                "QEMU and physical activation scenarios remain unexecuted."
              ],
              fixture: false
            }' > "$model_receipt"

          bash benchmarks/srq-v1/validate-result.sh --evidence-root "$RUNNER_TEMP" "$model_receipt"

      - name: Run atomic challenge-promotion model
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-challenge-promotion-model-test.log"
          model_receipt="$RUNNER_TEMP/srq-evidence-003-model-result.json"
          command='cargo test --manifest-path tools/srq-challenge-promotion-model/Cargo.toml --locked'
          cargo test --manifest-path tools/srq-challenge-promotion-model/Cargo.toml --locked 2>&1 | tee "$model_log"
          # Protect the race/crash acceptance claims against accidental test deletion.
          grep -Fq 'test result: ok. 7 passed; 0 failed' "$model_log"
          grep -Fq 'tests::sixty_four_concurrent_attempts_for_one_challenge_commit_exactly_once ... ok' "$model_log"
          grep -Fq 'tests::interruption_boundaries_preserve_old_or_fully_promoted_state ... ok' "$model_log"

          actual_head="$(git rev-parse HEAD)"
          evidence_sha="$(sha256sum "$model_log" | cut -d ' ' -f 1)"
          jq -n \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg command "$command" \
            --arg os "$(uname -sr)" \
            --arg architecture "$(uname -m)" \
            --arg toolchain "$(rustc --version)" \
            --arg evidence_sha "$evidence_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              scenario_id: "EVIDENCE-003",
              status: "PASS",
              reason: "The Linux filesystem model serialized 64 concurrent attempts so exactly one consumed the challenge and promoted the next policy generation; 100 injected process-interruption trials preserved the previous or fully promoted state.",
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              execution: {
                tier: "model",
                steps_executed: true,
                command: $command,
                exit_code: 0,
                environment: {os: $os, architecture: $architecture, toolchain: $toolchain}
              },
              evidence: [{artifact: "srq-challenge-promotion-model-test.log", sha256: $evidence_sha, kind: "log"}],
              claim_ceiling: "abstract_model_only",
              non_claims: [
                "This is a filesystem-backed contract model, not the production durable promotion database or policy gate.",
                "Linux flock serialization was tested with concurrent workers using separate open file descriptions in one runner; cross-host or distributed locking is not qualified.",
                "Normal process-interruption tests on the runner filesystem are not equivalent to sudden physical power loss.",
                "No signer/device identity, trusted time, TUF metadata verification, TPM, firmware root of trust, QEMU or physical-device behavior is qualified."
              ],
              fixture: false
            }' > "$model_receipt"

          bash benchmarks/srq-v1/validate-result.sh --evidence-root "$RUNNER_TEMP" "$model_receipt"

      - name: Preserve model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-model-evidence
          path: |
            ${{ runner.temp }}/srq-recovery-model-test.log
            ${{ runner.temp }}/srq-update-004-model-result.json
            ${{ runner.temp }}/srq-challenge-promotion-model-test.log
            ${{ runner.temp }}/srq-evidence-003-model-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate the frozen SRQ-1 corpus
        run: bash benchmarks/srq-v1/validate.sh

      - name: Exercise validator negative controls
        run: bash benchmarks/srq-v1/test-validator.sh

      - name: Validate PASS and NOT_RUN result receipt examples
        run: |
          set -euo pipefail
          bash benchmarks/srq-v1/validate-result.sh --allow-fixtures benchmarks/srq-v1/fixtures/result-pass-static.example.json
          bash benchmarks/srq-v1/validate-result.sh --allow-fixtures benchmarks/srq-v1/fixtures/result-not-run.example.json

      - name: Exercise result receipt negative controls
        run: bash benchmarks/srq-v1/test-result-validator.sh
