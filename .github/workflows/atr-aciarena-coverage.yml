name: ATR ACIArena coverage contract

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/ACIARENA_ADAPTER_PROTOCOL_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/aciarena-coverage-contract-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/aciarena-coverage-contract-v0.1.json"
      - "tools/validate_aciarena_coverage.py"
      - ".github/workflows/atr-aciarena-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aciarena-coverage:
    name: ACIArena 3x3 surface/objective coverage contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate ACIArena 3x3 surface/objective coverage and mutations
        run: python tools/validate_aciarena_coverage.py
