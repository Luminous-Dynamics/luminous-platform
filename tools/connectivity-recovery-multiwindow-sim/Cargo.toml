[package]
name = "connectivity-recovery-multiwindow-sim"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Deterministic stateful partial-progress recovery simulation with paired task receipts"

[dependencies]
community-bandwidth-fairshare-core = { path = "../community-bandwidth-fairshare-core" }
connectivity-task-outcome-core = { path = "../connectivity-task-outcome-core" }
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.145"

[lib]
path = "src/lib.rs"

[[bin]]
name = "connectivity-recovery-multiwindow-sim"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
