name: SRQ quorum-witness protocol model

on:
  pull_request:
    paths:
      - ".github/workflows/srq-quorum-witness.yml"
      - "tools/srq-quorum-witness-model/**"
      - "docs/SRQ_QUORUM_WITNESS_MODEL_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quorum-model:
    name: Verify quorum intersection and non-equivocation invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustc +1.96.0 --version

      - name: Test quorum intersection and checkpoint binding
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/srq-quorum-witness-model.log"
          cargo +1.96.0 test --manifest-path tools/srq-quorum-witness-model/Cargo.toml --locked -- --nocapture 2>&1 | tee "$log"
          grep -Fq 'test result: ok. 13 passed; 0 failed' "$log"
          grep -Fq 'test tests::duplicate_policy_members_are_rejected_instead_of_silently_shrinking_committee ... ok' "$log"
          grep -Fq 'test tests::every_admissible_small_committee_preserves_quorum_intersection ... ok' "$log"
          grep -Fq 'test tests::conflicting_certificates_cannot_both_reach_quorum_with_one_byzantine_witness ... ok' "$log"
          grep -Fq 'test tests::all_three_of_four_quorums_intersect_in_at_least_f_plus_one_members ... ok' "$log"
          grep -Fq 'test tests::honest_witness_is_idempotent_and_refuses_equivocation ... ok' "$log"
          grep -Fq 'test tests::restoring_witness_memory_can_erase_its_vote_and_is_not_durable_anti_equivocation ... ok' "$log"
          echo "LIMIT: protocol model only; no signatures, live witness service, durable anti-rollback or physical qualification."
