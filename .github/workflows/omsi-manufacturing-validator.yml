name: OMSI manufacturing semantic validator

on:
  pull_request:
    paths:
      - 'tools/omsi-manufacturing-validator/**'
      - 'docs/standards/omsi/**'
  push:
    branches: [main]
    paths:
      - 'tools/omsi-manufacturing-validator/**'
      - 'docs/standards/omsi/**'

permissions:
  contents: read

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Detect validator crate
        id: source
        shell: bash
        run: |
          if test -f tools/omsi-manufacturing-validator/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No validator crate in this documentation-only revision; formatting job is not applicable."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.present == 'true'
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        if: steps.source.outputs.present == 'true'
        run: cargo fmt --manifest-path tools/omsi-manufacturing-validator/Cargo.toml --all -- --check

  test:
    name: Rust semantic conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Detect validator crate
        id: source
        shell: bash
        run: |
          if test -f tools/omsi-manufacturing-validator/Cargo.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No validator crate in this documentation-only revision; semantic tests are not applicable."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.present == 'true'
        with:
          toolchain: stable
          components: clippy
      - name: Run executable conformance tests
        if: steps.source.outputs.present == 'true'
        run: cargo test --manifest-path tools/omsi-manufacturing-validator/Cargo.toml
      - name: Run semantic validator against the committed profile vectors
        if: steps.source.outputs.present == 'true'
        run: cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- validate-vectors docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json
      - name: Smoke-test raw-byte replay envelope
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          input_file="$RUNNER_TEMP/omsi-replay-input.json"
          envelope_file="$RUNNER_TEMP/omsi-replay-envelope.json"
          jq '.vectors[0].input' docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json > "$input_file"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- create-envelope "$input_file" > "$envelope_file"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- verify-envelope "$envelope_file" "$input_file"
      - name: Smoke-test non-gating benchmark report
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          report_file="$RUNNER_TEMP/omsi-benchmark-report.json"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- benchmark-vectors docs/standards/omsi/profiles/manufacturing-asset-operations/0.1/CONFORMANCE-VECTORS.json 10 > "$report_file"
          jq -e '
            .benchmark_contract == "omsi-manufacturing-benchmark-report/0.1" and
            .status == "measured_no_acceptance_claim" and
            .authority == "performance_observation_only" and
            .run.sample_count_per_phase == (.corpus.case_count * .run.iterations_per_case) and
            .run.max_cases == 10000 and
            .run.max_samples_per_phase == 1000000 and
            .run.sample_count_per_phase <= .run.max_samples_per_phase and
            .run.throughput_measurement_mode == "separate_batch_pass_without_per_operation_timers" and
            (.phases | has("json_parse") and has("semantic_evaluation") and has("envelope_creation") and has("envelope_verification")) and
            .phases.json_parse.wall_clock_elapsed_ns > 0 and
            .phases.json_parse.wall_clock_operations_per_second > 0 and
            .phases.semantic_evaluation.wall_clock_elapsed_ns > 0 and
            .phases.semantic_evaluation.wall_clock_operations_per_second > 0 and
            .phases.envelope_creation.wall_clock_elapsed_ns > 0 and
            .phases.envelope_creation.wall_clock_operations_per_second > 0 and
            .phases.envelope_verification.wall_clock_elapsed_ns > 0 and
            .phases.envelope_verification.wall_clock_operations_per_second > 0
          ' "$report_file" > /dev/null

      - name: Smoke-test explicit adapter field accounting
        shell: bash
        run: |
          set -euo pipefail
          base="docs/standards/omsi/adapters/0.1/examples"
          for adapter in mes-flat qms-nested; do
            report_file="$RUNNER_TEMP/omsi-adapter-$adapter-audit.json"
            cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
              audit-adapter-map "$base/$adapter-map.json" "$base/$adapter-record.json" > "$report_file"
            jq -e '
              .audit_contract == "omsi-manufacturing-adapter-audit/0.1" and
              .status == "complete_accounting" and
              .authority == "adapter_mapping_accounting_only" and
              .silent_loss_count == 0 and
              .source_field_count == .accounted_field_count
            ' "$report_file" > /dev/null
          done
          jq -e '.dropped_count == 1 and .preserved_count == 5 and .transformed_count == 0' \
            "$RUNNER_TEMP/omsi-adapter-mes-flat-audit.json" > /dev/null
          jq -e '.source_field_count == 8 and .transformed_count == 2 and .preserved_count == 6 and .explicitly_unmapped_count == 0' \
            "$RUNNER_TEMP/omsi-adapter-qms-nested-audit.json" > /dev/null

      - name: Verify registered transformation vectors
        shell: bash
        run: |
          set -euo pipefail
          report_file="$RUNNER_TEMP/omsi-transform-vector-report.json"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
            verify-transform-vectors docs/standards/omsi/adapters/0.1/TRANSFORM-VECTORS.json > "$report_file"
          jq -e '
            .report_contract == "omsi-manufacturing-transform-vector-report/0.1" and
            .authority == "registered_transform_vector_agreement_only" and
            .status == "passed" and
            .vectors_expected == 10 and
            .vectors_tested == 10 and
            .failure_count == 0 and
            (.failures | length) == 0
          ' "$report_file" > /dev/null

      - name: Smoke-test executable adapter projections
        shell: bash
        run: |
          set -euo pipefail
          base="docs/standards/omsi/adapters/0.1/examples"
          for adapter in mes-flat qms-nested; do
            report_file="$RUNNER_TEMP/omsi-adapter-$adapter-projection.json"
            cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
              apply-adapter-map "$base/$adapter-map.json" "$base/$adapter-record.json" > "$report_file"
            jq -e '
              .projection_contract == "omsi-manufacturing-adapter-projection/0.1" and
              .status == "projection_created" and
              .authority == "adapter_projection_only" and
              .projection != null and
              .audit.silent_loss_count == 0
            ' "$report_file" > /dev/null
          done
          jq -e '
            .projection.measurement.value_decimal == "0.0072" and
            .projection.measurement.unit_code == "mm" and
            .projection.source_quality_claim.raw_status == "REVIEW"
          ' "$RUNNER_TEMP/omsi-adapter-qms-nested-projection.json" > /dev/null
          jq -e '
            .explicitly_dropped_count == 1 and
            .projection.source_quality_claim.raw_status == "Accepted" and
            (.projection | has("operator_note") | not)
          ' "$RUNNER_TEMP/omsi-adapter-mes-flat-projection.json" > /dev/null

      - name: Verify optional source fields stay explicit
        shell: bash
        run: |
          set -euo pipefail
          base="docs/standards/omsi/adapters/0.1/examples"
          audit_file="$RUNNER_TEMP/omsi-adapter-mes-optional-audit.json"
          projection_file="$RUNNER_TEMP/omsi-adapter-mes-optional-projection.json"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
            audit-adapter-map "$base/mes-optional-map.json" "$base/mes-optional-record.json" > "$audit_file"
          jq -e '
            .status == "complete_accounting" and
            .silent_loss_count == 0 and
            (.mapping_paths_not_observed_in_record | length) == 2 and
            (.required_mapping_paths_not_observed_in_record | length) == 0
          ' "$audit_file" > /dev/null
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
            apply-adapter-map "$base/mes-optional-map.json" "$base/mes-optional-record.json" > "$projection_file"
          jq -e '
            .status == "projection_created" and
            .skipped_optional_count == 2 and
            .explicitly_dropped_count == 0 and
            .projection.measurement.value_decimal == "72.4" and
            (.projection.measurement | has("unit_code") | not)
          ' "$projection_file" > /dev/null

      - name: Parse adapter contract schemas and fixtures
        run: |
          jq empty tools/omsi-manufacturing-validator/schema/adapter-map.schema.json
          jq empty tools/omsi-manufacturing-validator/schema/adapter-audit-report.schema.json
          jq empty tools/omsi-manufacturing-validator/schema/adapter-projection-report.schema.json
          jq empty tools/omsi-manufacturing-validator/schema/adapter-transform-vectors.schema.json
          jq empty tools/omsi-manufacturing-validator/schema/adapter-transform-vector-report.schema.json
          jq empty tools/omsi-manufacturing-validator/schema/provenance-manifest.schema.json
          jq empty docs/standards/omsi/adapters/0.1/TRANSFORM-VECTORS.json
          jq empty docs/standards/omsi/adapters/0.1/examples/mes-flat-map.json
          jq empty docs/standards/omsi/adapters/0.1/examples/mes-flat-record.json
          jq empty docs/standards/omsi/adapters/0.1/examples/qms-nested-map.json
          jq empty docs/standards/omsi/adapters/0.1/examples/qms-nested-record.json
          jq empty docs/standards/omsi/adapters/0.1/examples/mes-optional-map.json
          jq empty docs/standards/omsi/adapters/0.1/examples/mes-optional-record.json

      - name: Smoke-test verified provenance chain
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="docs/standards/omsi/adapters/0.1/examples"
          source_record="$base/qms-nested-record.json"
          adapter_map="$base/qms-nested-map.json"
          projection="$RUNNER_TEMP/omsi-projection.json"
          semantic_input="$RUNNER_TEMP/omsi-semantic-input.json"
          replay_envelope="$RUNNER_TEMP/omsi-replay-envelope.json"
          semantic_report="$RUNNER_TEMP/omsi-semantic-report.json"
          manifest="$RUNNER_TEMP/omsi-provenance-manifest.json"

          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
            apply-adapter-map "$adapter_map" "$source_record" > "$projection"
          jq '.projection' "$projection" > "$semantic_input"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
            create-envelope "$semantic_input" > "$replay_envelope"
          jq '.report' "$replay_envelope" > "$semantic_report"
          cargo run --manifest-path tools/omsi-manufacturing-validator/Cargo.toml -- \
            create-provenance-manifest "$source_record" "$adapter_map" "$projection" \
            "$semantic_input" "$semantic_report" "$replay_envelope" > "$manifest"
          jq -e '
            .manifest_contract == "omsi-manufacturing-provenance-manifest/0.1" and
            .status == "local_chain_consistent" and
            .authority == "local_consistency_only" and
            .digest_profile.algorithm == "sha256" and
            .digest_profile.scope == "exact_input_bytes" and
            .digest_profile.canonicalization == "none" and
            (.artifacts | length) == 6 and
            (.edges | length) == 5 and
            (.declared_transform_ids | sort) == ["qms-decimal-normalization/0.1", "qms-unit-code-crosswalk/0.1"] and
            ([.artifacts[].sha256 | test("^[0-9a-f]{64}$")] | all) and
            ([.artifacts[].byte_length | numbers] | length) == 6 and
            (.limitations | length) >= 5 and
            (has("signature") | not)
          ' "$manifest" > /dev/null

      - name: Clippy
        if: steps.source.outputs.present == 'true'
        run: cargo clippy --manifest-path tools/omsi-manufacturing-validator/Cargo.toml --all-targets -- -D warnings
