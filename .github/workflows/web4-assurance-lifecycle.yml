name: Web4 assurance lifecycle projection conformance

on:
  pull_request:
    paths:
      - "docs/security/WEB4_ASSURANCE_LIFECYCLE_PROJECTION_V0_1.md"
      - "docs/security/web4-assurance-lifecycle.*.v0.1.json"
      - "scripts/validate_web4_assurance_lifecycle.py"
      - "requirements-walp-test.txt"
      - ".github/workflows/web4-assurance-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-walp:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Set up pinned test-only Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned test-only schema dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-walp-test.txt
      - name: Validate WALP schema and lifecycle/applicability fixtures
        run: python scripts/validate_web4_assurance_lifecycle.py
