name: OMSI conformance seed
on:
  pull_request:
    paths:
      - 'tools/omsi-conformance/**'
      - '.github/workflows/omsi-conformance.yml'
  push:
    paths:
      - 'tools/omsi-conformance/**'
      - '.github/workflows/omsi-conformance.yml'
concurrency:
  group: omsi-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/omsi-conformance/requirements.txt
      - run: make -C tools/omsi-conformance schemas
      - run: make -C tools/omsi-conformance test
      - run: make -C tools/omsi-conformance field-service
      - run: make -C tools/omsi-conformance validate-fixtures
      - run: make -C tools/omsi-conformance interop
