name: SRQ-1 corpus contract

on:
  pull_request:
    paths:
      - ".github/workflows/srq-v1.yml"
      - "benchmarks/srq-v1/**"
      - "tools/srq-recovery-model/**"
      - "tools/srq-challenge-promotion-model/**"
      - "tools/srq-process-kill-model/**"
      - "docs/SOVEREIGN_RECOVERY_QUALIFICATION_V1.md"
      - "docs/SRQ_PROVENANCE_ATTESTATION_V1.md"
      - "docs/SRQ_PROCESS_KILL_MODEL_V1.md"
      - "docs/SRQ_SQLITE_TRANSACTION_BASELINE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  SRQ_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SRQ_EVENT_SHA: ${{ github.sha }}

jobs:
  validate-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source head
        # Immutable commit pin for actions/checkout v4.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact-head provenance
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          printf 'expected_source_sha=%s event_sha=%s actual_checkout_head=%s\n' "$SRQ_EXPECTED_SOURCE_SHA" "$SRQ_EVENT_SHA" "$actual_head"
          test "$actual_head" = "$SRQ_EXPECTED_SOURCE_SHA"

      - name: Install pinned Rust toolchain for the dependency-free model
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n benchmarks/srq-v1/validate.sh
          bash -n benchmarks/srq-v1/test-validator.sh
          bash -n benchmarks/srq-v1/validate-result.sh
          bash -n benchmarks/srq-v1/test-result-validator.sh
          bash -n benchmarks/srq-v1/evaluate-release.sh
          bash -n benchmarks/srq-v1/test-evaluate-release.sh
          bash -n benchmarks/srq-v1/install-pinned-gh.sh
          bash -n benchmarks/srq-v1/verify-attestation.sh
          bash -n benchmarks/srq-v1/test-verify-attestation.sh
          bash -n benchmarks/srq-v1/verify-evidence-bundle.sh
          bash -n benchmarks/srq-v1/test-verify-evidence-bundle.sh
          bash -n benchmarks/srq-v1/test-sqlite-promotion-reference.sh
          bash -n benchmarks/srq-v1/test-evaluate-attested-release.sh
          bash -n benchmarks/srq-v1/evaluate-attested-release.sh

      - name: Run bounded filesystem activation model
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-recovery-model-test.log"
          model_receipt="$RUNNER_TEMP/srq-update-004-model-result.json"
          command='cargo test --manifest-path tools/srq-recovery-model/Cargo.toml --locked'
          cargo test --manifest-path tools/srq-recovery-model/Cargo.toml --locked 2>&1 | tee "$model_log"
          # A green cargo exit is not enough if a required test disappears.
          grep -Fq 'test result: ok. 7 passed; 0 failed' "$model_log"
          grep -Fq 'tests::every_interruption_boundary_leaves_old_or_new_complete_generation ... ok' "$model_log"

          actual_head="$(git rev-parse HEAD)"
          evidence_sha="$(sha256sum "$model_log" | cut -d ' ' -f 1)"
          jq -n \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg command "$command" \
            --arg os "$(uname -sr)" \
            --arg architecture "$(uname -m)" \
            --arg toolchain "$(rustc --version)" \
            --arg evidence_sha "$evidence_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              scenario_id: "UPDATE-004",
              status: "PASS",
              reason: "The filesystem-backed model kept the previous or next complete generation across 100 injected checkpoint-return simulations at each of five activation boundaries (500 trials total). These are not process-kill or physical power-cut tests.",
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              execution: {
                tier: "model",
                steps_executed: true,
                command: $command,
                exit_code: 0,
                environment: {os: $os, architecture: $architecture, toolchain: $toolchain}
              },
              evidence: [{artifact: "srq-recovery-model-test.log", sha256: $evidence_sha, kind: "log"}],
              claim_ceiling: "abstract_model_only",
              non_claims: [
                "This is a filesystem-backed abstract model with synthetic generation payloads, not a production updater or bootloader.",
                "Checkpoint returns followed by reopen do not kill a process mid-syscall and are not equivalent to physical sudden-power-loss testing.",
                "No TUF signature policy, artifact provenance, signer/device identity, firmware root of trust, or TPM evidence is qualified.",
                "QEMU and physical activation scenarios remain unexecuted."
              ],
              fixture: false
            }' > "$model_receipt"

          bash benchmarks/srq-v1/validate-result.sh --evidence-root "$RUNNER_TEMP" "$model_receipt"

      - name: Run atomic challenge-promotion model
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-challenge-promotion-model-test.log"
          model_receipt="$RUNNER_TEMP/srq-evidence-003-model-result.json"
          command='cargo test --manifest-path tools/srq-challenge-promotion-model/Cargo.toml --locked'
          cargo test --manifest-path tools/srq-challenge-promotion-model/Cargo.toml --locked 2>&1 | tee "$model_log"
          # Protect the race/crash acceptance claims against accidental test deletion.
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$model_log"
          grep -Fq 'tests::sixty_four_concurrent_attempts_for_one_challenge_commit_exactly_once ... ok' "$model_log"
          grep -Fq 'tests::eight_independent_processes_share_one_challenge_commit ... ok' "$model_log"
          grep -Fq 'tests::interruption_boundaries_preserve_old_or_fully_promoted_state ... ok' "$model_log"

          actual_head="$(git rev-parse HEAD)"
          evidence_sha="$(sha256sum "$model_log" | cut -d ' ' -f 1)"
          jq -n \
            --arg expected "$SRQ_EXPECTED_SOURCE_SHA" \
            --arg event "$SRQ_EVENT_SHA" \
            --arg actual "$actual_head" \
            --arg command "$command" \
            --arg os "$(uname -sr)" \
            --arg architecture "$(uname -m)" \
            --arg toolchain "$(rustc --version)" \
            --arg evidence_sha "$evidence_sha" \
            '{
              schema_version: 1,
              profile_id: "SRQ-1",
              scenario_id: "EVIDENCE-003",
              status: "PASS",
              reason: "The Linux filesystem model serialized 64 concurrent worker threads and eight independent same-host processes so exactly one attempt consumed the challenge and promoted the next policy generation; 100 injected early-return checkpoint simulations preserved the previous or fully promoted state. These are not process-kill or physical power-cut tests.",
              source: {
                expected_source_sha: $expected,
                event_sha: $event,
                actual_checkout_sha: $actual,
                source_matches_expected: ($expected == $actual)
              },
              execution: {
                tier: "model",
                steps_executed: true,
                command: $command,
                exit_code: 0,
                environment: {os: $os, architecture: $architecture, toolchain: $toolchain}
              },
              evidence: [{artifact: "srq-challenge-promotion-model-test.log", sha256: $evidence_sha, kind: "log"}],
              claim_ceiling: "abstract_model_only",
              non_claims: [
                "This is a filesystem-backed contract model, not the production durable promotion database or policy gate.",
                "Linux flock serialization was tested with concurrent worker threads and separate child processes on one runner; cross-host or distributed locking is not qualified.",
                "Injected early returns on the runner filesystem do not emulate a process kill, kernel crash, or sudden physical power loss.",
                "No signer/device identity, trusted time, TUF metadata verification, TPM, firmware root of trust, QEMU or physical-device behavior is qualified."
              ],
              fixture: false
            }' > "$model_receipt"

          bash benchmarks/srq-v1/validate-result.sh --evidence-root "$RUNNER_TEMP" "$model_receipt"

      - name: Exercise real process-kill recovery at persistence boundaries
        shell: bash
        run: |
          set -euo pipefail
          model_log="$RUNNER_TEMP/srq-process-kill-model-test.log"
          cargo test --manifest-path tools/srq-process-kill-model/Cargo.toml --locked -- --nocapture 2>&1 | tee "$model_log"
          grep -Fq 'test result: ok. 3 passed; 0 failed' "$model_log"
          for checkpoint in after_temp_create during_temp_write after_temp_sync after_rename after_dir_sync; do
            grep -Fq "PASS: SIGKILL at $checkpoint recovered generation" "$model_log"
          done
          echo "PASS: child-process SIGKILL recovery model completed five persistence-boundary trials."
          echo "LIMIT: live-kernel process-kill test; not a kernel crash or physical power-loss test."

      - name: Exercise SQLite promotion transaction reference
        shell: bash
        run: |
          set -euo pipefail
          reference_log="$RUNNER_TEMP/srq-sqlite-promotion-reference.log"
          bash benchmarks/srq-v1/test-sqlite-promotion-reference.sh 2>&1 | tee "$reference_log"
          grep -Fq 'PASS: successful SQLite reference transaction commits policy, decision and challenge together' "$reference_log"
          grep -Fq 'PASS: stale-generation assertion rolls back policy, decision and challenge writes' "$reference_log"
          grep -Fq 'PASS: duplicate challenge replay is rejected with no partial state' "$reference_log"
          grep -Eq '^sqlite_version=[0-9]+[.][0-9]+([.][0-9]+)? journal_mode=wal synchronous=FULL cases=3$'
