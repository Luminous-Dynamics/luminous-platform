name: Workload profile schema

on:
  push:
    branches: [main]
    paths:
      - "schemas/workload-profile.schema.json"
      - "profiles/workloads/**"
      - "tools/validate_workload_profiles.py"
      - "tools/requirements-workload-validation.txt"
      - ".github/workflows/workload-profile-validation.yml"
  pull_request:
    paths:
      - "schemas/workload-profile.schema.json"
      - "profiles/workloads/**"
      - "tools/validate_workload_profiles.py"
      - "tools/requirements-workload-validation.txt"
      - ".github/workflows/workload-profile-validation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workload-profiles:
    name: Validate schema and fail-closed fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Immutable upstream release tags; update deliberately with reviewed changes.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check --no-input -r tools/requirements-workload-validation.txt

      - name: Validate example profiles and security-negative cases
        run: python tools/validate_workload_profiles.py
