[package]
name = "community-hardware-receipt-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline, fail-closed verifier for Luminous community hardware test receipts"

[[bin]]
name = "community-hardware-receipt-verify"
path = "src/main.rs"

[dependencies]
hex = "=0.4.3"
jsonschema = { version = "=0.59.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
