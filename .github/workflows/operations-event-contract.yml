name: Operations Event Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/operations-event-v1/**"
      - "contracts/holochain-attestation-v1/**"
      - ".github/workflows/operations-event-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/operations-event-v1/**"
      - ".github/workflows/operations-event-contract.yml"

permissions:
  contents: read

concurrency:
  group: operations-event-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/operations-event-contract-venv"

      - name: Install pinned schema validator
        run: "$RUNNER_TEMP/operations-event-contract-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir -r contracts/operations-event-v1/requirements.txt

      - name: Validate schemas, fixtures, adapter model, and SQLite fault-injection cases
        run: "$RUNNER_TEMP/operations-event-contract-venv/bin/python" -m unittest discover -s contracts/operations-event-v1/tests -p 'test_*.py' -v

      - name: Validate Holochain attestation share-package schema and adversarial fixtures
        run: "$RUNNER_TEMP/operations-event-contract-venv/bin/python" -m unittest discover -s contracts/holochain-attestation-v1/tests -p 'test_*.py' -v

      - name: Write bounded qualification summary
        if: success()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Operations Event Contract"
            echo "- Tested source revision: $SOURCE_SHA"
            echo "- This pass covers the Operations Event contract/model tests and the Holochain attestation share-package schema/adversarial tests."
            echo "- It does not qualify a live ConnectWise adapter, PostgreSQL implementation or database tenant isolation, Holochain integrity zome/multi-agent DHT behavior, identity or membership binding, evidence-signature verification, hardware power-loss behavior, or any remote-action path."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm checkout stayed unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"
