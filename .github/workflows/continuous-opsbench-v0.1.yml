name: continuous opsbench v0.1

on:
  pull_request:
    paths:
      - "research/continuous-opsbench-v0.1/**"
      - ".github/workflows/continuous-opsbench-v0.1.yml"
  push:
    branches: [main]
    paths:
      - "research/continuous-opsbench-v0.1/**"
      - ".github/workflows/continuous-opsbench-v0.1.yml"

permissions:
  contents: read

concurrency:
  group: continuous-opsbench-v0.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuous-evaluator:
    name: Continuous lifecycle evaluator and adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup override set 1.96.0
      - name: Validate benchmark schemas and safety-filter fixtures
        run: |
          set -euo pipefail
          python3 -m venv /tmp/opsbench-schema-venv
          /tmp/opsbench-schema-venv/bin/python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
          /tmp/opsbench-schema-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/continuous-opsbench-v0.1")
          request_schema_path = root / "predictive-safety-filter-request.schema.json"
          appraisal_schema_path = root / "predictive-safety-filter-appraisal.schema.json"
          request_schema = json.loads(request_schema_path.read_text(encoding="utf-8"))
          appraisal_schema = json.loads(appraisal_schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(request_schema)
          Draft202012Validator.check_schema(appraisal_schema)
          Draft202012Validator(request_schema).validate(json.loads(
              (root / "examples/predictive-safety-filter-request.example.json").read_text(encoding="utf-8")
          ))
          Draft202012Validator(appraisal_schema).validate(json.loads(
              (root / "examples/predictive-safety-filter-appraisal.example.json").read_text(encoding="utf-8")
          ))
          print("predictive safety-filter schemas meta-validate; request/appraisal fixtures conform")
          PY
      - name: Run dependency-locked tests
        run: cargo test --manifest-path research/continuous-opsbench-v0.1/Cargo.toml --locked
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path research/continuous-opsbench-v0.1/Cargo.toml --locked -- -D warnings
