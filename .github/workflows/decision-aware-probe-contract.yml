name: Decision-aware Probe Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "integrations/decision-aware-probes-v0.1/**"
      - ".github/workflows/decision-aware-probe-contract.yml"

permissions:
  contents: read

concurrency:
  group: decision-aware-probe-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-semantic-contract:
    name: Rust schema and semantic fixture audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.90.0
          rustc --version
          cargo --version

      - name: Generate and fingerprint pinned dependency graph
        working-directory: integrations/decision-aware-probes-v0.1/validator
        run: |
          cargo generate-lockfile
          sha256sum Cargo.lock > cargo-lockfile.sha256
          cargo metadata --format-version 1 --locked > cargo-metadata.json

      - name: Publish dependency lock and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-aware-probe-lock-${{ github.event.pull_request.head.sha }}
          path: |
            integrations/decision-aware-probes-v0.1/validator/Cargo.lock
            integrations/decision-aware-probes-v0.1/validator/cargo-lockfile.sha256
            integrations/decision-aware-probes-v0.1/validator/cargo-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path integrations/decision-aware-probes-v0.1/validator/Cargo.toml --all -- --check

      - name: Run Draft 2020-12 and semantic fixture audit
        run: cargo test --manifest-path integrations/decision-aware-probes-v0.1/validator/Cargo.toml --all-targets --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path integrations/decision-aware-probes-v0.1/validator/Cargo.toml --all-targets --locked -- -D warnings

      - name: Record exact-head validation provenance
        if: always()
        run: |
          {
            echo "## Decision-aware probe contract"
            echo "- Head: ${{ github.event.pull_request.head.sha }}"
            echo "- Rust: $(rustc --version 2>/dev/null || echo unavailable)"
            echo "- Cargo: $(cargo --version 2>/dev/null || echo unavailable)"
            if [ -f integrations/decision-aware-probes-v0.1/validator/cargo-lockfile.sha256 ]; then
              echo "- Cargo.lock: $(cat integrations/decision-aware-probes-v0.1/validator/cargo-lockfile.sha256)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
