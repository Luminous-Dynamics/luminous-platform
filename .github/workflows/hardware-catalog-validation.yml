name: Hardware catalog validation

on:
  pull_request:
    paths:
      - "hardware/catalog.yaml"
      - "scripts/validate_hardware_catalog.rb"
      - ".github/workflows/hardware-catalog-validation.yml"
  push:
    branches:
      - main
    paths:
      - "hardware/catalog.yaml"
      - "scripts/validate_hardware_catalog.rb"
      - ".github/workflows/hardware-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    name: Parse and validate hardware evidence schema
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate YAML and catalog invariants
        run: ruby scripts/validate_hardware_catalog.rb hardware/catalog.yaml
