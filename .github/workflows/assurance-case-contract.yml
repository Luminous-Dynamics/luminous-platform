name: Executable assurance case contract

on:
  pull_request:
    paths:
      - ".github/workflows/assurance-case-contract.yml"
      - "docs/assurance/assurance-case/**"
      - "tools/assurance-case-contract/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/assurance-case-contract.yml"
      - "docs/assurance/assurance-case/**"
      - "tools/assurance-case-contract/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path tools/assurance-case-contract/Cargo.toml -- --check
      - name: Assurance case contract tests
        run: cargo test --manifest-path tools/assurance-case-contract/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path tools/assurance-case-contract/Cargo.toml --all-targets -- -D warnings
