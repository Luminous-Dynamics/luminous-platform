[package]
name = "connectivity-outage-discrete-sim"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Deterministic synthetic WAN outage and recovery trace simulator"

[dependencies]
connectivity-task-outcome-core = { path = "../connectivity-task-outcome-core" }
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "connectivity-outage-discrete-sim"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
