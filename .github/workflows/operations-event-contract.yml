name: Operations Event and Holochain Attestation Contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/operations-event-v1/**"
      - "contracts/holochain-attestation-v1/**"
      - "scripts/run_unittest_suite.py"
      - "scripts/tests/**"
      - ".github/workflows/operations-event-contract.yml"
  push:
    branches: ["**"]
    paths:
      - "contracts/operations-event-v1/**"
      - "contracts/holochain-attestation-v1/**"
      - "scripts/run_unittest_suite.py"
      - "scripts/tests/**"
      - ".github/workflows/operations-event-contract.yml"

permissions:
  contents: read

concurrency:
  group: operations-event-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust_contracts:
    name: Rust contract qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/luminous_ops_test
      APP_DATABASE_URL: postgres://luminous_ops_runtime_test:runtime-test-password@localhost:5432/luminous_ops_test
      CARGO_TERM_COLOR: never
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luminous_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luminous_ops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Validate Operations Event Contract V1 (Rust)
        id: operations_event
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/operations-event-v1"
          log="$RUNNER_TEMP/operations-event-rust-tests.log"
          cp -a contracts/operations-event-v1 "$package"
          cargo +1.96.0 test --manifest-path "$package/rust/Cargo.toml" --all-targets 2>&1 | tee "$log"
          count="$(awk '/^test result:/ { for (i = 1; i <= NF; i++) if ($i == "passed;") total += $(i - 1) } END { print total + 0 }' "$log")"
          if [[ -z "$count" || "$count" -lt 30 ]]; then
            echo "::error::Rust Operations Event contract must execute at least 30 tests; observed $count."
            exit 1
          fi
          echo "test_count=$count" >> "$GITHUB_OUTPUT"

      - name: Validate Holochain Attestation Share Package V1 (Rust)
        id: holochain_attestation
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/holochain-attestation-v1"
          log="$RUNNER_TEMP/holochain-attestation-rust-tests.log"
          cp -a contracts/holochain-attestation-v1 "$package"
          cargo +1.96.0 test --manifest-path "$package/rust/Cargo.toml" --all-targets 2>&1 | tee "$log"
          count="$(awk '/^test result:/ { for (i = 1; i <= NF; i++) if ($i == "passed;") total += $(i - 1) } END { print total + 0 }' "$log")"
          if [[ -z "$count" || "$count" -lt 20 ]]; then
            echo "::error::Rust Holochain attestation suite must execute at least 20 tests; observed $count."
            exit 1
          fi
          echo "test_count=$count" >> "$GITHUB_OUTPUT"

      - name: Export resolved Rust dependency lock candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: operations-event-cargo-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/operations-event-v1/rust/Cargo.lock
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Confirm checkout stayed unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Write bounded Rust qualification summary
        if: success()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPERATIONS_TESTS: ${{ steps.operations_event.outputs.test_count }}
          HOLOCHAIN_TESTS: ${{ steps.holochain_attestation.outputs.test_count }}
        run: |
          {
            echo "## Rust contract qualification"
            echo "- Tested source revision: $SOURCE_SHA"
            echo "- Operations Event Contract V1 Rust tests executed: $OPERATIONS_TESTS"
            echo "- Holochain Attestation Share Package V1 Rust tests executed: $HOLOCHAIN_TESTS"
            echo "- This tests schema and trusted-context binding logic only. It does not qualify PostgreSQL isolation, crash recovery, ConnectWise authentication, Holochain integrity-zome/multi-agent DHT behavior, cryptographic evidence verification, or remote execution."
          } >> "$GITHUB_STEP_SUMMARY"

  reference_model_research:
    name: Non-production Python reference-model research
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python for reference-model tests only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.12"

      - name: Create isolated research-test environment
        run: python3 -m venv "$RUNNER_TEMP/operations-reference-venv"

      - name: Install research-only schema validator
        run: >-
          "$RUNNER_TEMP/operations-reference-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir -r contracts/operations-event-v1/requirements.txt

      - name: Run reference-model research tests
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/operations-reference-venv/bin/python"
          "$python" scripts/run_unittest_suite.py scripts/tests --minimum-tests 6
          "$python" scripts/run_unittest_suite.py contracts/operations-event-v1/tests --minimum-tests 1

      - name: Record research-only boundary
        if: success()
        run: |
          {
            echo "## Non-production reference-model research"
            echo "- These Python tests exercise synthetic reference models and a fail-closed test runner; they are not production services, do not authorize any side effect, and do not substitute for the Rust contract qualification job."
          } >> "$GITHUB_STEP_SUMMARY"
