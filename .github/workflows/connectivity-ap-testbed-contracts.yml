name: connectivity-ap-testbed-contracts

on:
  pull_request:
    paths:
      - "tools/connectivity-ap-testbed-contracts/**"
      - "schemas/connectivity-ap-testbed-manifest-v1.schema.json"
      - "examples/connectivity-ap-testbed-manifest-planned-v1.json"
      - "docs/CONNECTIVITY_AP_MEASUREMENT_PROTOCOL_V1.md"
      - ".github/workflows/connectivity-ap-testbed-contracts.yml"
  push:
    branches: [main, feat/connectivity-ap-measurement-contract-v1]
    paths:
      - "tools/connectivity-ap-testbed-contracts/**"
      - "schemas/connectivity-ap-testbed-manifest-v1.schema.json"
      - "examples/connectivity-ap-testbed-manifest-planned-v1.json"
      - "docs/CONNECTIVITY_AP_MEASUREMENT_PROTOCOL_V1.md"
      - ".github/workflows/connectivity-ap-testbed-contracts.yml"

permissions:
  contents: read

jobs:
  ap-testbed-contract:
    name: Validate AP/client testbed evidence manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/connectivity-ap-testbed-contracts/Cargo.toml -- --check
      - name: Test contracts and fail-closed stage gates
        run: cargo test --manifest-path tools/connectivity-ap-testbed-contracts/Cargo.toml --all-targets
      - name: Lint with warnings denied
        run: cargo clippy --manifest-path tools/connectivity-ap-testbed-contracts/Cargo.toml --all-targets -- -D warnings
      - name: Validate planned fixture
        run: |
          cargo run --manifest-path tools/connectivity-ap-testbed-contracts/Cargo.toml --bin connectivity-ap-testbed-verify -- \
            schemas/connectivity-ap-testbed-manifest-v1.schema.json \
            examples/connectivity-ap-testbed-manifest-planned-v1.json
