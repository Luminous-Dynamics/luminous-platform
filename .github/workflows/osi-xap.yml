name: OSI XAP matrix and scenario validation

on:
  pull_request:
    paths:
      - "docs/security/osi-xap-*"
      - "scripts/validate_osi_xap.py"
      - "requirements-osi-xap-test.txt"
      - ".github/workflows/osi-xap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-osi-xap:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Set up pinned Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install pinned test-only validator dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-osi-xap-test.txt
      - name: Validate OSI/XAP matrix and scenarios
        run: python scripts/validate_osi_xap.py
