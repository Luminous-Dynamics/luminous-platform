name: Reusable Security Audit

on:
  workflow_call:
    inputs:
      subject_sha:
        description: Exact caller repository commit to audit.
        required: true
        type: string
      audit_engine_sha:
        description: Caller-declared audit workflow revision; external verifier must cross-check the actual uses reference.
        required: true
        type: string
      audit_rust:
        description: Audit Rust lockfiles and map manifests to workspace lockfiles.
        required: false
        default: false
        type: boolean
      audit_node:
        description: Audit all tracked npm package-lock and shrinkwrap lockfiles.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  workflow-security:
    name: GitHub Actions workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact audit subject
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false
      - name: Assert exact checkout identity
        id: subject
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Initialize workflow evidence
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/workflows
          {
            echo "schema=luminous.security-audit.workflow-receipt.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "subject_sha=$(git rev-parse HEAD)"
            echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "zizmor_status=INCOMPLETE"
            echo "actionlint_status=INCOMPLETE"
            echo "secret_scan_status=INCOMPLETE"
            echo "secret_scan_reason=not_started"
            echo "secret_scanner_version=v8.30.1"
            echo "secret_scan_exit_code=NOT_RUN"
            echo "secret_config_sha256=missing"
            echo "secret_raw_report_sha256=missing"
            echo "secret_report_sha256=missing"
            echo "secret_finding_count=unknown"
          } > security-audit-results/workflows/summary.txt
          cat > security-audit-results/workflows/gitleaks-sanitized.json <<'JSON'
          {"schema":"luminous.security-audit.gitleaks-summary.v1","repository":"unknown","subject_sha":"unknown","scanner_version":"v8.30.1","config_sha256":"missing","status":"INCOMPLETE","reason":"not_started","finding_count":null,"findings":[]}
          JSON
          echo "engine_identity_status=INCOMPLETE" >> security-audit-results/workflows/summary.txt
          if [[ ! "$AUDIT_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sed -i 's/^zizmor_status=.*/zizmor_status=FAIL/' security-audit-results/workflows/summary.txt
            echo "incomplete_reason=invalid_audit_engine_sha" >> security-audit-results/workflows/summary.txt
            exit 2
          fi

      - name: Verify declared audit engine identity
        id: engine_identity
        shell: bash
        env:
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          EVENT_SHA: ${{ github.sha }}
          AUDITED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          engine = os.environ["AUDIT_ENGINE_SHA"]
          subject = os.environ["SUBJECT_SHA"]
          event_sha = os.environ["EVENT_SHA"]
          repository = os.environ["AUDITED_REPOSITORY"]
          summary = Path("security-audit-results/workflows/summary.txt")

          def set_receipt_value(key, value):
              lines = summary.read_text(encoding="utf-8").splitlines()
              prefix = f"{key}="
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"receipt field {key} has {len(matches)} entries")
              lines[matches[0]] = f"{key}={value}"
              summary.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def fail(reason):
              set_receipt_value("engine_identity_status", "FAIL")
              with summary.open("a", encoding="utf-8") as receipt:
                  receipt.write(f"engine_identity_reason={reason}\n")
              print(f"FAIL: {reason}", file=sys.stderr)
              raise SystemExit(1)

          if not re.fullmatch(r"[0-9a-f]{40}", engine):
              fail("invalid_engine_sha")
          if not re.fullmatch(r"[0-9a-f]{40}", subject):
              fail("invalid_subject_sha")

          if repository == "Luminous-Dynamics/luminous-platform":
              # The platform audits its local reusable workflow from the
              # event commit (including the PR merge ref), while it scans the
              # PR head separately as subject_sha.
              caller = Path(".github/workflows/security-audit-self.yml")
              if not caller.is_file():
                  fail("platform_self_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              local_uses = re.findall(
                  r"^\s*uses:\s*\./\.github/workflows/security-audit\.yml\s*$",
                  text, re.MULTILINE
              )
              if len(local_uses) != 1:
                  fail("platform_local_engine_reference_missing_or_ambiguous")
              if engine != event_sha:
                  fail("platform_local_engine_sha_does_not_match_event_sha")
          else:
              caller = Path(".github/workflows/security-audit.yml")
              if not caller.is_file():
                  fail("caller_security_workflow_missing")
              text = caller.read_text(encoding="utf-8")
              refs = re.findall(
                  r"^\s*uses:\s*Luminous-Dynamics/luminous-platform/\.github/workflows/security-audit\.yml@([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              declared = re.findall(
                  r"^\s*audit_engine_sha:\s*([0-9a-f]{40})\s*$",
                  text, re.MULTILINE
              )
              if len(refs) != 1:
                  fail("immutable_shared_workflow_reference_missing_or_ambiguous")
              if len(declared) != 1:
                  fail("declared_engine_sha_missing_or_ambiguous")
              if refs[0] != engine or declared[0] != engine:
                  fail("caller_reference_and_engine_sha_mismatch")

          set_receipt_value("engine_identity_status", "PASS")
          with summary.open("a", encoding="utf-8") as receipt:
              receipt.write(f"engine_identity_checked_sha={engine}\n")
          print("PASS: declared audit engine identity matches the caller reference")
          PY
      - name: Audit workflow definitions
        id: zizmor
        if: always() && steps.checkout.outcome == 'success' && steps.subject.outcome == 'success'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/
          advanced-security: false
          annotations: true
          online-audits: true
          persona: auditor
          version: v1.30.1
      - name: Validate audit workflow syntax
        id: actionlint
        if: always() && steps.checkout.outcome == 'success' && steps.subject.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          report="security-audit-results/workflows/actionlint.txt"
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint_1.7.12"
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          shellcheck_dir="$RUNNER_TEMP/shellcheck-v0.11.0"
          mkdir -p security-audit-results/workflows "$tool_dir" "$shellcheck_dir"
          echo "version=v1.7.12" > "$report"
          echo "expected_archive_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" >> "$report"
          echo "shellcheck_version_expected=v0.11.0" >> "$report"
          echo "shellcheck_archive_sha256_expected=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" >> "$report"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          if ! curl -fsSL --retry 3 -o "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"; then
            echo "shellcheck_setup_status=FAIL reason=download_failed" >> "$report"
            exit 1
          fi
          if ! echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" | sha256sum -c -; then
            echo "shellcheck_setup_status=FAIL reason=checksum_mismatch" >> "$report"
            exit 1
          fi
          if ! tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck; then
            echo "shellcheck_setup_status=FAIL reason=extract_failed" >> "$report"
            exit 1
          fi
          shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          if ! "$shellcheck" --version >> "$report" 2>&1; then
            echo "shellcheck_setup_status=FAIL reason=unusable_binary" >> "$report"
            exit 1
          fi
          echo "shellcheck_setup_status=PASS" >> "$report"
          binary="$tool_dir/actionlint"
          mapfile -d '' -t audit_workflows < <(
            git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | LC_ALL=C sort -z
          )
          if [[ "${#audit_workflows[@]}" -eq 0 ]]; then
            echo "FAIL: no tracked GitHub Actions workflow YAML files found" >> "$report"
            exit 2
          fi
          echo "workflow_file_count=${#audit_workflows[@]}" >> "$report"
          "$binary" -version >> "$report" 2>&1
          if "$binary" -shellcheck="$shellcheck" "${audit_workflows[@]}" >> "$report" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "actionlint_exit_code=$rc" >> "$report"
          cat "$report"
          exit "$rc"
      - name: Scan audited source for secrets with pinned Gitleaks
        id: gitleaks
        if: always() && steps.checkout.outcome == 'success' && steps.subject.outcome == 'success' && steps.engine_identity.outcome == 'success'
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -uo pipefail
          summary="security-audit-results/workflows/summary.txt"
          safe_report="security-audit-results/workflows/gitleaks-sanitized.json"
          raw_report="$RUNNER_TEMP/gitleaks-raw.json"
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks_8.30.1"
          home_dir="$RUNNER_TEMP/gitleaks-home"
          source_dir="$RUNNER_TEMP/gitleaks-source"
          config="$RUNNER_TEMP/luminous-gitleaks.toml"
          empty_ignore="$RUNNER_TEMP/empty-gitleaksignore"
          rm -rf -- "$source_dir" "$tool_dir" "$home_dir"
          mkdir -p "$tool_dir" "$home_dir" "$source_dir"
          set_field() {
            key="$1"; value="$2"
            if grep -q "^$key=" "$summary"; then sed -i "s#^$key=.*#$key=$value#" "$summary"; else printf '%s=%s\n' "$key" "$value" >> "$summary"; fi
          }
          incomplete() {
            reason="$1"; raw_sha="missing"; config_sha="missing"
            if [[ -f "$raw_report" ]]; then raw_sha="$(sha256sum "$raw_report" | cut -d' ' -f1)"; fi
            if [[ -f "$config" ]]; then config_sha="$(sha256sum "$config" | cut -d' ' -f1)"; fi
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg reason "$reason" '{schema:"luminous.security-audit.gitleaks-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",config_sha256:$config,source_file_count:null,source_inventory_sha256:"missing",status:"INCOMPLETE",reason:$reason,finding_count:null,findings:[]}' > "$safe_report"
            set_field secret_scan_status INCOMPLETE
            set_field secret_scan_reason "$reason"
            set_field secret_scan_exit_code NOT_RUN
            set_field secret_config_sha256 "$config_sha"
            set_field secret_raw_report_sha256 "$raw_sha"
            set_field secret_source_file_count unknown
            set_field secret_source_inventory_sha256 missing
            set_field secret_finding_count unknown
            set_field secret_report_sha256 "$(sha256sum "$safe_report" | cut -d' ' -f1)"
          }
          cat > "$config" <<'TOML'
          title = "Luminous trusted Gitleaks defaults"
          [extend]
          useDefault = true
          TOML
          : > "$empty_ignore"
          config_sha="$(sha256sum "$config" | cut -d' ' -f1)"
          set_field secret_config_sha256 "$config_sha"
          if ! curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"; then incomplete gitleaks_download_failed; exit 0; fi
          if ! echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c - >/dev/null 2>&1; then incomplete gitleaks_checksum_mismatch; exit 0; fi
          if ! tar -xzf "$archive" -C "$tool_dir" gitleaks; then incomplete gitleaks_extract_failed; exit 0; fi
          binary="$tool_dir/gitleaks"
          if ! "$binary" version > "$RUNNER_TEMP/gitleaks-version.txt" 2>&1; then incomplete gitleaks_binary_unusable; exit 0; fi

          # Prove the tracked-file snapshot is not affected by repository
          # export-ignore rules. git archive is intentionally not used below:
          # .gitattributes is controlled by the subject and can hide tracked files.
          fixture="$RUNNER_TEMP/gitleaks-export-ignore-fixture"
          fixture_snapshot="$RUNNER_TEMP/gitleaks-export-ignore-snapshot"
          fixture_paths="$RUNNER_TEMP/gitleaks-export-ignore-paths.nul"
          rm -rf -- "$fixture" "$fixture_snapshot"
          mkdir -p "$fixture" "$fixture_snapshot"
          if ! git init -q "$fixture" \
            || ! git -C "$fixture" config user.name "Security Audit Fixture" \
            || ! git -C "$fixture" config user.email "security-audit-fixture@invalid.example"; then
            incomplete tracked_snapshot_fixture_setup_failed; exit 0
          fi
          printf '%s\n' 'secret-fixture.txt export-ignore' > "$fixture/.gitattributes"
          printf '%s\n' 'TRACKED_FILE_MUST_REMAIN_SCANNABLE' > "$fixture/secret-fixture.txt"
          if ! git -C "$fixture" add .gitattributes secret-fixture.txt \
            || ! git -C "$fixture" commit -qm "tracked snapshot fixture" \
            || ! git -C "$fixture" ls-files -z --cached > "$fixture_paths"; then
            incomplete tracked_snapshot_fixture_setup_failed; exit 0
          fi
          if ! (cd "$fixture" && tar --null --verbatim-files-from --no-recursion --files-from="$fixture_paths" -cf -) \
            | tar -xf - -C "$fixture_snapshot"; then
            incomplete tracked_snapshot_fixture_copy_failed; exit 0
          fi
          if [[ ! -f "$fixture_snapshot/secret-fixture.txt" ]]; then
            incomplete tracked_snapshot_export_ignore_bypass; exit 0
          fi

          # Snapshot tracked worktree paths from the checked-out exact subject.
          # Exclude only the allow-listed gitlink directory; its files are added
          # from a separately verified checkout below. NUL delimiters preserve
          # unusual path names and --no-recursion prevents following directories.
          root_paths="$RUNNER_TEMP/gitleaks-root-paths.nul"
          if ! git ls-files -z --cached > "$root_paths"; then incomplete tracked_source_inventory_failed; exit 0; fi
          if ! python3 - "$root_paths" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          entries = [item for item in path.read_bytes().split(bytes([0])) if item and item != b"mycelix-health"]
          entries.sort()
          path.write_bytes(bytes([0]).join(entries) + (bytes([0]) if entries else b""))
          PY
          then
            incomplete tracked_source_inventory_failed; exit 0
          fi
          if ! (tar --null --verbatim-files-from --no-recursion --files-from="$root_paths" -cf -) \
            | tar -xf - -C "$source_dir"; then incomplete tracked_source_snapshot_failed; exit 0; fi
          root_links="$(git ls-files --stage | awk '$1 == "160000" {n++} END {print n+0}')"
          if [[ -f .gitmodules ]]; then
            urls="$(git config -f .gitmodules --get-regexp '^submodule[.].*[.]url$' || true)"
            paths="$(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path$' || true)"
            if [[ "$root_links" -ne 1 || ( "$urls" != "submodule.mycelix-health.url https://github.com/Luminous-Dynamics/mycelix-health" && "$urls" != "submodule.mycelix-health.url https://github.com/Luminous-Dynamics/mycelix-health.git" ) || "$paths" != "submodule.mycelix-health.path mycelix-health" ]]; then incomplete submodule_inventory_not_allowlisted; exit 0; fi
            expected="$(git ls-files --stage -- mycelix-health | awk '$1 == "160000" {print $2}')"
            if [[ -z "$expected" ]]; then incomplete submodule_gitlink_missing; exit 0; fi
            if ! git submodule update --init mycelix-health; then incomplete submodule_checkout_failed; exit 0; fi
            actual="$(git -C mycelix-health rev-parse HEAD 2>/dev/null || true)"
            if [[ "$actual" != "$expected" ]]; then incomplete submodule_head_mismatch; exit 0; fi
            nested="$(git -C mycelix-health ls-files --stage | awk '$1 == "160000" {n++} END {print n+0}')"
            if [[ "$nested" -gt 0 || -f mycelix-health/.gitmodules ]]; then incomplete nested_submodule_not_audited; exit 0; fi
            mkdir -p "$source_dir/mycelix-health"
            submodule_paths="$RUNNER_TEMP/gitleaks-submodule-paths.nul"
            if ! git -C mycelix-health ls-files -z --cached > "$submodule_paths"; then incomplete submodule_source_inventory_failed; exit 0; fi
            if ! (cd mycelix-health && tar --null --verbatim-files-from --no-recursion --files-from="$submodule_paths" -cf -) \
              | tar -xf - -C "$source_dir/mycelix-health"; then incomplete submodule_tracked_snapshot_failed; exit 0; fi
          elif [[ "$root_links" -ne 0 ]]; then incomplete gitlink_without_gitmodules; exit 0; fi

          source_inventory="$RUNNER_TEMP/gitleaks-source-inventory.nul"
          if ! (cd "$source_dir" && find . -mindepth 1 \\( -type f -o -type l \\) -printf '%P\0' | LC_ALL=C sort -z) > "$source_inventory"; then
            incomplete source_inventory_generation_failed; exit 0
          fi
          source_file_count="$(python3 - "$source_inventory" <<'PY'
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          print(sum(1 for item in raw.split(bytes([0])) if item))
          PY
          )"
          source_inventory_sha="$(sha256sum "$source_inventory" | cut -d' ' -f1)"
          if [[ ! "$source_file_count" =~ ^[0-9]+$ || ! "$source_inventory_sha" =~ ^[0-9a-f]{64}$ || "$source_file_count" -eq 0 ]]; then
            incomplete source_inventory_invalid; exit 0
          fi
          set_field secret_source_file_count "$source_file_count"
          set_field secret_source_inventory_sha256 "$source_inventory_sha"

          rc=0
          if env -i PATH="$PATH" HOME="$home_dir" "$binary" dir "$source_dir" --config "$config" --gitleaks-ignore-path "$empty_ignore" --redact=100 --no-banner --log-level error --report-format json --report-path "$raw_report" --timeout 1800 > /dev/null 2> "$RUNNER_TEMP/gitleaks-scanner.log"; then rc=0; else rc=$?; fi
          set_field secret_scan_exit_code "$rc"
          if [[ ! -f "$raw_report" ]] || ! jq -e 'type == "array" and all(.[]; type == "object" and (.RuleID | type == "string") and (.File | type == "string") and (.StartLine | type == "number") and (.EndLine | type == "number"))' "$raw_report" >/dev/null 2>&1; then incomplete gitleaks_report_missing_or_invalid; exit 0; fi
          raw_sha="$(sha256sum "$raw_report" | cut -d' ' -f1)"
          finding_count="$(jq -er 'length' "$raw_report" 2>/dev/null || echo unknown)"
          if [[ ! "$finding_count" =~ ^[0-9]+$ ]]; then incomplete gitleaks_report_count_invalid; exit 0; fi
          if [[ "$finding_count" -gt 0 ]]; then scan_status=FAIL; scan_reason=secret_findings_detected; elif [[ "$rc" -ne 0 ]]; then scan_status=INCOMPLETE; scan_reason=gitleaks_nonzero_without_findings; else scan_status=PASS; scan_reason=none; fi
          if ! jq --arg repository "$GITHUB_REPOSITORY" --arg subject "$SUBJECT_SHA" --arg config "$config_sha" --arg source_inventory "$source_inventory_sha" --argjson source_file_count "$source_file_count" --arg status "$scan_status" --arg reason "$scan_reason" --argjson count "$finding_count" '{schema:"luminous.security-audit.gitleaks-summary.v1",repository:$repository,subject_sha:$subject,scanner_version:"v8.30.1",config_sha256:$config,source_file_count:$source_file_count,source_inventory_sha256:$source_inventory,status:$status,reason:$reason,finding_count:$count,findings:map({rule_id:.RuleID,file:.File,start_line:.StartLine,end_line:.EndLine})}' "$raw_report" > "$safe_report"; then incomplete gitleaks_sanitization_failed; exit 0; fi
          set_field secret_scan_status "$scan_status"
          set_field secret_scan_reason "$scan_reason"
          set_field secret_scanner_version v8.30.1
          set_field secret_scan_exit_code "$rc"
          set_field secret_config_sha256 "$config_sha"
          set_field secret_raw_report_sha256 "$raw_sha"
          set_field secret_source_file_count "$source_file_count"
          set_field secret_source_inventory_sha256 "$source_inventory_sha"
          set_field secret_finding_count "$finding_count"
          set_field secret_report_sha256 "$(sha256sum "$safe_report" | cut -d' ' -f1)"

      - name: Preserve workflow audit output
        if: always()
        shell: bash
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          AUDIT_ENGINE_SHA: ${{ inputs.audit_engine_sha }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          set -euo pipefail
          mkdir -p security-audit-results/workflows
          summary="security-audit-results/workflows/summary.txt"
          if [[ ! -f "$summary" ]]; then
            {
              echo "schema=luminous.security-audit.workflow-receipt.v1"
              echo "repository=${GITHUB_REPOSITORY}"
              echo "subject_sha=$SUBJECT_SHA"
              echo "caller_workflow_ref=${GITHUB_WORKFLOW_REF}"
              echo "caller_workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
              echo "declared_audit_engine_sha=$AUDIT_ENGINE_SHA"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
              echo "zizmor_status=INCOMPLETE"
              echo "actionlint_status=INCOMPLETE"
              echo "secret_scan_status=INCOMPLETE"
              echo "secret_scan_reason=checkout_or_scan_step_not_completed"
              echo "secret_scanner_version=v8.30.1"
              echo "secret_scan_exit_code=NOT_RUN"
              echo "secret_config_sha256=missing"
              echo "secret_raw_report_sha256=missing"
              echo "secret_report_sha256=missing"
              echo "secret_finding_count=unknown"
              echo "incomplete_reason=checkout_or_receipt_initialization_failed"
            } > "$summary"
          fi
          secret_safe="security-audit-results/workflows/gitleaks-sanitized.json"
          if [[ ! -f "$secret_safe" ]]; then
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg subject "${SUBJECT_SHA:-unknown}" '{schema:"luminous.security-audit.gitleaks-summary.v1", repository:$repository, subject_sha:$subject, scanner_version:"v8.30.1", config_sha256:"missing", status:"INCOMPLETE", reason:"secret_scan_step_not_completed", finding_count:null, findings:[]}' > "$secret_safe"
          fi
          safe_digest="$(sha256sum "$secret_safe" | cut -d' ' -f1)"
          safe_digest_fields="$(grep -c '^secret_report_sha256=' "$summary" || true)"
          if [[ "$safe_digest_fields" -eq 1 ]]; then
            sed -i "s#^secret_report_sha256=.*#secret_report_sha256=$safe_digest#" "$summary"
          elif [[ "$safe_digest_fields" -eq 0 ]]; then
            echo "secret_report_sha256=$safe_digest" >> "$summary"
          else
            echo "receipt_error=duplicate_secret_report_digest_fields" >> "$summary"
          fi
          report="$RUNNER_TEMP/zizmor"
          destination="security-audit-results/workflows/zizmor.txt"
          if [[ -f "$report" ]]; then
            cp "$report" "$destination"
            report_sha256="$(sha256sum "$destination" | cut -d' ' -f1)"
            if [[ "${ZIZMOR_OUTCOME:-unknown}" == "success" ]]; then
              sed -i 's/^zizmor_status=.*/zizmor_status=PASS/' security-audit-results/workflows/summary.txt
            else
              sed -i 's/^zizmor_status=.*/zizmor_status=FAIL/' security-audit-results/workflows/summary.txt
            fi
            echo "zizmor_action_outcome=${ZIZMOR_OUTCOME:-unknown}" >> security-audit-results/workflows/summary.txt
            echo "zizmor_report_sha256=$report_sha256" >> security-audit-results/workflows/summary.txt
          else
            sed -i 's/^zizmor_status=.*/zizmor_status=INCOMPLETE/' security-audit-results/workflows/summary.txt
            echo "zizmor_action_outcome=${ZIZMOR_OUTCOME:-unknown}" >> security-audit-results/workflows/summary.txt
            echo "report_missing=true" >> security-audit-results/workflows/summary.txt
          fi
          case "${ACTIONLINT_OUTCOME:-unknown}" in
            success) sed -i 's/^actionlint_status=.*/actionlint_status=PASS/' "$summary" ;;
            failure|cancelled) sed -i 's/^actionlint_status=.*/actionlint_status=FAIL/' "$summary" ;;
            *) sed -i 's/^actionlint_status=.*/actionlint_status=INCOMPLETE/' "$summary" ;;
          esac
          echo "actionlint_action_outcome=${ACTIONLINT_OUTCOME:-unknown}" >> "$summary"
          actionlint_report="security-audit-results/workflows/actionlint.txt"
          if [[ -f "$actionlint_report" ]]; then
            echo "actionlint_report_sha256=$(sha256sum "$actionlint_report" | cut -d' ' -f1)" >> "$summary"
          else
            echo "actionlint_report_missing=true" >> "$summary"
          fi
      - name: Upload workflow audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-${{ github.event.repository.name }}-${{ inputs.subject_sha }}-workflows
          path: security-audit-results/workflows/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce workflow and source-secret audit result
        if: always()
