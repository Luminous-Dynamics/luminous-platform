name: edge-policy-conformance-mutations

on:
  pull_request:
    paths:
      - "tools/edge-policy-conformance-mutations/**"
      - "tools/edge-policy-conformance-contracts/**"
      - "schemas/edge-policy-conformance-corpus-v1.schema.json"
      - "examples/edge-policy-conformance-corpus-synthetic-v1.json"
      - "docs/EDGE_POLICY_CONFORMANCE_MUTATIONS_V1.md"
      - ".github/workflows/edge-policy-conformance-mutations.yml"
  push:
    branches: [main, feat/edge-policy-mutation-suite-v1]
    paths:
      - "tools/edge-policy-conformance-mutations/**"
      - "tools/edge-policy-conformance-contracts/**"
      - "schemas/edge-policy-conformance-corpus-v1.schema.json"
      - "examples/edge-policy-conformance-corpus-synthetic-v1.json"
      - "docs/EDGE_POLICY_CONFORMANCE_MUTATIONS_V1.md"
      - ".github/workflows/edge-policy-conformance-mutations.yml"

permissions:
  contents: read

jobs:
  mutation-suite:
    name: Reject 10,000 seeded invalid policy corpora
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/edge-policy-conformance-mutations/Cargo.toml -- --check
      - name: Test mutation determinism and operator coverage
        run: cargo test --manifest-path tools/edge-policy-conformance-mutations/Cargo.toml --all-targets
      - name: Lint with warnings denied
        run: cargo clippy --manifest-path tools/edge-policy-conformance-mutations/Cargo.toml --all-targets -- -D warnings
      - name: Run the frozen 10,000-trial seeded mutation corpus
        run: cargo run --manifest-path tools/edge-policy-conformance-mutations/Cargo.toml --bin edge-policy-conformance-mutations -- --count 10000 --seed 20261019
