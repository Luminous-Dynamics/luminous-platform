[package]
name = "local-first-resilience-profile-validator"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline, fail-closed validator for local-first outage resilience profiles"

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[bin]]
name = "local-first-measurement-receipt-verify"
path = "src/bin/measurement-receipt-verify.rs"
