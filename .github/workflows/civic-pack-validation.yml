name: Civic jurisdiction-pack validation

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/jurisdiction-packs/**"
      - "tools/civic-pack-validator/**"
      - ".github/workflows/civic-pack-validation.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "examples/jurisdiction-packs/**"
      - "tools/civic-pack-validator/**"
      - ".github/workflows/civic-pack-validation.yml"

# Keep one validation run per ref; new commits supersede stale queued runs.
concurrency:
  group: civic-pack-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-jurisdiction-packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned validator dependency
        run: python -m pip install -r tools/civic-pack-validator/requirements.txt
      - name: Compile validator and evaluator
        run: python -m compileall -q tools/civic-pack-validator
      - name: Validate draft sample and emit evidence report
        env:
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          AS_OF="${PR_UPDATED_AT:-$COMMIT_TIMESTAMP}"
          python tools/civic-pack-validator/validate_pack.py \
            --schema schemas/jurisdiction-pack-v0.1.0.schema.json \
            --pack examples/jurisdiction-packs/za-city-of-johannesburg-food-service-0.1.0.json \
            --as-of "$AS_OF" \
            --report /tmp/jurisdiction-pack-validation-report.json
          cat /tmp/jurisdiction-pack-validation-report.json
      - name: Evaluate unpublished example without exposing live guidance
        run: |
          python tools/civic-pack-validator/evaluate_workflow.py \
            --schema schemas/jurisdiction-pack-v0.1.0.schema.json \
            --pack examples/jurisdiction-packs/za-city-of-johannesburg-food-service-0.1.0.json \
            --as-of 2026-10-13T15:00:00Z \
            --jurisdiction za/gauteng/city-of-johannesburg \
            --workflow business.restaurant-launch \
            --business-type sit_down_restaurant \
            --report /tmp/jurisdiction-pack-evaluation.json
          python -c 'import json; r=json.load(open("/tmp/jurisdiction-pack-evaluation.json", encoding="utf-8")); assert r["execution_state"] == "pack_not_published", r; assert r["requirements"] == [], r'
      - name: Run adversarial regression tests
        env:
          PYTHONPATH: tools/civic-pack-validator
        run: python -m unittest discover -s tools/civic-pack-validator/tests -v
      - name: Write validation summary
        if: always()
        env:
          REPORT_PATH: /tmp/jurisdiction-pack-validation-report.json
        run: |
          if [ ! -f "$REPORT_PATH" ]; then
            printf '%s\n' "## Civic jurisdiction-pack validation" "" "No validation report was produced; inspect the failing step logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          lines = [
              "## Civic jurisdiction-pack validation",
              "",
              f"- Pack: `{report.get('pack_id')}` version `{report.get('pack_version')}`",
              f"- Input SHA-256: `{report.get('input_sha256')}`",
              f"- Schema SHA-256: `{report.get('schema_sha256')}`",
              f"- Structural/semantic validation: **{'PASS' if report.get('validation_passed') else 'FAIL'}**",
              f"- Publication eligible: **{'YES' if report.get('publication_eligible') else 'NO'}**",
              f"- Failed checks: {report.get('failed_check_count')}",
              f"- Blocked checks: {report.get('blocked_check_count')}",
              "",
              "Publication eligibility is separate from structural validation. The checked-in Johannesburg fixture is expected to remain unpublished.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: civic-pack-validation-${{ github.sha }}
          path: |
            /tmp/jurisdiction-pack-validation-report.json
            /tmp/jurisdiction-pack-evaluation.json
          if-no-files-found: ignore
          retention-days: 14
