name: Security Audit Verifier Rust Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/security-audit-verifier-rs/**'
      - '.github/workflows/security-audit-verifier-rust-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-rust-candidate-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Format, lint, and test Rust verifier candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Run candidate tests
        run: cargo +1.96.0 test --manifest-path .github/security-audit-verifier-rs/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo +1.96.0 clippy --manifest-path .github/security-audit-verifier-rs/Cargo.toml --all-targets -- -D warnings

      - name: Preserve generated dependency lock for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-verifier-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: .github/security-audit-verifier-rs/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
