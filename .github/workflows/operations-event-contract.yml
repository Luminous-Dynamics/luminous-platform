name: Operations Event and Work Case Contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/operations-event-v1/**"
      - "contracts/work-case-v1/**"
      - "scripts/run_unittest_suite.py"
      - "scripts/tests/**"
      - ".github/workflows/operations-event-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/operations-event-v1/**"
      - "contracts/work-case-v1/**"
      - "scripts/run_unittest_suite.py"
      - "scripts/tests/**"
      - ".github/workflows/operations-event-contract.yml"

permissions:
  contents: read

concurrency:
  group: operations-event-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.12"

      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/operations-event-contract-venv"

      - name: Install pinned schema validator
        run: >-
          "$RUNNER_TEMP/operations-event-contract-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir -r contracts/operations-event-v1/requirements.txt

      - name: Self-test fail-closed test runner
        run: >-
          "$RUNNER_TEMP/operations-event-contract-venv/bin/python" -m unittest discover -s scripts/tests -p 'test_run_unittest_suite.py' -v

      - name: Validate Operations Event Contract V1
        run: >-
          "$RUNNER_TEMP/operations-event-contract-venv/bin/python" scripts/run_unittest_suite.py contracts/operations-event-v1/tests --minimum-tests 1

      - name: Validate native Work Case Contract V1
        run: >-
          "$RUNNER_TEMP/operations-event-contract-venv/bin/python" scripts/run_unittest_suite.py contracts/work-case-v1/tests --minimum-tests 28

      - name: Write bounded qualification summary
        if: success()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Luminous operations contracts"
            echo "- Tested source revision: $SOURCE_SHA"
            echo "- Operations Event V1 suite executed with fail-closed discovery; Work Case V1 requires at least 28 discovered test cases and executes the discovered set."
            echo "- Covers the Operations Event V1 schemas/synthetic adapter/local SQLite reference model and Work Case V1 schema/synthetic fixture/in-memory state-machine reference model."
            echo "- Does not qualify a live ConnectWise adapter, production database isolation/durability, production tenant authorization, distributed-writer behavior, cryptographic evidence verification, or remote execution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm checkout stayed unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"
