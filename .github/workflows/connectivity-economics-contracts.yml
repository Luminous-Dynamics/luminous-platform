name: connectivity-economics-contracts

on:
  pull_request:
    paths:
      - "tools/connectivity-unit-economics-core/**"
      - "docs/CONNECTIVITY_UNIT_ECONOMICS_V1.md"
      - "profiles/connectivity-price-observations-south-africa-v1.json"
      - "schemas/connectivity-price-observations-south-africa-v1.schema.json"
      - "profiles/connectivity-price-observations-south-africa-v1.json"
      - "schemas/connectivity-price-observations-south-africa-v1.schema.json"
      - ".github/workflows/connectivity-economics-contracts.yml"
  push:
    branches: [main, feat/connectivity-unit-economics-v1]
    paths:
      - "tools/connectivity-unit-economics-core/**"
      - "docs/CONNECTIVITY_UNIT_ECONOMICS_V1.md"
      - ".github/workflows/connectivity-economics-contracts.yml"

permissions:
  contents: read

concurrency:
  group: connectivity-economics-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-economics:
    name: Integer unit-economics contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and Clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # immutable revision
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Test integer economics core
        run: cargo test --manifest-path tools/connectivity-unit-economics-core/Cargo.toml --all-targets

      - name: Lint integer economics core
        run: cargo clippy --manifest-path tools/connectivity-unit-economics-core/Cargo.toml --all-targets -- -D warnings
