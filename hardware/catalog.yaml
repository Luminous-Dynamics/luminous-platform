status_definitions:
  discovered: "A public source or product lead has been found; no fit claim."
  reference_candidate: "Suitable for bounded lab/reference evaluation with stated limitations."
  prototype: "An exact configuration has been assembled and build inputs are recorded."
  integration_qualified: "Required functional, negative, security, interoperability, performance, and recovery tests executed and passed for a stated profile."
  procurement_ready: "Current supply, lifecycle, warranty/support, provenance, and jurisdictional requirements checked."
  customer_authorized: "Customer authority approves the exact configuration, use, and classification."
