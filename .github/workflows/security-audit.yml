              # Read gitlinks from the committed subject tree, not the index.
              # ls-tree -z keeps arbitrary path bytes delimited without relying
              # on tabs/newlines as path separators.
              raw = git_output(root, "ls-tree", "-r", "-z", "--full-tree", "HEAD")
              found = []
              for record in raw.split(bytes([0])):
                  if not record:
                      continue
                  metadata, path_bytes = record.split(bytes([9]), 1)
                  fields = metadata.split()
                  if fields and fields[0] == b"160000" and fields[1] == b"commit":
                      path = path_bytes.decode("utf-8", "strict")
                      if any(ord(character) < 0x20 or ord(character) == 0x7F for character in path) or "=" in path:
                          raise ValueError(f"gitlink path cannot be represented safely in audit evidence: {path!r}")
