[package]
name = "edge-policy-conformance-contracts"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline benchmark-corpus contract validator for Luminous Edge policy conformance"

[dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "=1.0.145"

[lib]
path = "src/lib.rs"

[[bin]]
name = "edge-policy-conformance-verify"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
