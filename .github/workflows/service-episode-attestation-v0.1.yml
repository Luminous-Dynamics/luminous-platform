name: Service Episode Attestation v0.1
on:
  pull_request:
    paths:
      - "docs/SERVICE_EPISODE_ATTESTATION_V0_1.md"
      - "docs/ADR_ATTESTATION_VERIFIER_CRYPTO_LIB_0001.md"
      - "benchmarks/service-episode-attestation-v0.1/**"
      - "tools/service-episode-attestation-v0.1/**"
      - ".github/workflows/service-episode-attestation-v0.1.yml"
  push:
    branches:
      - "research/service-episode-attestation-v0.1-2026-10-31"
    paths:
      - "docs/SERVICE_EPISODE_ATTESTATION_V0_1.md"
      - "benchmarks/service-episode-attestation-v0.1/**"
      - "tools/service-episode-attestation-v0.1/**"
      - ".github/workflows/service-episode-attestation-v0.1.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate predicate, bundle and evaluator vectors
        run: python3 tools/service-episode-attestation-v0.1/check_attestation.py
      - name: Run adversarial mutation tests
        run: python3 -m unittest discover -s tools/service-episode-attestation-v0.1 -p 'test_*.py' -v
