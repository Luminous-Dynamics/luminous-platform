name: SRQ bounded linearizability oracle

on:
  pull_request:
    paths:
      - '.github/workflows/srq-linearizability-oracle.yml'
      - 'benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linearizability-oracle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run checker tests
        run: python -m unittest discover -s benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle -p 'test_*.py' -v
      - name: Require valid concurrent retry witness
        env:
          SRQ_LIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SRQ_LIN_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/linearizability_oracle.py benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/fixtures/valid-concurrent-same-key.json --output "$RUNNER_TEMP/srq-lin-positive.json"
          python3 - "$RUNNER_TEMP/srq-lin-positive.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["schema"] == "srq-linearizability-report-v1"
          assert report["status"] == "LINEARIZABLE"
          assert len(report["linearization"]) == 2
          assert report["liveness_claim"] == "NOT_EVALUATED"
          assert report["qualification_status"] == "BLOCKED"
          assert report["claim_ceiling"] == "none"
          assert report["harness_commit_sha"] == os.environ["SRQ_LIN_CHECKOUT_SHA"]
          assert report["source_head_sha"] == os.environ["SRQ_LIN_PR_HEAD_SHA"]
          assert report["workflow_event_sha"] == os.environ["GITHUB_SHA"]
          assert all(len(v) == 64 for v in report["source_sha256"].values())
          PY
      - name: Require duplicate-effect history to fail
        env:
          SRQ_LIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SRQ_LIN_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/linearizability_oracle.py benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/fixtures/invalid-duplicate-effect.json --output "$RUNNER_TEMP/srq-lin-duplicate.json"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then echo "Expected NON_LINEARIZABLE (exit 1), got $status"; exit 1; fi
          python3 - "$RUNNER_TEMP/srq-lin-duplicate.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "NON_LINEARIZABLE"
          assert report["linearization"] is None
          assert report["harness_commit_sha"] == os.environ["SRQ_LIN_CHECKOUT_SHA"]
          assert report["source_head_sha"] == os.environ["SRQ_LIN_PR_HEAD_SHA"]
          PY
      - name: Require real-time ordering to fail
        env:
          SRQ_LIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SRQ_LIN_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/linearizability_oracle.py benchmarks/srq-lifecycle-interop/guarantee-vector/linearizability-oracle/fixtures/invalid-realtime-conflict.json --output "$RUNNER_TEMP/srq-lin-realtime.json"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then echo "Expected NON_LINEARIZABLE (exit 1), got $status"; exit 1; fi
          python3 - "$RUNNER_TEMP/srq-lin-realtime.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["status"] == "NON_LINEARIZABLE"
          assert report["harness_commit_sha"] == os.environ["SRQ_LIN_CHECKOUT_SHA"]
          assert report["source_head_sha"] == os.environ["SRQ_LIN_PR_HEAD_SHA"]
          PY
      - name: Retain exact-head reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srq-linearizability-oracle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/srq-lin-positive.json
            ${{ runner.temp }}/srq-lin-duplicate.json
            ${{ runner.temp }}/srq-lin-realtime.json
          if-no-files-found: warn
          retention-days: 30
