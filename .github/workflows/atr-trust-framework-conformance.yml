name: ATR WIMSE trust-framework conformance

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/WIMSE_TRUST_FRAMEWORK_CONFORMANCE_PROFILE_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/trust-framework-conformance-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/trust-framework-conformance-v0.1.json"
      - "tools/validate_trust_framework_conformance.py"
      - ".github/workflows/atr-trust-framework-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-framework:
    name: WIMSE mandate Trust-Framework conformance contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate instruction evidence, RP budgets and unknown consumption
        run: python tools/validate_trust_framework_conformance.py
