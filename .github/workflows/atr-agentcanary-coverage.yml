name: ATR AgentCanary Entry Impact coverage contract

on:
  pull_request:
    paths:
      - "research/agentic-threat-resilience-v0.1/AGENTCANARY_ADAPTER_PROTOCOL_V0_1.md"
      - "research/agentic-threat-resilience-v0.1/schemas/agentcanary-entry-impact-coverage-v0.1.schema.json"
      - "research/agentic-threat-resilience-v0.1/scenarios/agentcanary-entry-impact-coverage-v0.1.json"
      - "tools/validate_agentcanary_coverage.py"
      - ".github/workflows/atr-agentcanary-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-impact-coverage:
    name: AgentCanary 5 x 7 coverage and evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Validate complete Entry x Impact matrix and evidence-state rules
        run: python tools/validate_agentcanary_coverage.py
